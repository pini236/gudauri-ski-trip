# The daily keepalive (decision 28): the free Supabase plan pauses a project
# with too little database activity for a week. Once a day this calls
# keepalive() through the public API (server/supabase/migrations/*_keepalive.sql).
#
# Needs two repository variables (Settings > Secrets and variables > Actions >
# Variables), set once the project exists: SUPABASE_URL and
# SUPABASE_PUBLISHABLE_KEY (the public key; not a secret). Until then it
# does nothing.
#
# GitHub turns off scheduled workflows in a repository with no activity for
# 60 days; it sends an email first, and one click turns it back on.
name: server-keepalive

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call keepalive()
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::notice::No Supabase project yet (SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY not set). Nothing to do."
            exit 0
          fi
          for i in 1 2 3; do
            if curl -fsS -X POST "$URL/rest/v1/rpc/keepalive" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'; then
              echo; exit 0
            fi
            sleep $((i * 30))
          done
          echo "::error::keepalive failed three times"; exit 1
