# The daily keepalive (decision 28): the free Supabase plan pauses a project
# with too little database activity for a week. Once a day this calls the
# server's keepalive action (server/supabase/functions/api/), which writes
# to the database and, once a day, cleans up unused guest identities.
#
# The project's address and publishable key are public by design (the
# apps carry them too), so they are written here. Repository variables
# SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY override them if ever set.
#
# GitHub turns off scheduled workflows in a repository with no activity for
# 60 days; it sends an email first, and one click turns it back on.
#
# When it fails, or the server says the previous beat is more than 36 hours
# old (a missed day), one issue is opened (or commented on) so Pini gets an
# email, and the next run that passes closes it (docs/ARCHITECTURE.md, R-12).
# A run that never starts (GitHub turned it off) is caught only by an outside
# check: docs/OPERATIONS.md.
name: server-keepalive

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call keepalive()
        env:
          URL: ${{ vars.SUPABASE_URL || 'https://vanuhuzuhnljvcoihvys.supabase.co' }}
          KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_BpJiIkRbIob7U6xa_Xt_9A_AJqtoupz' }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::notice::No Supabase project yet (SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY not set). Nothing to do."
            exit 0
          fi
          for i in 1 2 3; do
            if out=$(curl -fsS -X POST "$URL/functions/v1/api/keepalive" -H "apikey: $KEY" -H "x-region: eu-central-1" -H "Content-Type: application/json" -d '{}'); then
              echo "$out"
              if echo "$out" | grep -q '"stale":true'; then
                echo "::error::the previous keepalive was more than 36 hours ago: a day was missed"; exit 1
              fi
              exit 0
            fi
            sleep $((i * 30))
          done
          echo "::error::keepalive failed three times"; exit 1

      - name: All good again, close the alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="The server's daily task (keepalive) failed"
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue close "$n" -R "$GITHUB_REPOSITORY" -c "Passed again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; fi

      - name: Tell Pini (one issue, commented on again each time)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The server's daily task (keepalive) failed"
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          body="The daily keepalive failed or found a missed day: $RUN. Without it the free Supabase plan pauses the project after a week. server/README.md, 'פריסה'."
          if [ -n "$n" ]; then gh issue comment "$n" -R "$GITHUB_REPOSITORY" -b "$body"; else gh issue create -R "$GITHUB_REPOSITORY" -t "$title" -b "$body"; fi
