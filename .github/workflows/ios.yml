name: iOS

# The iPhone app (decision 71): built and tested on GitHub's Macs, with no Apple account yet. No signing and no
# secrets here; signing and TestFlight come later in an `ios-release` environment limited to main (docs/APPLE.md, 4).
# Reviewed by the architect (docs/ARCHITECTURE.md, 21.10.2026) and DevOps (decision 66) before merge.
on:
  push:
    paths: ['app/ios/**', 'site/data/**', 'site/games/descent/**', 'site/games/thumbs/**', 'site/js/relief.js', 'site/css/site.css', 'tools/fixtures/**', 'tools/build-ios-data.py', 'tools/build-ios-strings.py', 'i18n/strings.json', '.github/workflows/ios.yml', 'tools/check-ios-variant.sh', 'tools/check-ios-isolation.sh', 'tools/check-ios-no-tests.sh']
  pull_request:
    paths: ['app/ios/**', 'site/data/**', 'site/games/descent/**', 'site/games/thumbs/**', 'site/js/relief.js', 'site/css/site.css', 'tools/fixtures/**', 'tools/build-ios-data.py', 'tools/build-ios-strings.py', 'i18n/strings.json', '.github/workflows/ios.yml', 'tools/check-ios-variant.sh', 'tools/check-ios-isolation.sh', 'tools/check-ios-no-tests.sh']
  workflow_dispatch:
    inputs:
      variant:
        description: 'plain = 1.0 (default). dayrec = 1.1 with day recording: simulator only, no signing, no upload'
        type: choice
        options: [plain, dayrec]
        default: plain

# a branch's newer push replaces its running build; main never cancels one halfway
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  VARIANT: ${{ inputs.variant || 'plain' }}
  # the Mac image and Xcode are named, not "latest", so a run does not break when GitHub moves them
  XCODE_PREFIX: Xcode_26.6
  XCODEGEN_VERSION: "2.44.1"
  # sha256 of xcodegen.zip for that version, checked before use (no curl | sh)
  XCODEGEN_SHA256: a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73

jobs:
  # The Mac simulator build (34 minutes) is the biggest cost of the pipeline (docs/CI-AUDIT.md, 24.11.2026): on a branch it
  # runs only when the app's own files changed, or by hand; on main every push runs it, as before. The logic tests (core)
  # and the isolation gate run on every push, always.
  plan:
    name: Does this push need the simulator build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.p.outputs.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -u
          if [ "$EVENT" = workflow_dispatch ]; then echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" = pull_request ]; then base="origin/$BASE_REF"; elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0*$' && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then base="$BEFORE"; elif [ "$REF" = refs/heads/main ]; then echo "app=true" >> "$GITHUB_OUTPUT"; echo "main without a before commit: build"; exit 0; else base=$(git merge-base origin/main HEAD); fi
          files=$(git diff --name-only "$base" HEAD)
          # the app's own code and the scripts that pack its data, strings and workflow
          if echo "$files" | grep -q -E '^(app/ios/|tools/build-ios-|\.github/workflows/ios\.yml)'; then echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$REF" = refs/heads/main ]; then
            # on main the data the app packs also counts (the shared site data, the relief and tokens it is tested against)
            if echo "$files" | grep -q -E '^(site/data/|site/games/descent/|site/games/thumbs/|site/js/relief\.js|site/css/site\.css|tools/fixtures/)'; then echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            # the strings: a text edit or a new key cannot break the build; a removed key, or one whose placeholders or plural
            # shape changed, can (the app's typed accessors, tools/build-ios-strings.py)
            if echo "$files" | grep -q '^i18n/strings\.json$'; then
              if python3 - "$base" <<'PYTHON'
          import json, re, subprocess, sys
          SKIP = re.compile(r"^(game\.[a-z]+\.friend_|tester\.|poc\.)")
          PH = re.compile(r"\{([a-zA-Z_][a-zA-Z0-9_]*)\}")
          def load(text):
              return json.loads(text)["strings"]
          def shape(e):
              ps = set()
              for l in ("he", "en", "ru", "ka"):
                  t = e.get(l)
                  for form in (t.values() if isinstance(t, dict) else [t or ""]):
                      ps.update(PH.findall(form))
              return (isinstance(e.get("he"), dict), frozenset(ps))
          try:
              old = load(subprocess.run(["git", "show", sys.argv[1] + ":i18n/strings.json"], capture_output=True, text=True, check=True).stdout)
              new = load(open("i18n/strings.json", encoding="utf-8").read())
          except Exception as e:
              print("cannot compare the strings, build:", e); sys.exit(0)
          for k, e in old.items():
              if SKIP.match(k):
                  continue
              if k not in new or shape(new[k]) != shape(e):
                  print("a key the app reads was removed or changed in shape:", k); sys.exit(0)
          sys.exit(1)
          PYTHON
              then echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            fi
          fi
          echo "app=false" >> "$GITHUB_OUTPUT"; echo "the simulator build is skipped: nothing the app builds from changed (run it by hand with workflow_dispatch)"

  core:
    name: Logic (GudiCore) tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Gate, no closure literal handed to a background-queue system API from a @MainActor file
        run: sh tools/check-ios-isolation.sh
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/${XCODE_PREFIX}.app)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: swift test
        run: swift test --package-path app/ios/Packages/GudiCore

  app:
    name: App build and simulator screenshot
    needs: plan
    if: needs.plan.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Select Xcode
        run: |
          X=$(ls -d /Applications/${XCODE_PREFIX}.app)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Start the simulator now, it boots while the app builds
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          ios=[(k,v) for k,v in d.items() if 'iOS' in k]
          ios.sort()
          phones=[x for x in ios[-1][1] if x['name'].startswith('iPhone')]
          print(phones[-1]['udid'])")
          echo "simulator $UDID"
          echo "$UDID" > "$RUNNER_TEMP/udid"
          # returns once the boot is under way (a failure here fails the job); the slow first-boot migration goes on
          # in the background, and the screenshot step waits for it with bootstatus
          xcrun simctl boot "$UDID"
      - name: XcodeGen (pinned, checked)
        run: |
          curl -fsSL -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          SUM=$(shasum -a 256 xcodegen.zip | cut -d' ' -f1)
          echo "xcodegen.zip sha256: $SUM"
          [ -n "$XCODEGEN_SHA256" ] && [ "$SUM" = "$XCODEGEN_SHA256" ] || { echo "::error::xcodegen.zip sha256 mismatch"; exit 1; }
          unzip -q xcodegen.zip -d "$RUNNER_TEMP/xg"
          echo "$RUNNER_TEMP/xg/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Data from the site, and the project
        run: |
          python3 tools/build-ios-data.py
          python3 tools/build-ios-strings.py app/ios/Gudi/Resources/Data/strings.json app/ios/Gudi/Generated/S.swift
          cd app/ios
          # a push or pull request is always plain; dayrec only by a manual run, and this workflow never signs or uploads
          if [ "$VARIANT" = dayrec ]; then
            test -f project-dayrec.yml || { echo "::error::project-dayrec.yml is missing"; exit 1; }
            xcodegen generate --spec project-dayrec.yml
          else
            xcodegen generate
          fi
      - name: Build for the simulator
        run: |
          cd app/ios
          xcodebuild -project Gudi.xcodeproj -scheme Gudi -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1 || RC=$?
          RC=${RC:-0}
          tail -40 "$RUNNER_TEMP/build.log"
          # the compiler's own errors, which the last 40 lines usually leave out
          grep -E "error:|warning: .*will be an error" "$RUNNER_TEMP/build.log" | sort -u | head -60 || true
          test "$RC" -eq 0
      - name: Gate, the compiled app matches the variant
        run: sh tools/check-ios-variant.sh "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Gudi.app/Info.plist" "$VARIANT"
      - name: Gate, the built app carries no test bundle
        run: sh tools/check-ios-no-tests.sh "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Gudi.app"
      - name: Run in a simulator and take a screenshot
        timeout-minutes: 30
        run: |
          set -x
          UDID=$(cat "$RUNNER_TEMP/udid")
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          echo "booted after ${SECONDS}s"
          APP=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Debug-iphonesimulator/Gudi.app)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          # every part's screenshots (app/ios/qa/shots/*.txt): language, day or night, a made-up trip, a screen to open
          cat app/ios/qa/shots/*.txt | grep -v '^#' | grep -v '^ *$' | while read -r name lang dn trip route; do
            xcrun simctl launch --terminate-running-process "$UDID" io.github.pini236.skiapp \
              -lang "$lang" -dayNight "$dn" -qaTrip "$trip" -qaRoute "$route" < /dev/null
            sleep 6
            xcrun simctl io "$UDID" screenshot "shots/$name.png" < /dev/null
          done
      - name: App tests, the system-boundary handlers called from a side queue
        timeout-minutes: 20
        run: |
          # after the screenshot step: this installs a second copy of the app (same id) on the same simulator
          UDID=$(cat "$RUNNER_TEMP/udid")
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          cd app/ios
          # its own derived data, so the app built above (and checked by the gate) is not touched; no signing
          xcodebuild test -project Gudi.xcodeproj -scheme GudiAppTests -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/ddt" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/test.log" 2>&1 || RC=$?
          RC=${RC:-0}
          tail -40 "$RUNNER_TEMP/test.log"
          grep -E "error:|Test Case .* failed" "$RUNNER_TEMP/test.log" | sort -u | head -40 || true
          test "$RC" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-screenshots
          path: shots/
          retention-days: 14
