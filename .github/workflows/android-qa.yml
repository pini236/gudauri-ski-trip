# The Android emulator run (app/android/qa/README.md). GitHub's machines have hardware virtualisation and
# Claude's cloud container does not, so the emulator runs here: build the debug app, boot an emulator, drive
# the app through its screens (app/android/qa/run.sh) and publish the screenshots, logs and numbers as one
# release, android-qa, that always holds the latest run. Claude starts it on any branch and reads the result.
name: android-qa

on:
  # automatically only on main: several sessions push their own branches, and each run there would push the
  # waiting run on main out of the single slot below. Another branch runs it by hand (workflow_dispatch).
  push:
    branches: [main]
    paths: ['app/android/**', 'site/data/**', 'site/audio/**', 'site/games/descent/**', 'site/games/thumbs/**', 'site/img/pano/**', 'tools/build-app-data.py', 'tools/build-app-strings.py', 'i18n/strings.json', '.github/workflows/android-qa.yml']
  workflow_dispatch:
    inputs:
      scenario:
        description: 'map, descent, games, school, snowball, home, group, meet, status, run, locate, weather, lang, phone, store; commas or all'
        default: all
      quick_debug:
        description: 'Diagnostic only: debug APK; skip final Sentry and release checks (choose a specific scenario) '
        type: boolean
        default: false
      api:
        description: 'Android version of the emulator (API level)'
        default: '35'

# main keeps one run at a time, so its release always matches one run; a branch's newer run replaces its older one,
# and never waits behind main (3.10.2026: branch runs used to queue behind every full run on main)
concurrency:
  group: android-qa-${{ github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.quick_debug && 'diagnostic' || 'full' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

# read-only by default (docs/ARCHITECTURE.md, R-10); only the job that publishes the results writes
permissions:
  contents: read

# Build once, then every part of the run on an emulator of its own, all at the same time (3.10.2026: the whole run
# took about 30 minutes in a row), then one job puts the parts together and publishes them.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
      final: ${{ steps.plan.outputs.final }}
      quick_debug: ${{ steps.plan.outputs.quick_debug }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate and plan the parts
        id: plan
        env:
          QA_SCENARIO: ${{ inputs.scenario || 'all' }}
          QA_API: ${{ inputs.api || '35' }}
          QA_QUICK_DEBUG: ${{ github.event_name == 'workflow_dispatch' && inputs.quick_debug }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          allowed = "map,descent,games,school,snowball,home,group,meet,status,run,locate,weather,lang,phone,store".split(",")
          scenario = os.environ["QA_SCENARIO"].strip()
          quick = os.environ["QA_QUICK_DEBUG"] == "true"
          if quick and scenario == "all":
              raise SystemExit("Diagnostic quick_debug requires a specific scenario; full coverage uses quick_debug=false")
          parts = allowed if scenario == "all" else [p.strip() for p in scenario.split(",")]
          if not parts or any(p not in allowed for p in parts) or len(set(parts)) != len(parts):
              raise SystemExit("Unknown, empty or duplicate QA part; choose all or comma-separated supported parts")
          api = os.environ["QA_API"]
          if not api.isascii() or not api.isdecimal() or int(api) < 26:
              raise SystemExit("QA API must be a numeric Android API level >= 26")
          final = next((p for p in parts if p != "phone"), parts[0])
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("parts=" + json.dumps(parts) + "\n")
              out.write("final=" + final + "\n")
              out.write("quick_debug=" + str(quick).lower() + "\n")
          PYTHON
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Android SDK
        run: |
          # yes may receive SIGPIPE after sdkmanager exits; preserve sdkmanager's own result.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          sdkmanager_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$sdkmanager_status" -eq 0
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0" > /dev/null
      - name: Build the required apps
        working-directory: app/android
        # with the usage and crash keys, so the run also checks that events and crash reports arrive; every event
        # carries build=debug, and the dashboards filter it out (docs/GROWTH.md)
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          QA_QUICK_DEBUG: ${{ steps.plan.outputs.quick_debug }}
        shell: bash
        run: |
          set -euo pipefail
          tasks=(:app:assemblePreviewDebug)
          [[ "$QA_QUICK_DEBUG" == true ]] || tasks+=(:app:assemblePreviewRelease)
          # These tasks compile APKs; no unit-test task is cached here.
          ./gradlew --no-daemon --build-cache "${tasks[@]}"
          test -f app/build/outputs/apk/preview/debug/app-preview-debug.apk
          if [[ "$QA_QUICK_DEBUG" != true ]]; then
            test -f app/build/outputs/apk/preview/release/app-preview-release.apk
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apks
          overwrite: true
          retention-days: 14
          if-no-files-found: error
          path: |
            app/android/app/build/outputs/apk/preview/debug/app-preview-debug.apk
            app/android/app/build/outputs/apk/preview/release/app-preview-release.apk

  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.build.outputs.parts) }}
    env:
      OUT: ${{ github.workspace }}/qa-out
      SCENARIO: ${{ matrix.part }}
      ANDROID_API: ${{ inputs.api || '35' }}
      AVD_NAME: gudauri-qa-clean
      # the release build's start and the crash-report check run once, with one part
      FINAL: ${{ needs.build.outputs.quick_debug != 'true' && matrix.part == needs.build.outputs.final && '1' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apks
          path: app/android/app/build/outputs/apk/preview
      - name: Hardware virtualisation for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record diagnostic coverage
        if: needs.build.outputs.quick_debug == 'true'
        run: |
          mkdir -p "$OUT"
          echo "DIAGNOSTIC quick_debug: final Sentry and release startup checks NOT RUN" > "$OUT/summary.txt"
          echo "### Diagnostic run: final Sentry and release startup checks not run" >> "$GITHUB_STEP_SUMMARY"
      - name: Install emulator inputs and fingerprint their actual revisions
        id: avd-key
        env:
          RUNNER_IMAGE_OS: ${{ runner.os }}
          RUNNER_CPU_ARCH: ${{ runner.arch }}
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses > /dev/null
          sdkmanager_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$sdkmanager_status" -eq 0
          "$sdkmanager" --install emulator platform-tools \
            "system-images;android-${ANDROID_API};google_apis;x86_64"
          cat > "$RUNNER_TEMP/avd-inputs.py" <<'PYTHON'
          import hashlib, json, os, pathlib, shutil, sys

          def revision(relative):
              path = pathlib.Path(os.environ['ANDROID_HOME']) / relative / 'source.properties'
              props = dict(line.split('=', 1) for line in path.read_text().splitlines()
                           if '=' in line and not line.lstrip().startswith('#'))
              return props['Pkg.Revision'].strip()

          api = os.environ['ANDROID_API']
          identity = {
              'schema': 1,
              'runner_os': os.environ['RUNNER_IMAGE_OS'],
              'runner_arch': os.environ['RUNNER_CPU_ARCH'],
              'image_os': os.environ.get('ImageOS', ''),
              'image_version': os.environ.get('ImageVersion', ''),
              'cpu_model': next((line.split(':', 1)[1].strip()
                  for line in pathlib.Path('/proc/cpuinfo').read_text().splitlines()
                  if line.startswith('model name')), ''),
              'api': api, 'target': 'google_apis', 'arch': 'x86_64',
              'profile': 'pixel_6', 'cores': 2, 'gpu': 'swiftshader_indirect',
              'disable_animations': False,
              'action': 'a421e43855164a8197daf9d8d40fe71c6996bb0d',
              'emulator_revision': revision('emulator'),
              'platform_tools_revision': revision('platform-tools'),
              'cmdline_tools_revision': revision('cmdline-tools/latest'),
              'system_image_revision': revision(
                  f'system-images/android-{api}/google_apis/x86_64'),
          }
          expected = pathlib.Path(os.environ['RUNNER_TEMP']) / 'avd-expected.json'
          if len(sys.argv) > 1 and sys.argv[1] == 'verify':
              if identity != json.loads(expected.read_text()):
                  # The action marks a failed pre-launch command but still attempts launch.
                  # Remove only this dedicated local AVD so an incompatible snapshot cannot boot.
                  avd = pathlib.Path.home() / '.android' / 'avd'
                  shutil.rmtree(avd / 'gudauri-qa-clean.avd', ignore_errors=True)
                  (avd / 'gudauri-qa-clean.ini').unlink(missing_ok=True)
                  sys.exit('SDK revisions changed before launch; refuse an incompatible AVD.')
          else:
              expected.write_text(json.dumps(identity, sort_keys=True))
              digest = hashlib.sha256(expected.read_bytes()).hexdigest()
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write(f'key=gudauri-pristine-avd-v1-{digest}\n')
              print(json.dumps(identity, sort_keys=True))
          PYTHON
          python3 "$RUNNER_TEMP/avd-inputs.py"
      - name: Restore only the matching pristine AVD
        id: avd-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.android/avd/gudauri-qa-clean.avd
            ~/.android/avd/gudauri-qa-clean.ini
          key: ${{ steps.avd-key.outputs.key }}
      - name: Generate a pristine snapshot on a cache miss
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          RUNNER_IMAGE_OS: ${{ runner.os }}
          RUNNER_CPU_ARCH: ${{ runner.arch }}
        with:
          api-level: ${{ env.ANDROID_API }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: gudauri-qa-clean
          force-avd-creation: false
          disable-animations: false
          pre-emulator-launch-script: python3 "$RUNNER_TEMP/avd-inputs.py" verify
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            # No app, accounts, fixture data or telemetry keys enter this snapshot.
            if adb shell pm path io.github.pini236.skiapp.test | grep -q '^package:'; then exit 1; fi
            if adb shell dumpsys account | grep -q 'Account {'; then exit 1; fi
            echo "Generated pristine AVD; no APK installed."
      - name: Wait for the pristine snapshot to finish saving
        if: steps.avd-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # emu kill can acknowledge shutdown while QEMU is still writing the snapshot.
          process_pattern='^.*/qemu-system-.* -avd gudauri-qa-clean( |$)'
          for attempt in {1..60}; do
            pgrep -f "$process_pattern" > /dev/null || break
            sleep 1
          done
          if pgrep -f "$process_pattern" > /dev/null; then
            echo "Pristine emulator did not stop; refuse to cache partially written userdata."
            exit 1
          fi
          test -s "$HOME/.android/avd/gudauri-qa-clean.avd/snapshots/default_boot/snapshot.pb"
      - name: Save pristine userdata before the test can change it
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.android/avd/gudauri-qa-clean.avd
            ~/.android/avd/gudauri-qa-clean.ini
          key: ${{ steps.avd-key.outputs.key }}
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          RUNNER_IMAGE_OS: ${{ runner.os }}
          RUNNER_CPU_ARCH: ${{ runner.arch }}
        with:
          api-level: ${{ env.ANDROID_API }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: gudauri-qa-clean
          force-avd-creation: false
          disable-animations: false
          pre-emulator-launch-script: python3 "$RUNNER_TEMP/avd-inputs.py" verify
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: |
            if adb shell pm path io.github.pini236.skiapp.test | grep -q '^package:'; then exit 1; fi
            if adb shell dumpsys account | grep -q 'Account {'; then exit 1; fi
            bash app/android/qa/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: android-qa-${{ matrix.part }}
          overwrite: true
          path: qa-out
          retention-days: 14

  publish:
    needs: [build, emulator]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OUT: ${{ github.workspace }}/qa-out
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: android-qa-*
          path: parts
      - name: One result from the parts
        run: |
          mkdir -p "$OUT/shots" "$OUT/parts"
          for d in parts/android-qa-*; do
            p=${d#parts/android-qa-}
            cp -r "$d" "$OUT/parts/$p"
            { echo "== $p"; cat "$d/summary.txt" 2>/dev/null || echo "(no summary)"; echo; } >> "$OUT/summary.txt"
            for f in "$d"/shots/*.png; do [ -f "$f" ] && cp "$f" "$OUT/shots/$p-$(basename "$f")"; done
            # the store screenshots, where the release has always had them
            if [ -d "$d/store" ]; then mkdir -p "$OUT/store"; cp "$d"/store/*.png "$OUT/store/" 2> /dev/null || true; fi
          done
          cat "$OUT/summary.txt"
      - name: Contact sheets
        run: |
          pip install --quiet pillow
          python3 app/android/qa/sheet.py "$OUT/shots" "$OUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-qa
          overwrite: true
          path: qa-out
          retention-days: 14
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          QA_QUICK_DEBUG: ${{ needs.build.outputs.quick_debug }}
        run: |
          cd "$OUT" && zip -qr "$RUNNER_TEMP/qa.zip" . && cd -
          # main keeps its own results; a branch's run goes to a release of its own, so it never covers main's
          tag=android-qa; [ "$GITHUB_REF_NAME" = main ] || tag=android-qa-branch
          # Diagnostics must not replace the results of the full main/branch checks.
          [ "$QA_QUICK_DEBUG" != true ] || tag=android-qa-diagnostic
          title="אנדרואיד: בדיקה באמולטור$([ "$tag" = android-qa ] || echo " (ענף ${GITHUB_REF_NAME})")"
          files=("$RUNNER_TEMP/qa.zip" "$OUT"/sheet-*.png $(ls "$OUT"/store/*.png 2> /dev/null || true))
          {
            echo "בדיקה באמולטור, ענף ${GITHUB_REF_NAME}, קומיט ${GITHUB_SHA::7}."
            echo "הריצה: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            cat "$OUT/summary.txt" 2>/dev/null || echo "(no summary: the run stopped before the app started)"
          } > "$RUNNER_TEMP/notes.md"
          # the release stays where it is and only its files change (R-10: main's used to be deleted and created again,
          # and a new tag on a branch's commit was refused to the run's token, HTTP 403, 3.10.2026); the notes name the commit
          gh release view "$tag" > /dev/null 2>&1 \
            || gh release create "$tag" --prerelease --target "${{ github.event.repository.default_branch }}" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          gh release view "$tag" --json assets -q '.assets[].name' | while read -r a; do gh release delete-asset "$tag" "$a" --yes; done
          gh release upload "$tag" "${files[@]}" --clobber
          gh release edit "$tag" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
