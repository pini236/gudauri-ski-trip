# The Android emulator run (app/android/qa/README.md). GitHub's machines have hardware virtualisation and
# Claude's cloud container does not, so the emulator runs here: build the debug app, boot an emulator, drive
# the app through its screens (app/android/qa/run.sh) and publish the screenshots, logs and numbers as one
# release, android-qa, that always holds the latest run. Claude starts it on any branch and reads the result.
name: android-qa

on:
  # automatically only on main: several sessions push their own branches, and each run there would push the
  # waiting run on main out of the single slot below. Another branch runs it by hand (workflow_dispatch).
  push:
    branches: [main]
    paths: ['app/android/**', 'site/data/**', 'site/audio/**', 'site/games/descent/**', 'site/games/thumbs/**', 'site/img/pano/**', 'tools/build-app-data.py', 'tools/build-app-strings.py', 'i18n/strings.json', '.github/workflows/android-qa.yml', '.github/scripts/qa-*', '.github/actions/qa-part/**', '.github/qa-parts.tsv']
  workflow_dispatch:
    inputs:
      scenario:
        description: 'auto (the parts the changed files need, .github/qa-parts.tsv; every part on main), all, one part, or several with commas: map, descent, games, school, snowball, home, group, meet, status, run, locate, weather, lang, phone, store'
        default: auto
      api:
        description: 'Android version of the emulator (API level)'
        default: '35'

# main keeps one run at a time, so its release always matches one run; a branch's newer run replaces its older one,
# and never waits behind main (3.10.2026: branch runs used to queue behind every full run on main)
concurrency:
  group: android-qa-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

# read-only by default (docs/ARCHITECTURE.md, R-10); only the job that publishes the results writes
permissions:
  contents: read

# Build once, then every part of the run on an emulator of its own, all at the same time (3.10.2026: the whole run
# took about 30 minutes in a row), then one job puts the parts together and publishes them.
jobs:
  # which parts, and which of them share an emulator (.github/scripts/qa-plan.py)
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
      final: ${{ steps.plan.outputs.final }}
      others: ${{ steps.plan.outputs.others }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: The parts
        id: plan
        run: python3 .github/scripts/qa-plan.py "${{ inputs.scenario || 'all' }}" "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"

  # the debug app, which every part needs; the release app builds beside it, and only the part that checks it waits for it
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0" > /dev/null
      - name: Build the debug app
        working-directory: app/android
        # with the usage and crash keys, so the run also checks that events and crash reports arrive; every event
        # carries build=debug, and the dashboards filter it out (docs/GROWTH.md)
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./gradlew --no-daemon :app:assemblePreviewDebug
      # 3 days, not 1: "Re-run failed jobs" on a run that is a day old still finds the app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-debug
          retention-days: 3
          path: app/android/app/build/outputs/apk/preview/debug/app-preview-debug.apk

  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0" > /dev/null
      - name: Build the release app
        working-directory: app/android
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./gradlew --no-daemon :app:assemblePreviewRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-release
          retention-days: 3
          path: app/android/app/build/outputs/apk/preview/release/app-preview-release.apk

  # every part but one: needs only the debug app
  emulator:
    needs: [plan, build]
    if: needs.plan.outputs.others != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.others) }}
    env:
      OUT: ${{ github.workspace }}/qa-out
      SCENARIO: ${{ matrix.part }}
      FINAL: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/qa-part
        with:
          part: ${{ matrix.part }}
          api: ${{ inputs.api || '35' }}

  # the part that also starts the release build and checks the crash reports: it waits for the release build
  emulator-final:
    needs: [plan, build, build-release]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OUT: ${{ github.workspace }}/qa-out
      SCENARIO: ${{ needs.plan.outputs.final }}
      FINAL: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/qa-part
        with:
          part: ${{ needs.plan.outputs.final }}
          api: ${{ inputs.api || '35' }}
          release: 'true'

  publish:
    needs: [plan, build, emulator, emulator-final]
    if: always() && needs.plan.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OUT: ${{ github.workspace }}/qa-out
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: android-qa-*
          path: parts
      - name: One result from the parts
        run: |
          mkdir -p "$OUT/shots" "$OUT/parts"
          for d in parts/android-qa-*; do
            p=${d#parts/android-qa-}
            cp -r "$d" "$OUT/parts/$p"
            { echo "== $p"; cat "$d/summary.txt" 2>/dev/null || echo "(no summary)"; echo; } >> "$OUT/summary.txt"
            for f in "$d"/shots/*.png; do [ -f "$f" ] && cp "$f" "$OUT/shots/$p-$(basename "$f")"; done
            # the store screenshots, where the release has always had them
            if [ -d "$d/store" ]; then mkdir -p "$OUT/store"; cp "$d"/store/*.png "$OUT/store/" 2> /dev/null || true; fi
          done
          cat "$OUT/summary.txt"
      - name: Contact sheets
        run: |
          pip install --quiet pillow
          python3 app/android/qa/sheet.py "$OUT/shots" "$OUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-qa
          path: qa-out
          retention-days: 14
          overwrite: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$OUT" && zip -qr "$RUNNER_TEMP/qa.zip" . && cd -
          # main keeps its own results; a branch's run goes to a release of its own, so it never covers main's
          tag=android-qa; [ "$GITHUB_REF_NAME" = main ] || tag=android-qa-branch
          title="אנדרואיד: בדיקה באמולטור$([ "$tag" = android-qa ] || echo " (ענף ${GITHUB_REF_NAME})")"
          files=("$RUNNER_TEMP/qa.zip" "$OUT"/sheet-*.png $(ls "$OUT"/store/*.png 2> /dev/null || true))
          {
            echo "בדיקה באמולטור, ענף ${GITHUB_REF_NAME}, קומיט ${GITHUB_SHA::7}."
            echo "הריצה: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            cat "$OUT/summary.txt" 2>/dev/null || echo "(no summary: the run stopped before the app started)"
          } > "$RUNNER_TEMP/notes.md"
          # the release stays where it is and only its files change (R-10: main's used to be deleted and created again,
          # and a new tag on a branch's commit was refused to the run's token, HTTP 403, 3.10.2026); the notes name the commit
          gh release view "$tag" > /dev/null 2>&1 \
            || gh release create "$tag" --prerelease --target "${{ github.event.repository.default_branch }}" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          gh release view "$tag" --json assets -q '.assets[].name' | while read -r a; do gh release delete-asset "$tag" "$a" --yes; done
          gh release upload "$tag" "${files[@]}" --clobber
          gh release edit "$tag" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
