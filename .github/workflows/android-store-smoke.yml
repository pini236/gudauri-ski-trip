# Manual only (DevOps, 24.11.2026; Pini: no REDESIGN flag in the store, architect 5f26b77b).
# smoke:    the SHRUNK store release (R8, no -PredesignOn) on an emulator: open, 20 s of random touches, zero crashes.
# rollback: build the store bundle from a git tag with a higher versionCode, to a signed archive, tried once, NEVER uploaded.
# Signed with the debug key: this workflow has no secrets and publishes nothing (docs/ARCHITECTURE.md, R-10). Qa.enabled is
# off in the store build, so this is a UI and logcat smoke test; the full scenarios stay on the debug build (android-qa.yml).
name: android-store-smoke
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'smoke (shrunk storeRelease on an emulator) or rollback (bundle from a tag, no upload)'
        default: smoke
        type: choice
        options: [smoke, rollback]
      ref:
        description: 'rollback: the tag or commit of the last store build before the redesign (smoke ignores it)'
        default: ''
      version_code:
        description: 'rollback: a versionCode HIGHER than the one in the store'
        default: ''
permissions:
  contents: read
concurrency:
  group: android-store-smoke-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  smoke:
    if: inputs.mode == 'smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: {distribution: temurin, java-version: 21}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0" > /dev/null
      - name: Build the shrunk store release (debug-signed) and run the store gate
        working-directory: app/android
        run: |
          ./gradlew --no-daemon --build-cache :app:assembleStoreRelease
          APK=$(ls app/build/outputs/apk/store/release/*.apk | head -1); echo "APK=$APK" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE" && sh tools/check-android-store.sh "$(find app/android/app/build -path '*store/release*' -name BuildConfig.java | head -1)"
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/store-smoke.sh app/android/${{ env.APK }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: {name: store-smoke, path: store-smoke-out, retention-days: 7, if-no-files-found: ignore}
  rollback:
    if: inputs.mode == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION_CODE: ${{ inputs.version_code }}
      APP_VERSION_NAME: rollback-${{ inputs.version_code }}
    steps:
      - name: Inputs
        run: |
          [ -n "${{ inputs.ref }}" ] && [ -n "${{ inputs.version_code }}" ] || { echo "::error::ref and version_code are required"; exit 1; }
          case "${{ inputs.version_code }}" in ''|*[!0-9]*) echo "::error::version_code must be a number"; exit 1;; esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {ref: "${{ inputs.ref }}"}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: {distribution: temurin, java-version: 21}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0" > /dev/null
      - name: Build the store bundle from the tag (not uploaded)
        working-directory: app/android
        run: |
          ./gradlew --no-daemon :app:bundleStoreRelease
          ls -l app/build/outputs/bundle/storeRelease/*.aab
          echo "built ${{ inputs.ref }} with versionCode ${{ inputs.version_code }}; nothing uploaded" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: rollback-aab, path: app/android/app/build/outputs/bundle/storeRelease/*.aab, retention-days: 7}
