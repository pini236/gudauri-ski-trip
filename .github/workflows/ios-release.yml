name: iOS release

# Signs the iPhone app and uploads it to TestFlight (docs/APPLE.md, 4). Main only. Written by DevOps (decision 66);
# it is a release chain and adds secrets, so it merges only after the architect's review (CLAUDE.md, rule 11).
#
# - The six secrets live in the `ios-release` environment, limited to the main branch (docs/APPLE.md, 4.2 D), not in
#   the repository's general secrets.
# - The job holds the keys and cannot write to the repository (`contents: read`).
# - Every action is pinned to a commit. No `curl | sh`: XcodeGen's hash is checked.
# - The keychain is temporary and deleted at the end, also when the run fails.
# - Without the secrets (before step 6 of docs/APPLE.md) the job ends green and does nothing.
on:
  push:
    branches: [main]
    paths: ['app/ios/**', 'site/data/**', 'site/games/descent/**', 'site/games/thumbs/**', 'site/js/relief.js', 'site/css/site.css', 'tools/fixtures/**', 'tools/build-ios-data.py', 'tools/build-ios-strings.py', 'i18n/strings.json', '.github/workflows/ios-release.yml', 'tools/check-ios-variant.sh', 'tools/check-ios-store-binary.sh']
  workflow_dispatch:
    inputs:
      variant:
        description: "plain = 1.0 (no background location). dayrec = 1.1 with surf-day recording; only on purpose, never from a push (ARCHITECTURE m-13)"
        type: choice
        options: [plain, dayrec]
        default: plain
      archive_only:
        description: "true = sign and archive, run the gates, then stop: no export, nothing is uploaded to App Store Connect or TestFlight. Manual runs only; a push never sets it"
        type: boolean
        default: false

# a build that is already uploading is never cancelled halfway; the newest waiting push goes next
concurrency:
  group: ios-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  XCODE_PREFIX: Xcode_26.6
  XCODEGEN_VERSION: "2.44.1"
  XCODEGEN_SHA256: a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73
  BUNDLE_ID: io.github.pini236.skiapp
  TEAM_ID: ZX5CTJ88UA
  # a push has no input, so it is always the plain 1.0 build
  VARIANT: ${{ inputs.variant || 'plain' }}

jobs:
  testflight:
    name: Sign and upload to TestFlight
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    environment: ios-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Are the secrets there
        id: gate
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$CERT_PASSWORD" ] && [ -n "$PROFILE" ] && [ -n "$KEY" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The iOS signing secrets are not in the ios-release environment yet (docs/APPLE.md, 4.2 D); nothing to do."
          fi
      - name: Select Xcode
        if: steps.gate.outputs.ready == 'true'
        run: |
          X=$(ls -d /Applications/${XCODE_PREFIX}.app)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: XcodeGen (pinned, checked)
        if: steps.gate.outputs.ready == 'true'
        run: |
          curl -fsSL -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          SUM=$(shasum -a 256 xcodegen.zip | cut -d' ' -f1)
          [ -n "$XCODEGEN_SHA256" ] && [ "$SUM" = "$XCODEGEN_SHA256" ] || { echo "::error::xcodegen.zip sha256 mismatch"; exit 1; }
          unzip -q xcodegen.zip -d "$RUNNER_TEMP/xg"
          echo "$RUNNER_TEMP/xg/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Data from the site, and the project
        if: steps.gate.outputs.ready == 'true'
        run: |
          python3 tools/build-ios-data.py
          python3 tools/build-ios-strings.py app/ios/Gudi/Resources/Data/strings.json app/ios/Gudi/Generated/S.swift
          cd app/ios
          if [ "$VARIANT" = dayrec ]; then
            test -f project-dayrec.yml || { echo "::error::project-dayrec.yml is missing"; exit 1; }
            xcodegen generate --spec project-dayrec.yml
          else
            xcodegen generate
          fi
      - name: Temporary keychain, certificate and profile
        if: steps.gate.outputs.ready == 'true'
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          PROFILE_LIVE: ${{ secrets.IOS_PROFILE_LIVE_BASE64 }}
        run: |
          umask 077
          KC="$RUNNER_TEMP/release.keychain-db"
          KC_PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::$KC_PASSWORD"
          echo "KC=$KC" >> "$GITHUB_ENV"
          printf '%s' "$CERT" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -P "$CERT_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASSWORD" "$KC" > /dev/null
          # the temporary keychain first in the search list, the login keychain after it
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$PROFILE" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.plist"
          # the Live Activity extension's own profile (docs/APPLE.md 5.9): only the ski-day build (dayrec) installs it
          if [ "$VARIANT" = dayrec ]; then
            test -n "$PROFILE_LIVE" || { echo "::error::variant dayrec needs the secret IOS_PROFILE_LIVE_BASE64"; exit 1; }
            printf '%s' "$PROFILE_LIVE" | base64 -d > "$RUNNER_TEMP/profile-live.mobileprovision"
            security cms -D -i "$RUNNER_TEMP/profile-live.mobileprovision" > "$RUNNER_TEMP/profile-live.plist"
            PROFILE_LIVE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile-live.plist")
            PROFILE_LIVE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile-live.plist")
            cp "$RUNNER_TEMP/profile-live.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_LIVE_UUID.mobileprovision"
            echo "PROFILE_LIVE_UUID=$PROFILE_LIVE_UUID" >> "$GITHUB_ENV"
            echo "PROFILE_LIVE_NAME=$PROFILE_LIVE_NAME" >> "$GITHUB_ENV"
            rm -f "$RUNNER_TEMP/profile-live.plist"
          fi
      - name: Archive, signed by hand
        if: steps.gate.outputs.ready == 'true'
        run: |
          cd app/ios
          # CFBundleVersion is this workflow's own run number. It only grows, and only uploaded builds are counted
          # (ios.yml's builds are never uploaded), so TestFlight never sees a repeat (docs/ARCHITECTURE.md, R-8).
          # manual signing is set in the app target's Release settings in project.yml (the architect's condition);
          # only the profile's name comes from here, as a build setting that nothing but that target reads
          # the Live Activity extension's profile name (dayrec only; the plain build has no such target)
          LIVE_ARG=""
          [ "$VARIANT" = dayrec ] && LIVE_ARG="GUDI_PROFILE_LIVE=$PROFILE_LIVE_NAME"
          xcodebuild -project Gudi.xcodeproj -scheme Gudi -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Gudi.xcarchive" \
            GUDI_PROFILE="$PROFILE_NAME" ${LIVE_ARG:+"$LIVE_ARG"} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || RC=$?
          RC=${RC:-0}
          tail -40 "$RUNNER_TEMP/archive.log"
          grep -E "error:" "$RUNNER_TEMP/archive.log" | sort -u | head -60 || true
          test "$RC" -eq 0
      - name: Gate, the compiled app's Info.plist matches the variant
        if: steps.gate.outputs.ready == 'true'
        run: sh tools/check-ios-variant.sh "$RUNNER_TEMP/Gudi.xcarchive/Products/Applications/Gudi.app/Info.plist" "$VARIANT"
      - name: Gate, the plain build has no ski-day code and no tester export
        if: steps.gate.outputs.ready == 'true' && env.VARIANT == 'plain'
        run: sh tools/check-ios-store-binary.sh "$RUNNER_TEMP/Gudi.xcarchive/Products/Applications/Gudi.app/Gudi"
      - name: Export and upload to TestFlight
        if: steps.gate.outputs.ready == 'true' && !inputs.archive_only
        env:
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          umask 077
          printf '%s' "$KEY" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          LIVE_ENTRY=""
          [ "$VARIANT" = dayrec ] && LIVE_ENTRY="<key>${BUNDLE_ID}.live</key><string>${PROFILE_LIVE_NAME}</string>"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>${LIVE_ENTRY}</dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Gudi.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" > "$RUNNER_TEMP/export.log" 2>&1 || RC=$?
          RC=${RC:-0}
          tail -40 "$RUNNER_TEMP/export.log"
          grep -E "error:" "$RUNNER_TEMP/export.log" | sort -u | head -30 || true
          test "$RC" -eq 0
      - name: Delete the keychain, the profile and the keys
        if: always() && steps.gate.outputs.ready == 'true'
        run: |
          [ -n "$KC" ] && security delete-keychain "$KC" || true
          rm -f "$RUNNER_TEMP"/AuthKey.p8 "$RUNNER_TEMP"/dist.p12 "$RUNNER_TEMP"/profile.mobileprovision "$RUNNER_TEMP"/ExportOptions.plist
          [ -n "$PROFILE_UUID" ] && rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" || true
          [ -n "$PROFILE_LIVE_UUID" ] && rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_LIVE_UUID.mobileprovision" || true
          rm -f "$RUNNER_TEMP/profile-live.mobileprovision"
