# Unit tests gate independent preview/store builds and publishers (docs/APP-NATIVE.md, decision 31).
# A store or publishing failure can be retried without repeating successful tests or the preview build.
name: android

on:
  # every branch runs the unit tests and builds (the tests also read the site's tokens and relief, and the server's
  # contract); only main signs and publishes
  push:
    paths: ['app/android/**', 'site/data/**', 'site/audio/**', 'site/games/descent/**', 'site/games/thumbs/**', 'site/img/pano/**', 'site/css/site.css', 'site/js/app.js', 'site/js/relief.js', 'server/CONTRACT.md', 'tools/fixtures/**', 'tools/build-app-data.py', 'tools/build-app-strings.py', 'i18n/strings.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/android/**', 'site/data/**', 'site/audio/**', 'site/games/descent/**', 'site/games/thumbs/**', 'site/img/pano/**', 'site/css/site.css', 'site/js/app.js', 'site/js/relief.js', 'server/CONTRACT.md', 'tools/fixtures/**', 'tools/build-app-data.py', 'tools/build-app-strings.py', 'i18n/strings.json', '.github/workflows/android.yml']
  workflow_dispatch:

# a branch's newer push replaces its running build; main never cancels one halfway through publishing, and its newest
# waiting push builds next
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# read-only by default (docs/ARCHITECTURE.md, R-10): the job that holds the signing keys cannot write to the repository,
# and the job that writes the releases holds no keys
permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0" > /dev/null
      - name: Cache compilation, always run the unit tests
        run: |
          # Tests read site/server contracts and fixtures outside their declared Gradle inputs. Until those inputs
          # are declared, compilation may be cached but test results must neither be restored nor stored.
          cat > "$RUNNER_TEMP/ci-unit-tests.gradle" <<'GRADLE'
          allprojects {
              tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
                  outputs.upToDateWhen { false }
                  outputs.doNotCacheIf('Tests read external repository files') { true }
              }
          }
          GRADLE
          ./gradlew --no-daemon --build-cache --init-script "$RUNNER_TEMP/ci-unit-tests.gradle" :app:testPreviewDebugUnitTest
      - name: Unit test reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: android-unit-tests
          path: |
            app/android/app/build/test-results/testPreviewDebugUnitTest
            app/android/app/build/reports/tests/testPreviewDebugUnitTest
          retention-days: 14
          overwrite: true

  build-preview:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/android
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0" > /dev/null
      - name: Test key
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/test.jks"
          echo "ANDROID_TEST_KEYSTORE_PATH=$RUNNER_TEMP/test.jks" >> "$GITHUB_ENV"
      - name: Sentry, the preview build's mapping id
        if: github.ref == 'refs/heads/main'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            id=$(uuidgen)
            echo "SENTRY_MAP_ID=$id" >> "$GITHUB_ENV"
            mkdir -p app/src/main/assets
            echo "io.sentry.ProguardUuids=$id" > app/src/main/assets/sentry-debug-meta.properties
          fi
      - name: Sentry CLI, a fixed version checked against its published hash
        id: sentry-cli
        if: github.ref == 'refs/heads/main' && env.SENTRY_MAP_ID != ''
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o sentry-cli https://github.com/getsentry/sentry-cli/releases/download/2.58.6/sentry-cli-Linux-x86_64
          echo "36b689311b399d9332950d84f4299aee682d2d290a770a77372b30a74f7e7add  sentry-cli" | sha256sum -c -
          chmod +x sentry-cli
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build the preview APK
        env:
          POSTHOG_KEY: ${{ github.ref == 'refs/heads/main' && secrets.POSTHOG_KEY || '' }}
          SENTRY_DSN: ${{ github.ref == 'refs/heads/main' && secrets.SENTRY_DSN || '' }}
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.ANDROID_TEST_KEYSTORE_PASSWORD || '' }}
          ANDROID_TEST_KEY_ALIAS: ${{ github.ref == 'refs/heads/main' && secrets.ANDROID_TEST_KEY_ALIAS || '' }}
        run: ./gradlew --no-daemon --build-cache :app:assemblePreviewRelease
      - name: Sentry, upload the preview build's mapping
        if: github.ref == 'refs/heads/main' && env.SENTRY_MAP_ID != '' && steps.sentry-cli.outcome == 'success'
        continue-on-error: true # a Sentry problem never holds a build back
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: https://de.sentry.io
          SENTRY_ORG: piniz
          SENTRY_PROJECT: gudi-android
        run: sentry-cli upload-proguard --uuid "$SENTRY_MAP_ID" app/build/outputs/mapping/previewRelease/mapping.txt
      - name: Check the signature is the registered test key
        if: github.ref == 'refs/heads/main'
        run: |
          cert=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/preview/release/app-preview-release.apk | grep -i "SHA-256 digest" | head -1 | awk '{print toupper($NF)}')
          want=$(echo "BA:09:08:B5:CB:5E:48:36:C7:78:70:B2:25:8E:5A:7B:43:13:45:34:81:4F:37:47:67:1D:6A:37:7C:E8:B3:06" | tr -d ':')
          echo "signed with $cert"
          test "$cert" = "$want"
      - name: Hand the preview APK to the publishing job
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview
          path: app/android/app/build/outputs/apk/preview/release/app-preview-release.apk
          retention-days: 14
          overwrite: true
          if-no-files-found: error
      - name: Remove the test key
        if: always()
        run: rm -f "$RUNNER_TEMP/test.jks"

  build-store:
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/android
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0" > /dev/null
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Sentry, the store build's mapping id
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            id=$(uuidgen)
            echo "SENTRY_MAP_ID=$id" >> "$GITHUB_ENV"
            mkdir -p app/src/main/assets
            echo "io.sentry.ProguardUuids=$id" > app/src/main/assets/sentry-debug-meta.properties
          fi
      - name: Sentry CLI, a fixed version checked against its published hash
        id: sentry-cli
        if: env.SENTRY_MAP_ID != ''
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o sentry-cli https://github.com/getsentry/sentry-cli/releases/download/2.58.6/sentry-cli-Linux-x86_64
          echo "36b689311b399d9332950d84f4299aee682d2d290a770a77372b30a74f7e7add  sentry-cli" | sha256sum -c -
          chmod +x sentry-cli
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build the store bundle
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: ./gradlew --no-daemon --build-cache :app:bundleStoreRelease
      - name: Sentry, upload the store build's mapping
        if: env.SENTRY_MAP_ID != '' && steps.sentry-cli.outcome == 'success'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: https://de.sentry.io
          SENTRY_ORG: piniz
          SENTRY_PROJECT: gudi-android
        run: sentry-cli upload-proguard --uuid "$SENTRY_MAP_ID" app/build/outputs/mapping/storeRelease/mapping.txt
      - name: Check the bundle is signed with the registered upload key
        run: |
          cert=$(keytool -printcert -jarfile app/build/outputs/bundle/storeRelease/app-store-release.aab | grep "SHA256:" | head -1 | awk '{print toupper($NF)}' | tr -d ':')
          want=$(echo "85:FB:FB:02:AE:0B:50:CC:53:92:55:4D:27:61:5E:A6:8E:2E:79:75:EB:8D:75:10:60:30:6D:A9:7D:D7:DD:31" | tr -d ':')
          echo "signed with $cert"
          test "$cert" = "$want"
      - name: Hand the store bundle to the publishing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: store
          path: app/android/app/build/outputs/bundle/storeRelease/app-store-release.aab
          retention-days: 14
          overwrite: true
          if-no-files-found: error
      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

  # Keep the existing required-check name. A deliberately skipped store job is valid only outside push/main.
  build:
    needs: [unit-tests, build-preview, build-store]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UNIT_RESULT: ${{ needs.unit-tests.result }}
      PREVIEW_RESULT: ${{ needs.build-preview.result }}
      STORE_RESULT: ${{ needs.build-store.result }}
      STORE_EXPECTED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'success' || 'skipped' }}
    steps:
      - name: Check required Android jobs
        run: |
          if [ "$UNIT_RESULT" != success ] || [ "$PREVIEW_RESULT" != success ] || [ "$STORE_RESULT" != "$STORE_EXPECTED" ]; then
            echo "::error::Android gate failed: unit-tests=$UNIT_RESULT, build-preview=$PREVIEW_RESULT, build-store=$STORE_RESULT (expected $STORE_EXPECTED)."
            exit 1
          fi

  # Each publisher owns a different fixed release. Neither has signing keys, and neither waits for the other build.
  publish-preview:
    needs: build-preview
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APP_VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - name: Check this is still the current main commit
        id: current
        run: |
          current=$(gh api "repos/$GH_REPO/branches/main" -q '.commit.sha')
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Skipping publication: main has advanced beyond this run." >> "$GITHUB_STEP_SUMMARY"
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.current.outputs.ok == 'true'
        with:
          name: preview
          path: out
      - name: Publish the preview
        if: steps.current.outputs.ok == 'true'
        run: |
          # Keep the release and upload first under a temporary name, then replace the fixed asset (R-10).
          put() {
            local tag=$1 file=$2 name=$3 tmp="next-$3" api="repos/$GH_REPO/releases"
            local current published
            current=$(gh api "repos/$GH_REPO/branches/main" -q '.commit.sha')
            if [ "$current" != "$GITHUB_SHA" ]; then
              echo "Skipping publication: main has advanced beyond this run." >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            gh release view "$tag" > /dev/null 2>&1 \
              || gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title "$4" --notes "$5"
            published=$(gh release view "$tag" --json body -q '.body' | sed -nE 's/.*0\.1\.([0-9]+).*/\1/p' | head -1)
            if [ -n "$published" ] && [ "$published" -gt "$GITHUB_RUN_NUMBER" ]; then
              echo "Skipping publication: $tag already has a newer build." >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            gh release delete-asset "$tag" "$tmp" --yes 2> /dev/null || true
            cp "$file" "$RUNNER_TEMP/$tmp"
            gh release upload "$tag" "$RUNNER_TEMP/$tmp"
            # A push may arrive during upload: keep the existing download if this run is now stale.
            current=$(gh api "repos/$GH_REPO/branches/main" -q '.commit.sha')
            if [ "$current" != "$GITHUB_SHA" ]; then
              gh release delete-asset "$tag" "$tmp" --yes
              echo "Skipping replacement: main advanced during upload." >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            local ids old new
            ids=$(gh api "$api/tags/$tag" -q '.assets[] | "\(.name) \(.id)"')
            old=$(echo "$ids" | awk -v n="$name" '$1 == n {print $2}')
            new=$(echo "$ids" | awk -v n="$tmp" '$1 == n {print $2}')
            test -n "$new"
            [ -z "$old" ] || gh api -X DELETE "$api/assets/$old"
            gh api -X PATCH "$api/assets/$new" -f name="$name" > /dev/null
            gh release edit "$tag" --title "$4" --notes "$5"
          }
          link="https://github.com/${GH_REPO}/releases/download"
          put android-preview out/app-preview-release.apk ski-preview.apk \
            "אנדרואיד: גרסת בדיקה ${APP_VERSION_NAME}" \
            "גרסת בדיקה ${APP_VERSION_NAME}, נבנתה מ-${GITHUB_SHA::7}. מתקינים מהטלפון: פותחים את הקובץ ski-preview.apk ומאשרים התקנה. הקישור הקבוע: ${link}/android-preview/ski-preview.apk"

  publish-store:
    needs: build-store
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APP_VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - name: Check this is still the current main commit
        id: current
        run: |
          current=$(gh api "repos/$GH_REPO/branches/main" -q '.commit.sha')
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Skipping publication: main has advanced beyond this run." >> "$GITHUB_STEP_SUMMARY"
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.current.outputs.ok == 'true'
        with:
          name: store
          path: out
      - name: Publish the store bundle
        if: steps.current.outputs.ok == 'true'
        run: |
          put() {
            local tag=$1 file=$2 name=$3 tmp="next-$3" api="repos/$GH_REPO/releases"
            local current published
            current=$(gh api "repos/$GH_REPO/branches/main" -q '.commit.sha')
            if [ "$current" != "$GITHUB_SHA" ]; then
              echo "Skipping publication: main has advanced beyond this run." >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            gh release view "$tag" > /dev/null 2>&1 \
              || gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title "$4" --notes "$5"
            published=$(gh release view "$tag" --json body -q '.body' | sed -nE 's/.*0\.1\.([0-9]+).*/\1/p' | head -1)
            if [ -n "$published" ] && [ "$published" -gt "$GITHUB_RUN_NUMBER" ]; then
              echo "Skipping publication: $tag already has a newer build." >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            gh release delete-asset "$tag" "$tmp" --yes 2> /dev/null || true
            cp "$file" "$RUNNER_TEMP/$tmp"
            gh release upload "$tag" "$RUNNER_TEMP/$tmp"
            current=$(gh api "repos/$GH_REPO/branches/main" -q '.commit.sha')
            if [ "$current" != "$GITHUB_SHA" ]; then
              gh release delete-asset "$tag" "$tmp" --yes
              echo "Skipping replacement: main advanced during upload." >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            local ids old new
            ids=$(gh api "$api/tags/$tag" -q '.assets[] | "\(.name) \(.id)"')
            old=$(echo "$ids" | awk -v n="$name" '$1 == n {print $2}')
            new=$(echo "$ids" | awk -v n="$tmp" '$1 == n {print $2}')
            test -n "$new"
            [ -z "$old" ] || gh api -X DELETE "$api/assets/$old"
            gh api -X PATCH "$api/assets/$new" -f name="$name" > /dev/null
            gh release edit "$tag" --title "$4" --notes "$5"
          }
          link="https://github.com/${GH_REPO}/releases/download"
          put android-store out/app-store-release.aab ski-store.aab \
            "אנדרואיד: קובץ חנות ${APP_VERSION_NAME}" \
            "קובץ חנות (.aab) לגוגל פליי, גרסה ${APP_VERSION_NAME}, נבנה מ-${GITHUB_SHA::7}, חתום במפתח ההעלאה. לא מתקינים אותו בטלפון: מעלים אותו בקונסולה של גוגל פליי. הקישור הקבוע: ${link}/android-store/ski-store.aab"
