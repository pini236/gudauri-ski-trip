# The iPhone app's project, for XcodeGen (decision 71; docs/ARCHITECTURE.md, review of 21.10.2026).
# Gudi.xcodeproj is generated from this file and is not in the repository: edit this file, never the project.
#   python3 tools/build-ios-data.py
#   python3 tools/build-ios-strings.py app/ios/Gudi/Resources/Data/strings.json app/ios/Gudi/Generated/S.swift
#   cd app/ios && xcodegen generate
name: Gudi
options:
  bundleIdPrefix: io.github.pini236
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
packages:
  GudiCore:
    path: Packages/GudiCore
targets:
  Gudi:
    type: application
    platform: iOS
    sources:
      - path: Gudi
        excludes: [Resources/Data, Resources/Fonts]
      - path: Gudi/Resources/Data
        type: folder
        buildPhase: resources
      - path: Gudi/Resources/Fonts
        type: folder
        buildPhase: resources
    # the capabilities registered on the App ID (docs/APPLE.md, step 5): Sign in with Apple, and links from the site
    # that open the app (the site's .well-known/apple-app-site-association, the twin of assetlinks.json)
    entitlements:
      path: Gudi/Gudi.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains: ["applinks:gudauri-ski-trip.vercel.app"]
    dependencies:
      - package: GudiCore
        product: GudiData
      - package: GudiCore
        product: GudiDomain
    info:
      path: Gudi/Info.plist
      properties:
        CFBundleDisplayName: Gudi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # HTTPS through the system only, so exempt (docs/APPLE.md, 5.5)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        # the app's own four languages, so the system's own texts follow them (decision 47)
        CFBundleLocalizations: [en, he, ru, ka]
        # "where am I" (round 19, m-7): only while the map is open, never sent or kept
        NSLocationWhenInUseUsageDescription: "Shows where you are on the trail map. Your location stays on this iPhone: it is not sent, saved or measured."
        # the app's fonts (FT1, decision 36), the same files as Android's res/font; licences in app/ios/licenses
        UIAppFonts:
          - Fonts/karantina_bold.ttf
          - Fonts/plex_hebrew_regular.ttf
          - Fonts/plex_hebrew_bold.ttf
          - Fonts/plex_sans.ttf
          - Fonts/oswald.ttf
          - Fonts/noto_sans_georgian.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.pini236.skiapp
        # iPhone only (docs/APPLE.md, 5.6)
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1"
        # never resets (R-8); CI passes the run number
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # signed by hand, for this target only (architect, 22.10.2026): ios-release.yml passes only GUDI_PROFILE,
      # the profile's name from the secret, so the GudiCore package targets are never asked for a profile
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: ZX5CTJ88UA
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(GUDI_PROFILE)
