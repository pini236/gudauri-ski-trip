# The ski-day build (decision 76; docs/ARCHITECTURE.md m-13): project.yml plus the DAYREC flag and the two Info.plist
# keys the recorder needs. Only the 1.1 release uses it (ios-release.yml, workflow_dispatch variant dayrec); every other
# build, including main's, uses project.yml and has neither.
#   cd app/ios && xcodegen generate --spec project-dayrec.yml
include:
  - project.yml
targets:
  Gudi:
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DAYREC"
        MARKETING_VERSION: "1.1"
    info:
      path: Gudi/Info.plist
      properties:
        UIBackgroundModes: [location]
        NSLocationTemporaryUsageDescriptionDictionary:
          DayRecording: "Recording your ski day needs your precise location: speeds and runs cannot be told from an approximate one. The track stays on this iPhone."
        NSSupportsLiveActivities: true
    # an array in this file is added to project.yml's (XcodeGen appends), so only the extension is listed
    dependencies:
      - target: GudiLive
        embed: true
  # The Live Activity extension (docs/APPLE.md 5.9): its own bundle id and profile (GUDI_PROFILE_LIVE, the name of the
  # secret IOS_PROFILE_LIVE_BASE64's profile). Only the dayrec build has it; main's build and 1.0 do not.
  GudiLive:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
      - path: Gudi/DayRec/DayLiveAttributes.swift
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Gudi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.pini236.skiapp.live
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: ZX5CTJ88UA
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(GUDI_PROFILE_LIVE)
