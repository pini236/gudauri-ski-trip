<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#13233A">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<style>[hidden]{display:none!important}</style>
<style>.back-site{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;background:rgba(19,35,58,.88);color:#fff;font:700 14px "IBM Plex Sans Hebrew",system-ui,sans-serif;text-decoration:none;align-self:flex-start;flex:0 0 auto;box-sizing:border-box}.back-site:focus-visible{outline:3px solid #F4B942;outline-offset:2px}html[lang="en"]{--f-body:"IBM Plex Sans","IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif}html[lang="ru"]{--f-display:"Oswald","Arial Narrow",sans-serif;--f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}html[lang="ka"]{--f-display:"Noto Sans Georgian","Arial Narrow",sans-serif;--f-body:"Noto Sans Georgian",system-ui,sans-serif}html:not([lang="he"]) .back-site{font-family:var(--f-body)}</style>
<script src="../../js/i18n.js" data-base="../../i18n/" data-file="game-school"></script>
<script src="../../js/prefs.js"></script>

<title data-i18n="game.school.title">בית הספר לסקי</title>
<meta name="description" data-i18n-attr="content:game.school.meta_description" content="שבעה שיעורים קצרים: עקרונות הגלישה, ותרגול שמרגיש כמו על השלג">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=IBM+Plex+Sans+Hebrew:wght@400;600;700&display=swap">
<style>
/* One look: a bright training slope. The same in both themes. */
:root{ --ink:#13233A; --muted:#4B5A6F; --rule:#CBD5DF; --accent:#F4B942; --red:#D1342B; --blue:#1F5FC4; --green:#1B8A4C;
  --f-display:"Karantina","Arial Narrow",sans-serif; --f-body:"IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme:light; }
html,body{height:100%}
[hidden]{display:none!important}
html[dir=ltr] body,html[dir=ltr] .skis button{direction:ltr}
html[dir=ltr] .sign{padding:4px 26px 4px 14px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%)}
body{margin:0;background:#F4F8FB;color:var(--ink);font-family:var(--f-body);direction:rtl;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.sign{display:inline-flex;align-items:center;padding:4px 14px 4px 26px;color:#fff;background:var(--ink);font-family:var(--f-display);font-size:24px;line-height:1;clip-path:polygon(0 50%,16px 0,100% 0,100% 100%,16px 100%)}
.box{background:rgba(19,35,58,.86);color:#fff;padding:6px 10px;display:flex;flex-direction:column;align-items:center;min-width:76px}
.box b{font-family:var(--f-display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.box small{font-size:11px;opacity:.85}
.box.over{background:var(--red)}
.task{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 64px);display:flex;justify-content:center;pointer-events:none}
.task span{background:rgba(255,255,255,.92);padding:5px 12px;font-weight:700;font-size:14px;box-shadow:0 2px 0 rgba(19,35,58,.15)}
.meter{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 100px);height:8px;background:rgba(19,35,58,.15);pointer-events:none}
.meter i{display:block;height:100%;width:0;background:var(--green)}
.pop{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:clamp(34px,10vw,54px);line-height:1;color:var(--ink);text-shadow:0 2px 0 #fff,0 0 14px #fff;white-space:nowrap;pointer-events:none;opacity:0}
.pop.go{animation:pop 1.1s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-75%)}}
.wedge{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(42vw,170px);min-height:84px;border:2px solid var(--ink);background:rgba(255,255,255,.85);color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;touch-action:none}
.wedge b{font-family:var(--f-display);font-size:30px;line-height:1}
.wedge small{font-size:11.5px}
.wedge.on{background:var(--accent);border-color:var(--accent)}
.hint{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);max-width:min(48vw,220px);background:rgba(19,35,58,.86);color:#fff;font-size:12.5px;line-height:1.35;padding:7px 10px;pointer-events:none;transition:opacity .5s}
.menu{position:fixed;inset:0;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);background:#F4F8FB;display:flex;flex-direction:column;gap:14px;touch-action:auto}
.menu h1{margin:0;font-family:var(--f-display);font-size:58px;line-height:.9;text-wrap:balance}
.menu h2{margin:0;font-family:var(--f-display);font-size:30px;line-height:1}
.menu p{margin:0;font-size:14px;line-height:1.5;max-width:36em;color:var(--muted)}
.lessons{display:flex;flex-direction:column;gap:8px}
.les{font:inherit;border:0;cursor:pointer;text-align:start;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;background:#fff;color:var(--ink);padding:10px 12px;border-inline-start:10px solid var(--c);min-height:60px;box-shadow:0 2px 0 var(--rule)}
.les .n{grid-row:span 2;font-family:var(--f-display);font-size:36px;line-height:1;color:var(--muted)}
.les b{font-family:var(--f-display);font-size:25px;line-height:1}
.les small{font-size:12.5px;color:var(--muted);grid-column:2 / 4}
.les .st{color:var(--accent);letter-spacing:1px;white-space:nowrap;font-size:18px}
.les:disabled{opacity:.5;cursor:not-allowed}
.card{background:#fff;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 0 var(--rule);border-top:8px solid var(--c,var(--blue))}
.card .k{font-size:12px;font-weight:700;color:var(--muted)}
.card h3{margin:0;font-family:var(--f-display);font-size:40px;line-height:.95}
.card .rule{font-size:16px;line-height:1.5;margin:0;color:var(--ink)}
.card .ctrl{font-size:13.5px;line-height:1.45;background:#EEF2F5;padding:8px 10px}
.card .goals{display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.card .goals span{display:flex;gap:8px;color:var(--muted)}.card .goals span.ok{color:var(--ink);font-weight:700}
.card .goals span::before{content:"☆";color:var(--rule)}.card .goals span.ok::before{content:"★";color:var(--accent)}
.card svg{max-width:100%;height:auto;align-self:center}
.fig-legend{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:13px;line-height:1.35}
.fig-legend li{display:flex;align-items:center;gap:6px}.fig-legend i{flex:none;width:12px;height:4px;border-radius:2px}
.big{font-family:var(--f-display);font-size:56px;line-height:.9}
.go-btn{font:inherit;min-height:60px;border:0;background:var(--accent);color:var(--ink);font-family:var(--f-display);font-size:34px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.go-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two button{font:inherit;min-height:48px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-weight:700;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.pop.go{animation-duration:.01s}}
.coach{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 98px);display:flex;justify-content:center;pointer-events:none}
.coach span{background:var(--ink);color:#fff;padding:6px 12px;font-weight:700;font-size:15px;line-height:1.3;text-align:center;max-width:30em;transition:background .2s}
.coach span.good{background:var(--green)}.coach span.bad{background:var(--red)}
/* languages written left to right run longer: the drill line keeps to two lines, and the coach moves below it */
html[dir=ltr] .task span{font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
html[dir=ltr] .coach{top:calc(env(safe-area-inset-top,0px) + 112px)}
.checks{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 136px);display:flex;flex-direction:column;gap:3px;pointer-events:none;max-width:60vw}
.checks span{background:rgba(255,255,255,.9);font-size:12.5px;font-weight:700;padding:3px 8px;color:var(--muted)}
.checks span::before{content:"☐ ";}
.checks span.ok{color:var(--green)}.checks span.ok::before{content:"✓ "}
.checks span.no{color:var(--red)}.checks span.no::before{content:"✗ "}
.slider{position:fixed;left:14px;top:30%;height:52%;width:64px;pointer-events:none}
.slider .tr{position:absolute;left:26px;top:0;bottom:0;width:12px;background:linear-gradient(#EEF2F5,#F4B942 60%,#D1342B)}
.slider .hd{position:absolute;left:4px;width:56px;height:30px;margin-top:-15px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.slider .lb{position:absolute;left:44px;font-size:11px;font-weight:700;white-space:nowrap;color:var(--muted)}
.skis{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:grid;grid-template-columns:1fr 1fr;gap:12px;direction:ltr}
.skis button{min-height:96px;border:2px solid var(--ink);background:rgba(255,255,255,.88);color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;touch-action:none;direction:rtl}
.skis button b{font-family:var(--f-display);font-size:30px;line-height:1}
.skis button small{font-size:11.5px}
.skis button.on{background:var(--accent);border-color:var(--accent)}
</style>

<canvas id="game" aria-label="מדרון האימון" data-i18n-attr="aria-label:game.school.canvas_label"></canvas>
<div class="hud" id="hud" hidden><span class="sign" id="hudName"></span><span class="box" id="spdBox"><b id="spd">0</b><small data-i18n="game.school.kmh">קמ״ש</small></span></div>
<div class="task" id="task" hidden><span id="taskTxt"></span></div>
<div class="coach" id="coach" hidden><span id="coachTxt"></span></div>
<div class="checks" id="checks" hidden></div>
<div class="pop" id="pop"></div>
<div class="slider" id="slider" hidden><div class="tr"></div><span class="lb" style="top:-2px" data-i18n="game.school.slider_straight">ישרים</span><span class="lb" style="bottom:-2px" data-i18n="game.school.slider_wide">פיצה רחבה</span><div class="hd" id="sliderHd" data-i18n="game.school.wedge_btn">פיצה</div></div>
<div class="skis" id="skis" hidden><button type="button" id="skiL"><b data-i18n="game.school.ski_left">מגלש שמאל</b><small data-i18n="game.school.press_it">ללחוץ עליו</small></button><button type="button" id="skiR"><b data-i18n="game.school.ski_right">מגלש ימין</b><small data-i18n="game.school.press_it">ללחוץ עליו</small></button></div>
<button class="wedge" id="wedge" type="button" hidden><b data-i18n="game.school.wedge_btn">פיצה</b><small data-i18n="game.school.wedge_btn_hint">להחזיק כדי להאט</small></button>
<div class="hint" id="hint" hidden></div>

<section class="menu" id="menu" aria-label="שיעורים" data-i18n-attr="aria-label:game.school.lessons_label">
  <a class="back-site" href="../../#games" style="" data-i18n="game.school.back_to_games">→ לכל המשחקים</a>
  <h1 data-i18n="game.school.title">בית הספר לסקי</h1>
  <p data-i18n="game.school.intro">שבעה שיעורים קצרים, מהעצירה הראשונה ועד קרווינג. בכל שיעור עיקרון אחד, ותרגיל שבנוי בדיוק בשבילו: שליטה אחרת, משימות אחרות, ומאמן שאומר בזמן אמת מה קורה ולמה.</p>
  <div class="lessons" id="lessons"></div>
  <p style="font-size:12px" data-i18n="game.school.disclaimer">משחק, לא תחליף למדריך. העקרונות כאן הם הבסיס שמדריכים מלמדים בימים הראשונים.</p>
</section>

<section class="menu" id="brief" aria-label="השיעור" data-i18n-attr="aria-label:game.school.brief_label" hidden>
  <div class="card" id="briefCard"></div>
  <button class="go-btn" id="go" type="button" data-i18n="game.school.go">לשלג!</button>
  <div class="two"><button type="button" id="back1" data-i18n="game.school.back_to_lessons">לכל השיעורים</button><span></span></div>
</section>

<section class="menu" id="result" aria-label="תוצאה" data-i18n-attr="aria-label:game.school.result_label" hidden>
  <div class="card" id="resCard"></div>
  <button class="go-btn" id="next" type="button" data-i18n="game.school.next_lesson">השיעור הבא</button>
  <div class="two"><button type="button" id="retry" data-i18n="game.school.retry">עוד פעם</button><button type="button" id="back2" data-i18n="game.school.back_to_lessons">לכל השיעורים</button></div>
</section>

<script src="game.js"></script>
