<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#13233A">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<style>[hidden]{display:none!important}</style>
<style>.back-site{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;background:rgba(19,35,58,.88);color:#fff;font:700 14px "IBM Plex Sans Hebrew",system-ui,sans-serif;text-decoration:none;align-self:flex-start;flex:0 0 auto;box-sizing:border-box}.back-site:focus-visible{outline:3px solid #F4B942;outline-offset:2px}html[lang="en"]{--f-body:"IBM Plex Sans","IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif}html[lang="ru"]{--f-display:"Oswald","Arial Narrow",sans-serif;--f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}html[lang="ka"]{--f-display:"Noto Sans Georgian","Arial Narrow",sans-serif;--f-body:"Noto Sans Georgian",system-ui,sans-serif}html:not([lang="he"]) .back-site{font-family:var(--f-body)}</style>
<script src="../../js/i18n.js" data-base="../../i18n/" data-file="game-merge"></script>

<title data-i18n="game.merge.title">איחוד כדורי שלג</title>
<meta name="description" data-i18n-attr="content:game.merge.meta_description" content="מחליקים, שני כדורים זהים מתאחדים לגדול יותר, עד איש השלג הענק">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=IBM+Plex+Sans+Hebrew:wght@400;600;700&display=swap">
<style>
/* One look: a cold blue evening on the slope, snow tiles on packed snow. */
:root{ --bg:#16263A; --board:#25405E; --cell:#2E4E70; --ink:#0D1522; --paper:#F4F8FB; --accent:#F4B942; --f-display:"Karantina","Arial Narrow",sans-serif; --f-body:"IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme:dark; }
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%,#2C4A6C,var(--bg));color:var(--paper);font-family:var(--f-body);direction:rtl;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 14px);box-sizing:border-box;gap:12px}
header{width:100%;max-width:440px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
h1{margin:0;font-family:var(--f-display);font-size:clamp(26px,7.6vw,44px);white-space:nowrap;line-height:.9;min-width:0}
.scores{display:flex;gap:6px}
.sc{background:var(--board);padding:4px 8px;min-width:54px;text-align:center;display:flex;flex-direction:column;position:relative}
.sc small{font-size:11px;color:#A9C1D8}
.sc b{font-family:var(--f-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums;display:inline-block}
.sc b.bump{animation:sbump .25s ease-out}
@keyframes sbump{40%{transform:scale(1.25);color:var(--accent)}}
.goal{width:100%;max-width:440px;display:flex;align-items:center;gap:10px;font-size:13px;color:#C7D7E6}
.goal .bar{flex:1;height:8px;background:var(--board)}
.goal .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s cubic-bezier(.3,1.4,.5,1)}
#board{position:relative;width:min(100%,440px,calc(100vh - 270px));aspect-ratio:1;background:var(--board);touch-action:none;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#board.nudge-l{animation:nl .18s}#board.nudge-r{animation:nr .18s}#board.nudge-u{animation:nu .18s}#board.nudge-d{animation:nd .18s}
@keyframes nl{50%{transform:translateX(-6px)}}@keyframes nr{50%{transform:translateX(6px)}}@keyframes nu{50%{transform:translateY(-6px)}}@keyframes nd{50%{transform:translateY(6px)}}
.cell,.tile{position:absolute;left:0;top:0;width:var(--cs);height:var(--cs)}
.cell{background:var(--cell)}
.tile{display:flex;align-items:center;justify-content:center;transition:transform var(--slide,110ms) cubic-bezier(.25,.9,.35,1);z-index:2;will-change:transform}
.tile .in{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.ball{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#E3ECF4 55%,#B8CADB);box-shadow:inset -3px -4px 0 rgba(90,120,150,.25),0 3px 0 rgba(0,0,0,.25)}
.tile .lab{position:absolute;bottom:0;left:0;right:0;background:rgba(46,78,112,.85);color:#E3ECF4;text-align:center;font-size:calc(var(--cs) * .13);font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden}
.tile.new .in{animation:pop .2s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--slide,110ms)}
.tile.merged .in{animation:bump .26s cubic-bezier(.3,1.8,.5,1)}
.tile.gone{z-index:1}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes bump{0%{transform:scale(.7)}55%{transform:scale(1.2)}100%{transform:scale(1)}}
.tile svg{width:100%;height:84%;display:block;margin-bottom:16%}
.toast svg{width:56px;height:56px}.toast .ball{width:44px;height:44px}
#fx{position:absolute;inset:0;pointer-events:none;z-index:4;width:100%;height:100%}
.plus{position:absolute;z-index:5;font-family:var(--f-display);font-size:calc(var(--cs) * .32);color:var(--accent);text-shadow:0 2px 0 rgba(0,0,0,.4);pointer-events:none;animation:up .8s ease-out forwards;white-space:nowrap}
@keyframes up{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,-150%)}}
.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:6;background:var(--paper);color:var(--ink);padding:12px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px rgba(0,0,0,.4);pointer-events:none;animation:toast 1.6s cubic-bezier(.3,1.4,.5,1) forwards}
.toast b{font-family:var(--f-display);font-size:34px;line-height:1}.toast small{display:block;font-size:12px;color:#4B5A6F}
.toast .ic{width:56px;height:56px;display:flex;align-items:center;justify-content:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
.row{display:flex;gap:8px;width:100%;max-width:440px}
.row button{flex:1;font:inherit;min-height:48px;border:0;background:var(--board);color:var(--paper);font-weight:700;cursor:pointer}
.row button.snd{flex:0 0 52px}
.row button:disabled{opacity:.4}
.over{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;background:rgba(13,21,34,.82);padding:16px;text-align:center;z-index:7}
.over h2{margin:0;font-family:var(--f-display);font-size:56px;line-height:.9}
.over p{margin:0;max-width:30em;font-size:14px}
.over button{font:inherit;min-height:56px;min-width:200px;border:0;background:var(--accent);color:var(--ink);font-family:var(--f-display);font-size:30px;cursor:pointer}
.over .sec{background:transparent;color:var(--paper);border:2px solid var(--paper);font-family:var(--f-body);font-size:16px;font-weight:700}
.ladder{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:440px}
.ladder span{font-size:11px;padding:3px 6px;background:var(--board);color:#7F98B2;transition:background .3s,color .3s}
.ladder span.got{background:#F4F8FB;color:var(--ink)}
.ladder span.now{outline:2px solid var(--accent)}
.hint{font-size:12px;color:#A9C1D8;text-align:center}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
html[dir=ltr] body{direction:ltr}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile .in,.plus,.toast,#board{animation:none!important}}
</style>
<header><h1 data-i18n="game.merge.title">איחוד כדורי שלג</h1><div class="scores"><div class="sc"><small data-i18n="game.merge.score">ניקוד</small><b id="score">0</b></div><div class="sc"><small data-i18n="game.merge.best">שיא</small><b id="best">0</b></div></div></header>
<div class="goal"><span id="goalTxt"></span><div class="bar"><i id="goalBar"></i></div></div>
<div id="board" aria-label="לוח 4 על 4" data-i18n-attr="aria-label:game.merge.board_label"><canvas id="fx"></canvas></div>
<div class="row"><a class="back-site" href="../../#games" style="" data-i18n="game.merge.back_to_games">→ לכל המשחקים</a><button id="undo" type="button"></button><button id="new" type="button" data-i18n="game.merge.new_game">משחק חדש</button><button id="snd" class="snd" type="button" aria-label="צליל" data-i18n-attr="aria-label:game.merge.sound" aria-pressed="true">🔊</button></div>
<div class="ladder" id="ladder"></div>
<div class="hint" data-i18n="game.merge.hint">מחליקים לכל כיוון, בכל מקום במסך (או חצים במקלדת). שני כדורים זהים מתאחדים.</div>
<div class="over" id="over" hidden><h2 id="ovT"></h2><p id="ovP"></p><button id="ovB" type="button"></button><button id="ovU" type="button" class="sec" hidden data-i18n="game.merge.undo_last">ביטול המהלך האחרון</button></div>
<script src="game.js"></script>
