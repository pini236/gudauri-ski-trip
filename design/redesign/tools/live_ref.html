<!doctype html>
<!-- Reference for the live model of the mountain (stage B): the real terrain in a free 3D view, shaded so that it looks
     like the painted mountain of round 3. A design tool, not app code: the shaders below are GLSL ES 3.00, written to be
     copied into the Android engine (MapRenderer.kt) as they are. Serve the repo root and open
     /design/redesign/tools/live_ref.html?light=morning   (see live_ref.js for the parameters). -->
<meta charset="utf-8"><title>live ref</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script src="/site/js/vendor/three-r128.min.js"></script>
<script id="tvs" type="x">
in vec3 position; in float shadow;
uniform mat4 uMvp;
out vec3 vPos; out float vShadow;
void main(){ vPos=position; vShadow=shadow; gl_Position=uMvp*vec4(position,1.0); }
</script>
<script id="tfs" type="x">
precision highp float;
in vec3 vPos; in float vShadow;
uniform sampler2D uRelief; uniform sampler2D uCover; uniform sampler2D uTile;
uniform vec4 uBox;                      // x0, z0, 1/(x1-x0), 1/(z1-z0)
uniform vec3 uSun;                      // toward the sun (or the moon)
uniform vec3 uLit; uniform vec3 uShade; uniform vec3 uRock; uniform vec3 uRockS; uniform vec3 uHor;
uniform float uDirect;                  // 1 with a sun or a moon, 0 in the blue hour
uniform float uGlow;                    // 1 when the sun is under 5 degrees: only the heights catch it
uniform vec3 uCam; uniform vec3 uHaze;  // haze: where it starts and its length, metres from the eye; and the most it takes
uniform float uValley;                  // the thin haze that lies in the valleys
uniform float uDetail;                  // 1; 0 shows the terrain without the detail textures (for comparison)
uniform float uRipple;                  // how strongly the wind ripples of the tile show
uniform float uEdge;                    // 0; > 0: the last metres of the model fade into the air (alternative B of the edge board)
uniform vec2 uSeam;                     // seam2 (25.11.2026): x = 1 on, y = metres inside the edge where the model hands over to the band
uniform sampler2D uBand; uniform vec4 uBBox;  // the band: the model's own maps carried past its edge (ringband.webp), and its box (x0, z0, 1/w, 1/h)
uniform vec4 uAir2;                     // ring2 (25.11.2026): x = where the model's quick haze hands over (metres from the eye),
                                        // y = the length of the slow haze beyond it (0: off, as before), z..w = the thin air of the heights
float airOf(float d,float y){
  if(uAir2.y<=0.0) return uHaze.z*(1.0-exp(-max(d-uHaze.x,0.0)/uHaze.y));
  float dens=mix(1.0,uAir2.w,smoothstep(uAir2.z,uAir2.z+1800.0,y));          // high snow stands over the haze of the valleys
  float od=(clamp(d,uHaze.x,uAir2.x)-uHaze.x)/uHaze.y+max(d-uAir2.x,0.0)/uAir2.y;
  return uHaze.z*(1.0-exp(-od*dens));
}
out vec4 o;
void main(){
  vec2 uv=(vPos.xz-uBox.xy)*uBox.zw;
  vec3 rl=texture(uRelief,uv).rgb; vec3 cv=texture(uCover,uv).rgb; vec3 tl=texture(uTile,vPos.xz/640.0).rgb;
  // seam2: toward the edge the model is drawn from the same relief as the ring, so the two meet as one ground
  float wE=0.0; vec4 rr=vec4(rl,cv.r);
  if(uSeam.x>0.0){ vec2 qd=min(uv,1.0-uv)/uBox.zw; float te=1.0-clamp(min(qd.x,qd.y)/uSeam.y,0.0,1.0); wE=te*te*(3.0-2.0*te);
    rr=texture(uBand,(vPos.xz-uBBox.xy)*uBBox.zw); cv.r=mix(cv.r,rr.a,wE); }
  // the snow surface: the big shapes from the world map, wind ripples and grain from the tile (not on groomed runs, not on rock)
  vec2 s=mix((rl.rg-0.5)*3.2,(rr.rg-0.5)*3.2,wE);
  float deg=degrees(atan(length(s)));
  float amp=(1.0-0.85*cv.g)*(1.0-smoothstep(30.0,40.0,deg))*uDetail;
  s+=(tl.rg-0.5)*0.5*amp*uRipple;
  vec3 n=normalize(vec3(-s.x,1.0,-s.y));
  // light: sun through soft cast shadow; without a sun, light from above
  float lam=max(dot(n,uSun),0.0);
  float direct=lam*(1.0-0.94*vShadow)*uDirect+(1.0-uDirect)*0.55*n.y;
  float t=pow(direct,0.85);
  t*=mix(1.0,0.35+0.65*smoothstep(2350.0,3000.0,vPos.y),uGlow);
  vec3 col=uShade*(0.86+0.14*n.y)+(uLit-uShade*0.86)*t;
  // the glaze of a low sun on snow
  vec3 v=normalize(uCam-vPos); vec3 h=normalize(uSun+v);
  col+=pow(max(dot(n,h),0.0),38.0)*(1.0-vShadow)*uDirect*0.20*uLit;
  col*=0.94+0.06*smoothstep(2000.0,3100.0,vPos.y);
  col*=1.0+0.05*cv.g*(1.0-0.5*t);                                   // the satin of a groomed run
  // rock: too steep to hold snow, streaked down the fall line
  vec2 fall=s*s/(dot(s,s)+1e-4);                                    // how much the fall line runs east-west (x) or north-south (y)
  float stk=mix(0.5,texture(uTile,vPos.xz/160.0).b*fall.y+texture(uTile,vPos.zx/160.0).b*fall.x,uDetail);
  float rk=smoothstep(28.5,38.0,18.0+30.0*cv.r+(stk-0.5)*12.0)*0.9;
  vec3 rock=mix(uRockS,uRock,t)*(2.0*cv.b)*(0.7+0.6*stk);
  col=mix(col,rock,rk);
  col*=0.7+0.6*mix(rl.b,rr.b,wE);                                   // hollows a little darker, crests a little lighter
  // air: far ground goes to the colour of the horizon; the valleys hold a thin haze
  float d=length(vPos-uCam);
  float far=airOf(d,vPos.y);
  float low=smoothstep(2300.0,1750.0,vPos.y)*uValley;
  col=mix(col,uHor,clamp(far+low*(1.0-far),0.0,0.97));
  float edge=1.0; if(uEdge>0.0){ vec2 q=min(uv,1.0-uv)/uBox.zw; edge=smoothstep(0.0,uEdge,min(q.x,q.y)); }
  col=mix(uHor,col,edge);
  col=clamp(col,0.0,1.0); col=col*col*(3.0-2.0*col)*0.55+col*0.45;  // a gentle filmic curve
  o=vec4(col,1.0);
}
</script>
<script id="svs" type="x">
in vec3 position; out vec2 vNdc;
void main(){ vNdc=position.xy; gl_Position=vec4(position.xy,0.9999,1.0); }
</script>
<script id="sfs" type="x">
precision highp float;
in vec2 vNdc;
uniform mat4 uInv; uniform vec3 uEye;
uniform sampler2D uHorizon; uniform sampler2D uCirrus;
uniform vec3 uSun; uniform vec3 uLit; uniform vec3 uShade; uniform vec3 uZen; uniform vec3 uHor; uniform vec3 uBand;
uniform float uBandOn; uniform float uDirect; uniform float uGlow; uniform float uStars; uniform float uSunUp;
uniform vec4 uStrip;                    // lo, hi (degrees), far metres, 0
uniform float uFar;                     // 1; 0 hides the far horizon
uniform vec2 uAir;                      // the far horizon in the air: at 9 km, and how much more by the far end
uniform float uSkyTop;                  // degrees above the horizon where the sky reaches its zenith colour
out vec4 o;
float hash(vec3 p){ return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453); }
void main(){
  vec4 w=uInv*vec4(vNdc,1.0,1.0); vec3 d=normalize(w.xyz/w.w-uEye);
  float el=degrees(asin(clamp(d.y,-1.0,1.0)));
  float az=atan(d.x,-d.z); if(az<0.0) az+=6.2831853;               // from north, clockwise
  // the sky: horizon colour low, zenith colour by 16 degrees up (a painter's sky: the phone sees little of it)
  float k=clamp(el/uSkyTop,0.0,1.0);
  vec3 c=mix(uZen,uHor,pow(1.0-k,1.25));
  // the pink band of dawn and dusk, opposite the sun
  float away=0.6+0.4*(0.5-0.5*dot(normalize(d.xz+1e-5),normalize(uSun.xz+1e-5)));
  c=mix(c,uBand,exp(-pow((el-4.5)/3.2,2.0))*0.75*uBandOn*away);
  // high cloud (paint)
  float ci=texture(uCirrus,vec2(az/6.2831853,1.0-clamp(el/24.0,0.0,1.0))).r*smoothstep(0.0,5.0,el);
  vec3 cc=uStars<1.0 ? uHor*0.4+0.6*uLit : uHor*1.6;
  float cm=ci*(uStars<1.0?0.34:0.08);
  c=mix(c,cc,cm);
  // stars
  if(uStars>0.0 && el>1.0){ vec3 cell=floor(d*420.0); float hh=hash(cell); if(hh>0.9965) c+=vec3(0.95,0.97,1.0)*(hh-0.9965)/0.0035*uStars*(1.0-cm)*smoothstep(1.0,8.0,el); }
  // the glow around the sun
  float sd=max(dot(d,uSun),0.0);
  c+=uLit*(pow(sd,48.0)*0.35+pow(sd,900.0)*1.2)*uSunUp;
  // the far horizon: real terrain around Gudauri, lit by the same sun, deep in the air
  if(uFar>0.0 && el>uStrip.x && el<uStrip.y){
    vec3 hz=texture(uHorizon,vec2(az/6.2831853,(uStrip.y-el)/(uStrip.y-uStrip.x))).rgb;
    float land=1.0-smoothstep(0.90,0.99,hz.b);
    vec2 s=(hz.rg-0.5)*3.2; vec3 n=normalize(vec3(-s.x,1.0,-s.y));
    float dist=hz.b*uStrip.z/0.98;
    float t=pow(max(dot(n,uSun),0.0)*uDirect+(1.0-uDirect)*0.55*n.y,0.85);
    t*=mix(1.0,0.5,uGlow*(1.0-smoothstep(0.0,2.5,el+3.0)));
    vec3 g=uShade*(0.86+0.14*n.y)+(uLit-uShade*0.86)*t;
    float deg=degrees(atan(length(s)));
    g=mix(g,mix(uShade*0.55,uLit*0.5,t),smoothstep(24.0,34.0,deg)*0.7);            // steep faces: rock
    float air=uAir.x+uAir.y*(1.0-exp(-max(dist-9000.0,0.0)/26000.0));
    g=mix(g,uHor,air);
    c=mix(c,g,land*smoothstep(uStrip.x,uStrip.x+1.5,el));
  }
  c=clamp(c,0.0,1.0); c=c*c*(3.0-2.0*c)*0.55+c*0.45;
  o=vec4(c,1.0);
}
</script>
<script id="rvs" type="x">
in vec3 position; in float shadow; in vec3 nrm;
uniform mat4 uMvp;
out vec3 vPos; out float vShadow; out vec3 vN;
void main(){ vPos=position; vShadow=shadow; vN=nrm; gl_Position=uMvp*vec4(position,1.0); }
</script>
<script id="rfs" type="x">
// the ring (alternative A of the edge board, 25.11.2026): the real terrain around the model, 240 m cells, lit like the snow of the model
precision highp float;
in vec3 vPos; in float vShadow; in vec3 vN;
uniform sampler2D uTile;
uniform vec3 uSun; uniform vec3 uLit; uniform vec3 uShade; uniform vec3 uRock; uniform vec3 uRockS; uniform vec3 uHor;
uniform float uDirect; uniform float uGlow; uniform vec3 uCam; uniform vec3 uHaze; uniform float uValley;
uniform float uRingR;                  // the half size of the ring: its last 5 km go into the air, where the far horizon takes over
uniform vec4 uAir2;                     // ring2 (25.11.2026): x = where the model's quick haze hands over (metres from the eye),
                                        // y = the length of the slow haze beyond it (0: off, as before), z..w = the thin air of the heights
float airOf(float d,float y){
  if(uAir2.y<=0.0) return uHaze.z*(1.0-exp(-max(d-uHaze.x,0.0)/uHaze.y));
  float dens=mix(1.0,uAir2.w,smoothstep(uAir2.z,uAir2.z+1800.0,y));          // high snow stands over the haze of the valleys
  float od=(clamp(d,uHaze.x,uAir2.x)-uHaze.x)/uHaze.y+max(d-uAir2.x,0.0)/uAir2.y;
  return uHaze.z*(1.0-exp(-od*dens));
}
uniform sampler2D uRRel; uniform vec4 uRBox; uniform float uRTex; uniform vec4 uMBox;   // ring2: the relief at 60 m (slopes, occlusion) over the inner box; uMBox: the model x0 z0 x1 z1
uniform vec2 uSeam; uniform float uRip;   // seam2: x = 1 on; y = the band's margin (metres past the model): there the ring is drawn as the model
uniform sampler2D uBand; uniform vec4 uBBox; uniform float uDbg;
out vec4 o;
void main(){
  vec3 n0=normalize(vN); vec2 s=-n0.xz/max(n0.y,0.2); float occ=1.0;
  vec2 ruv=(vPos.xz-uRBox.xy)*uRBox.zw; vec3 rr=texture(uRRel,clamp(ruv,0.0,1.0)).rgb;
  if(uRTex>0.0 && ruv.x>0.0 && ruv.y>0.0 && ruv.x<1.0 && ruv.y<1.0){
    float om=max(max(uMBox.x-vPos.x,vPos.x-uMBox.z),max(uMBox.y-vPos.z,vPos.z-uMBox.w));
    float w=smoothstep(0.0,0.04,min(min(ruv.x,ruv.y),min(1.0-ruv.x,1.0-ruv.y)))*(uSeam.x>0.0 ? 1.0 : smoothstep(0.0,500.0,om));
    s=mix(s,(rr.rg-0.5)*3.2,w); occ=mix(1.0,0.7+0.6*rr.b,w); }
  // seam2: near the model the ring takes the model's own maps (the band), so the two meet as one ground; the ring's 60 m relief past it
  float wb=0.0; vec4 bb=vec4(0.5);
  if(uSeam.x>0.0){ vec2 buv=(vPos.xz-uBBox.xy)*uBBox.zw; bb=texture(uBand,clamp(buv,0.0,1.0));   // sampled outside any branch: the mip level needs the neighbours
    float om=max(max(uMBox.x-vPos.x,vPos.x-uMBox.z),max(uMBox.y-vPos.z,vPos.z-uMBox.w));
    wb=1.0-smoothstep(uSeam.y-1200.0,uSeam.y-100.0,om);
    s=mix(s,(bb.rg-0.5)*3.2,wb); occ=mix(occ,0.7+0.6*bb.b,wb); }
  float deg=degrees(atan(length(s)));
  s+=(texture(uTile,vPos.xz/640.0).rg-0.5)*0.5*(uSeam.x>0.0 ? uRip : 1.6)*(1.0-smoothstep(30.0,40.0,deg));   // the same wind ripples as on the model
  vec3 n=normalize(vec3(-s.x,1.0,-s.y));
  float lam=max(dot(n,uSun),0.0);
  float direct=lam*(1.0-0.94*vShadow)*uDirect+(1.0-uDirect)*0.55*n.y;
  float t=pow(direct,0.85);
  t*=mix(1.0,0.35+0.65*smoothstep(2350.0,3000.0,vPos.y),uGlow);
  vec3 col=uShade*(0.86+0.14*n.y)+(uLit-uShade*0.86)*t;
  if(uSeam.x>0.0){ vec3 v=normalize(uCam-vPos); vec3 hh=normalize(uSun+v);                     // seam2: the model's glaze of a low sun, and its height tone
    col+=pow(max(dot(n,hh),0.0),38.0)*(1.0-vShadow)*uDirect*0.20*uLit; col*=0.94+0.06*smoothstep(2000.0,3100.0,vPos.y); }
  float stk=texture(uTile,vPos.xz/160.0).b;
  float rk=smoothstep(27.0,36.0,deg+(stk-0.5)*6.0)*0.8;
  vec2 fall=s*s/(dot(s,s)+1e-4);
  float stk2=texture(uTile,vPos.xz/160.0).b*fall.y+texture(uTile,vPos.zx/160.0).b*fall.x;
  float tone=0.75+0.5*stk;
  if(uRTex>0.0){                       // ring2: the model's rock, with the grain that still shows from afar (the tile read large)
    float m1=texture(uTile,vPos.xz/2400.0).b, m2=texture(uTile,vPos.zx/900.0).b, m3=texture(uTile,vPos.xz/5200.0+0.37).r;
    float m4=texture(uTile,vPos.xz/420.0+0.61).r;
    stk=mix(m2,stk2,0.35);
    float pot=deg+(stk2-0.5)*7.0+(m2-0.5)*11.0+(m4-0.5)*7.0+(m1-0.5)*8.0+(m3-0.5)*6.0;
    rk=smoothstep(27.0,36.0,pot)*0.92;
    tone=(0.82+0.36*m1)*(0.7+0.6*stk); }
  vec3 colS=col;
  col=mix(col,mix(uRockS,uRock,t)*tone,rk);
  if(wb>0.0){                          // seam2: the model's rock, from the band's rock potential (the same lines as the model)
    float stM=texture(uTile,vPos.xz/160.0).b*fall.y+texture(uTile,vPos.zx/160.0).b*fall.x;
    float rkM=smoothstep(28.5,38.0,18.0+30.0*bb.a+(stM-0.5)*12.0)*0.9;
    vec3 rockM=mix(uRockS,uRock,t)*(0.82+0.36*texture(uTile,vPos.xz/2400.0).b)*(0.7+0.6*stM);
    col=mix(col,mix(colS,rockM,rkM),wb); }
  col*=occ;
  float d=length(vPos-uCam);
  float far=airOf(d,vPos.y);
  float low=smoothstep(2300.0,1750.0,vPos.y)*uValley;
  col=mix(col,uHor,clamp(far+low*(1.0-far),0.0,0.97));
  float rim=smoothstep(uRingR-5000.0,uRingR-500.0,max(abs(vPos.x),abs(vPos.z)));
  col=mix(col,uHor,rim);
  col=clamp(col,0.0,1.0); col=col*col*(3.0-2.0*col)*0.55+col*0.45;
  if(uDbg>0.0) col=mix(col,uDbg>1.5?vec3(0.0,0.0,1.0):vec3(1.0,0.0,0.0),0.5);
  o=vec4(col,1.0);
}
</script>
<script id="cfs" type="x">
// the cloud sea (alternative B of the edge board): paint, a layer of cloud at uCloud metres that the model rises out of
precision highp float;
in vec3 vPos; in float vShadow; in vec3 vN;
uniform sampler2D uCloudT;
uniform vec3 uSun; uniform vec3 uLit; uniform vec3 uShade; uniform vec3 uHor; uniform float uDirect; uniform vec3 uCam; uniform vec3 uHaze;
out vec4 o;
float f(vec2 p){ return texture(uCloudT,p/5200.0).r*0.75+texture(uCloudT,p/1300.0+0.31).r*0.25; }
void main(){
  vec2 p=vPos.xz; float e=40.0, h=f(p);
  vec3 n=normalize(vec3(-(f(p+vec2(e,0.0))-h)*900.0/e,1.0,-(f(p+vec2(0.0,e))-h)*900.0/e));
  float lam=max(dot(n,uSun),0.0)*uDirect+(1.0-uDirect)*0.55*n.y;
  float t=pow(clamp(lam*1.15,0.0,1.0),0.8);
  vec3 col=mix(uShade*1.08,uLit,0.35+0.65*t)*(0.88+0.12*h);
  float d=length(vPos-uCam);
  float far=0.9*(1.0-exp(-max(d-uHaze.x*0.5,0.0)/(uHaze.y*2.6)));
  col=mix(col,uHor,clamp(far,0.0,0.95));
  col=clamp(col,0.0,1.0); col=col*col*(3.0-2.0*col)*0.55+col*0.45;
  o=vec4(col,1.0);
}
</script>
