<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>המכשיר: המפה</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&amp;family=JetBrains+Mono:wght@500;700;800&amp;family=Noto+Sans+Georgian:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.C{--bg:#FFFFFF;--sf:#F0F0F0;--ink:#000000;--ink2:#4D4D4D;--line:#000000;--acc:#C8F31D;--hlbg:#C8F31D;--hlfg:#000000;--ok:#127A40;--onok:#FFFFFF;--bad:#C4261D;--blue:#1559B8;font-family:'Rubik','Noto Sans Georgian',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.C .night{--bg:#000000;--sf:#141414;--ink:#FFFFFF;--ink2:#A6A6A6;--line:#FFFFFF;--hlbg:transparent;--hlfg:#C8F31D;--ok:#3EE08C;--onok:#000000;--bad:#FF6B5E;--blue:#5CB0FF}
.C .scr{position:absolute;inset:0;background:var(--bg);color:var(--ink);overflow:hidden}
.C .n{display:none}.C .night .n{display:block}.C .night .d{display:none}
.C button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.C p,.C h1,.C h2,.C h3{margin:0}
.C svg{display:block}
.C .mono{font-family:'JetBrains Mono',ui-monospace,monospace;direction:ltr;unicode-bidi:isolate}
.C .hd{position:absolute;top:50px;inset-inline:0;height:64px;box-sizing:border-box;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid var(--line)}
.C .hd b{font-size:24px;font-weight:900}
.C .hd .mono{font-size:18px;font-weight:700;color:var(--ink2)}
.C .bk{width:64px;height:64px;display:flex;align-items:center;justify-content:center;margin-inline-start:-20px}
.C .pg{position:absolute;top:114px;bottom:100px;inset-inline-start:0;inset-inline-end:36px;box-sizing:border-box;padding:20px 20px 0;display:flex;flex-direction:column}
.C .rail{position:absolute;top:114px;bottom:100px;inset-inline-end:0;width:36px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-inline-start:2px solid var(--line)}
.C .rail i{display:block;width:8px;height:28px;background:var(--ink2)}
.C .rail i.on{height:64px;background:var(--ink)}
.C .night .rail i.on{background:var(--acc)}
.C .num{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:800;line-height:.9;letter-spacing:-.05em;direction:ltr;unicode-bidi:isolate;display:block}
.C .hl{background:var(--hlbg);color:var(--hlfg)}
.C .night .num.hl{padding-inline:0!important}
.C .cap{font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--ink2);line-height:1.3}
.C .lbl{font-size:24px;font-weight:700;line-height:1.2}
.C .cells{display:grid;border:2px solid var(--line)}
.C .cells>div{padding:12px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;border-inline-start:2px solid var(--line)}
.C .cells>div:first-child{border-inline-start:0}
.C .cells .mono{font-size:30px;font-weight:800;line-height:1}
.C .row{min-height:64px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid var(--line);font-size:20px;font-weight:700;width:100%;text-align:start}
.C .row:last-child{border-bottom:0}
.C .blk{min-width:84px;height:40px;box-sizing:border-box;padding:0 10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;background:var(--ok);color:var(--onok);border:2px solid var(--ok)}
.C .blk.off{background:transparent;color:var(--bad);border-color:var(--bad);border-style:dashed}
.C .chip{height:64px;box-sizing:border-box;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line);font-size:19px;font-weight:700;background:var(--bg);color:var(--ink)}
.C .chip.on{background:var(--ink);color:var(--bg)}
.C .sq{width:64px;height:64px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.C .tag{position:absolute;font-size:14px;font-weight:700;line-height:1.2;padding:2px 6px;background:var(--bg);color:var(--ink);border:2px solid var(--line);white-space:nowrap}
.C .rec{position:absolute;inset-inline:0;bottom:0;width:100%;height:100px;box-sizing:border-box;padding-bottom:28px;background:var(--acc);color:#000000;border-top:2px solid #000000;display:flex;align-items:center;justify-content:center;gap:14px;font-size:26px;font-weight:900}
.C .rec .dot{width:22px;height:22px;border-radius:50%;background:#000000}
.C .rec.stop{background:var(--ink);color:var(--bg);border-top-color:var(--ink)}
.C .rec.stop .dot{border-radius:0;background:var(--bg)}
</style>
</helmet>
<div class="C" style="width: 390px; height: 844px; position: relative; overflow: hidden">
<div class="{{mode}}">
<div class="scr" dir="rtl">
<div class="hd"><b>מפה</b><span class="mono">3/5</span></div>
<div style="position: absolute; top: 114px; bottom: 100px; inset-inline-start: 0; inset-inline-end: 36px; overflow: hidden; background: var(--bg)">
<img class="d" src="/_blob/f64a9f69568527d72ccb24f0319edf9b" alt="מפת המסלולים והרכבלים של גודאורי, צפון למעלה" style="position: absolute; left: 21px; top: 0; width: 312px; height: 675px">
<img class="n" src="/_blob/c5774f61fd0396a7447dc605aa3bf209" alt="מפת המסלולים והרכבלים של גודאורי, צפון למעלה" style="position: absolute; left: 21px; top: 0; width: 312px; height: 675px">
<span class="tag" dir="rtl" style="left: 232px; top: 100px; border-style: dashed; border-color: var(--bad); color: var(--bad)"><bdi>Sadzele</bdi> · סגור</span>
<span class="tag" dir="ltr" style="left: 276px; top: 240px">Kudebi</span>
<span class="tag" dir="ltr" style="left: 90px; top: 262px">Goodaura</span>
<span class="tag" dir="ltr" style="left: 248px; top: 286px">Kikilo</span>
<span class="tag" dir="ltr" style="left: 212px; top: 384px">New Goodaura</span>
<span class="tag" dir="ltr" style="left: 28px; top: 462px">Shino</span>
<span class="tag" dir="ltr" style="left: 124px; top: 528px">Pirveli</span>
<div class="blk" style="position: absolute; right: 12px; top: 12px; height: 44px; font-size: 17px"><span class="mono" style="margin-inline-end: 6px">10/12</span>פתוחים</div>
<div style="position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 12px">
<button class="sq" aria-label="התקרבות"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="4"><path d="M15 4v22M4 15h22"/></svg></button>
<button class="sq" aria-label="התרחקות"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="4"><path d="M4 15h22"/></svg></button>
</div>
<div style="position: absolute; left: 8px; right: 8px; bottom: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button class="chip on" style="padding: 0 6px; font-size: 18px">רכבלים</button>
<button class="chip" style="padding: 0 6px; font-size: 18px">מסלולים</button>
<button class="chip" style="padding: 0 6px; font-size: 18px">איפה אני</button>
</div>
</div>
<div class="rail" aria-hidden="true"><i></i><i></i><i class="on"></i><i></i><i></i></div>
<button class="rec"><span class="dot"></span>הקלטה</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"night":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { mode: (this.props.night ?? false) ? 'night' : 'day' };
}
}
</script>
</body>
</html>
