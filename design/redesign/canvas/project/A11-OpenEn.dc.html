<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Mountain: opening, before the season</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
.A{--bg:#EEF3F8;--panel:rgba(255,255,255,.88);--solid:#FFFFFF;--ink:#0E2233;--ink2:#4A5D70;--line:rgba(14,34,51,.14);--acc:#6B3FD4;--onacc:#FFFFFF;--accsoft:rgba(107,63,212,.12);--ok:#198549;--warn:#B25E00;--bad:#C4261D;--shade:0 10px 30px rgba(14,34,51,.16);--veil:rgba(238,243,248,.74);--pg:#198549;--pb:#1F6FD0;--pr:#D1342B;--pk:#15181C;font-family:'Heebo',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.A .night{--bg:#0B1220;--panel:rgba(17,27,44,.86);--solid:#111B2C;--ink:#EAF1F8;--ink2:#9FB0C4;--line:rgba(234,241,248,.16);--acc:#B79CFF;--onacc:#1A0B3D;--accsoft:rgba(183,156,255,.16);--ok:#46D08A;--warn:#F5B14C;--bad:#FF7468;--shade:0 10px 30px rgba(0,0,0,.5);--veil:rgba(11,18,32,.76);--pg:#46D08A;--pb:#62AEFF;--pr:#FF7468;--pk:#DCE4EC;color:var(--ink)}
.A .scr{position:absolute;inset:0;background:var(--bg);color:var(--ink);overflow:hidden}
.A .n{display:none}.A .night .n{display:block}.A .night .d{display:none}
.A button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:start}
.A a{color:inherit;text-decoration:none}
.A p,.A h1,.A h2,.A h3{margin:0}
.A .map{position:absolute;left:0;top:0;width:390px;height:844px}
.A .veil{position:absolute;inset:0;background:var(--veil)}
.A .glass{background:var(--panel);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:var(--shade)}
.A .pulse{position:absolute;top:58px;left:16px;right:16px;min-height:48px;border-radius:999px;display:flex;align-items:center;gap:10px;padding:0 18px;font-size:15px;font-weight:500;box-sizing:border-box}
.A .dot{width:9px;height:9px;border-radius:50%;background:var(--ink2);flex:none;display:inline-block}
.A .dot.ok{background:var(--ok)}.A .dot.warn{background:var(--warn)}.A .dot.bad{background:var(--bad)}
.A .sheet{position:absolute;left:0;right:0;bottom:0;border-radius:28px 28px 0 0;padding:10px 20px 28px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px}
.A .grab{width:40px;height:5px;border-radius:3px;background:var(--ink2);opacity:.5;align-self:center;flex:none}
.A .where{height:48px;border-radius:999px;background:var(--accsoft);display:flex;align-items:center;gap:10px;padding:0 18px;font-size:16px;color:var(--ink2);width:100%;box-sizing:border-box}
.A .layers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.A .layer{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;min-height:72px;text-align:center}
.A .ic{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--solid);display:flex;align-items:center;justify-content:center;flex:none;box-sizing:border-box}
.A .on .ic,.A .ic.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.A .rec{position:absolute;width:64px;height:64px;border-radius:50%;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;box-shadow:var(--shade)}
.A .chip{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--solid);font-size:14px;font-weight:500;box-sizing:border-box;white-space:nowrap}
.A .chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.A .big{font-weight:300;line-height:.9;letter-spacing:-.02em}
.A .k{font-size:13px;color:var(--ink2);font-weight:500;line-height:1.35}
.A .row{display:flex;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--line);width:100%;box-sizing:border-box}
.A .tag{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--panel);border:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.A .cta{min-height:52px;border-radius:999px;background:var(--acc);color:var(--onacc);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 22px;box-sizing:border-box}
.A .ghost{min-height:52px;border-radius:999px;border:1px solid var(--line);background:var(--solid);font-size:16px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 22px;box-sizing:border-box}
.A .round{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;box-sizing:border-box}
.A .pd{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
</style>
</helmet>
<div class="A" style="width: 390px; height: 844px; position: relative; overflow: hidden">
<div class="{{mode}}">
<div class="scr" dir="ltr">
<img class="map d" src="/_blob/c2e6538c15f646530aa5b98ba06ca0e4" alt="" style="top: -45px">
<img class="map n" src="/_blob/4963d9a7301c708df02401cab4cd673c" alt="" style="top: -45px">
<img class="map d" src="/_blob/728e69d5a329fc93475d7cee722073f0" alt="Map of Gudauri runs and lifts" style="top: -45px">
<img class="map n" src="/_blob/2043caf19106cea06b2238a443a20b82" alt="Map of Gudauri runs and lifts" style="top: -45px">

<span class="tag" style="left: 336px; top: 224px">Kudebi · 3,006 m</span>
<span class="tag" style="left: 56px; top: 488px">Gudauri · 2,196 m</span>

<button class="pulse glass" aria-label="Mountain status: asleep, opens in 35 days">
<span class="dot"></span>
<span style="flex: 1">Mountain asleep · opens in 35 days</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</button>

<div style="position: absolute; left: 16px; top: 122px; display: flex; flex-direction: column; gap: 10px">
<button class="round glass" aria-label="Switch to 3D">3D</button>
<button class="round glass" aria-label="Where am I">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
</button>
</div>
<button class="chip glass" style="position: absolute; left: 70px; top: 122px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
Kobi side
</button>

<button class="rec" style="right: 20px; bottom: 272px" aria-label="Record">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5" fill="currentColor" stroke="none"/></svg>
</button>

<div class="sheet glass">
<span class="grab"></span>
<button class="where">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
Where to?
</button>
<div style="display: flex; gap: 8px">
<button class="chip" style="flex: 1; padding: 0 8px; font-size: 13px"><span style="font-weight: 700">Dec 20</span>Season opens</button>
<button class="chip" style="flex: 1; padding: 0 8px; font-size: 13px">4-day pass: <span style="font-weight: 700">390 ₾</span></button>
</div>
<div class="layers">
<button class="layer"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5l18-2M12 4v5M7 9h10a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2zM5 14h14"/></svg></span>Lifts</button>
<button class="layer"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 16a4 4 0 1 1 1.2-7.8A5 5 0 0 1 18 10a3 3 0 0 1 0 6H7zM9 20v.01M13 20v.01M17 20v.01"/></svg></span>Weather</button>
<button class="layer"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></span>Meet</button>
<button class="layer"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></svg></span>More</button>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"night":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { mode: (this.props.night ?? false) ? 'night' : 'day' };
}
}
</script>
</body>
</html>
