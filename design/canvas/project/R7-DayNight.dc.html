<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>יום ולילה</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&amp;family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#EEF2F5}
@media (prefers-reduced-motion: reduce){ .anim{ transition: none !important } }
</style>
</helmet>
<div class="anim" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: {{ bg }}; color: {{ ink }}; font-family: 'IBM Plex Sans Hebrew', 'Segoe UI', system-ui, sans-serif; direction: rtl; display: flex; flex-direction: column; transition: background-color 0.9s, color 0.9s">
<div class="anim" style="display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 8px 8px; background: {{ paper }}; border-bottom: 1px solid {{ rule }}; transition: background-color 0.9s, border-color 0.9s">
<span style="font-family: Karantina, 'Arial Narrow', sans-serif; font-weight: 700; font-size: 30px; line-height: 1">גודאורי 2027</span>
<button type="button" aria-label="{{ toggleLabel }}" onClick="{{ flip }}" class="anim" style="position: relative; width: 48px; height: 48px; border: 1.5px solid {{ ink }}; background: {{ paper }}; color: {{ ink }}; display: flex; align-items: center; justify-content: center; transition: background-color 0.9s, color 0.9s, border-color 0.9s">
<span class="anim" style="position: absolute; display: flex; opacity: {{ sunIconOp }}; transform: rotate({{ sunIconRot }}deg) scale({{ sunIconScale }}); transition: opacity 0.5s, transform 0.7s"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M5.3 18.7L7 17M17 7l1.7-1.7"></path></svg></span>
<span class="anim" style="position: absolute; display: flex; opacity: {{ moonIconOp }}; transform: rotate({{ moonIconRot }}deg) scale({{ moonIconScale }}); transition: opacity 0.5s, transform 0.7s"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"></path></svg></span></button>
</div>
<div class="anim" style="position: relative; height: 330px; flex: none; overflow: hidden; background: {{ sky }}; transition: background-color 0.9s">

yle="position: absolute; left: 30px; top: 168px; width: 2px; height: 2px; border-radius: 2px; background: #EAF0F7; opacity: {{ starOp }}" class="anim"></span><span style="position: absolute; left: 346px; top: 150px; width: 3px; height: 3px; border-radius: 2px; background: #EAF0F7; opacity: {{ starOp }}" class="anim"></span>

</div>

<div style="position: absolute; top: 12px; right: 16px; left: 16px; display: flex; justify-content: space-between; align-items: flex-start"><span style="font-size: 13px; font-weight: 600; color: {{ ink }}" class="anim">{{ phaseLabel }}</span><span style="font-size: 12px; color: {{ muted }}">קו הרכס: מחושב מהכפר</span></div>
</div>
<div style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><h1 style="margin: 0; font-family: Karantina, 'Arial Narrow', sans-serif; font-weight: 700; font-size: 44px; line-height: 1">גודאורי, גאורגיה</h1><span style="font-size: 13px; color: {{ muted }}">ינואר 2027</span></div>
<div class="anim" style="display: flex; background: {{ paper }}; border: 1px solid {{ rule }}; transform: rotate(-2deg); transition: background-color 0.9s, border-color 0.9s">
<div style="flex: 1; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600; color: {{ muted }}">כרטיס עלייה למטוס</span><span style="font-family: Karantina, 'Arial Narrow', sans-serif; font-weight: 700; font-size: 30px; line-height: 1">תל אביב ← טביליסי</span><span style="font-size: 12.5px; color: {{ muted }}">10.1.2027 · 6H 897 · 16:00</span></div>
<div style="width: 92px; background: {{ accent }}; color: {{ onAccent }}; display: flex; flex-direction: column; align-items: center; justify-content: center; border-inline-start: 2px dashed {{ onAccent }}"><span style="font-family: Karantina, 'Arial Narrow', sans-serif; font-weight: 700; font-size: 52px; line-height: 0.85">102</span><span style="font-size: 12px; font-weight: 600">ימים לטיסה</span></div>
</div>
<div class="anim" style="display: inline-flex; align-self: flex-start; align-items: center; margin-top: 8px; padding: 8px 20px 8px 34px; background: {{ board }}; color: {{ onBoard }}; font-family: Karantina, 'Arial Narrow', sans-serif; font-weight: 700; font-size: 30px; line-height: 1; clip-path: polygon(0 50%, 18px 0, 100% 0, 100% 100%, 18px 100%); transition: background-color 0.9s, color 0.9s">מפת מסלולים</div>
</div>
<div style="margin-top: auto; padding: 0 16px 18px"><div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12.5px; font-weight: 700; color: {{ muted }}">מצב תצוגה</span>
<div role="group" aria-label="מצב תצוגה" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1.5px solid {{ ink }}">
<sc-for list="{{ modes }}" as="m" hint-placeholder-count="3"><button type="button" aria-pressed="{{ m.on }}" onClick="{{ m.pick }}" class="anim" style="height: 48px; border: 0; background: {{ m.bg }}; color: {{ m.fg }}; font: inherit; font-size: 15px; font-weight: 700; transition: background-color 0.4s, color 0.4s">{{ m.label }}</button></sc-for>
</div>
<span style="font-size: 12.5px; color: {{ muted }}; line-height: 1.35">{{ caption }}</span>
</div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const DAY = { bg: '#EEF2F5', paper: '#FFFFFF', ink: '#13233A', muted: '#4B5A6F', rule: '#CBD5DF', sky: '#DCE6EF', ridgeFar: '#B4C3D2', ridgeNear: '#EEF2F5', accent: '#F4B942', onAccent: '#13233A', board: '#1F5FC4', onBoard: '#FFFFFF' };
const NIGHT = { bg: '#0D1522', paper: '#16223A', ink: '#EAF0F7', muted: '#A3B3C8', rule: '#2A3B55', sky: '#0A1220', ridgeFar: '#22345A', ridgeNear: '#0D1522', accent: '#F4B942', onAccent: '#13233A', board: '#5B9BFF', onBoard: '#0D1522' };
class Component extends DCLogic {
  state = { mode: 'auto', sticky: 'night' };
  renderVals() {
    const auto = this.state.mode === 'auto';
    const eff = auto ? 'night' : this.state.mode;   // in the demo, "auto" reads a device time of 18:12, after sunset
    const t = eff === 'day' ? DAY : NIGHT;
    const isDay = eff === 'day';
    const labels = { auto: 'אוטומטי', day: 'יום', night: 'לילה' };
    const modes = ['auto', 'day', 'night'].map((k) => ({ label: labels[k], on: k === this.state.mode, bg: k === this.state.mode ? t.ink : t.paper, fg: k === this.state.mode ? t.paper : t.ink, pick: () => this.setState({ mode: k }) }));
    return { ...t, rot: isDay ? -28 : 152, counter: isDay ? 28 : -152, radius: 230, radiusMoon: 200,
      starOp: isDay ? 0 : 0.9, phaseLabel: isDay ? 'שמש · 12.1.2027' : 'ירח',
      toggleLabel: isDay ? 'מעבר למצב לילה' : 'מעבר למצב יום',
      flip: () => this.setState({ mode: isDay ? 'night' : 'day' }),
      sunIconOp: isDay ? 1 : 0, sunIconRot: isDay ? 0 : 90, sunIconScale: isDay ? 1 : 0.4,
      moonIconOp: isDay ? 0 : 1, moonIconRot: isDay ? -90 : 0, moonIconScale: isDay ? 0.4 : 1,
      modes, caption: auto ? 'לפי שעת המכשיר. עכשיו 18:12, אחרי השקיעה ב-17:44, ולכן לילה.' : (isDay ? 'תמיד בהיר, גם בלילה.' : 'תמיד כהה, גם ביום.') };
  }
}
</script>
</body>
</html>
