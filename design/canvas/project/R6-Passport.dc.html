<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>דרכון המסלולים</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&amp;family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&amp;family=Noto+Sans+Georgian:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#EEF2F5}
a{color:#1F5FC4}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: #EEF2F5; color: #13233A; font-family: 'IBM Plex Sans Hebrew', 'Segoe UI', system-ui, sans-serif; direction: rtl; display: flex; flex-direction: column">
<div style="padding: 14px 16px 6px; display: flex; align-items: baseline; justify-content: space-between"><h1 style="margin: 0; font-family: Karantina, 'Arial Narrow', sans-serif; font-weight: 700; font-size: 40px; line-height: 1">דרכון המסלולים</h1><span style="font-size: 12px; color: #4B5A6F">נתוני דוגמה</span></div>
<div style="margin: 0 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 8px 12px; background: #FFFFFF; border: 1px solid #CBD5DF">
<div style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #4B5A6F">של</span><span style="font-weight: 700; font-size: 15px">פיני זולברג</span></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #4B5A6F">מסלולים</span><span style="font-family: Karantina, 'Arial Narrow', sans-serif; font-weight: 700; font-size: 30px; line-height: 1">{{ count }} / 27</span></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #4B5A6F">ירידה מצטברת</span><span style="font-family: Karantina, 'Arial Narrow', sans-serif; font-weight: 700; font-size: 30px; line-height: 1">{{ meters }} מ׳</span></div>
</div>
<div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; min-height: 0">
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: baseline; justify-content: space-between; border-top: 6px solid {{ g.hex }}; padding-top: 3px"><span style="font-size: 13px; font-weight: 700">{{ g.name }}</span><span style="font-size: 12px; color: #4B5A6F">{{ g.done }} מתוך {{ g.total }}</span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{ g.tiles }}" as="t" hint-placeholder-count="4"><button type="button" aria-pressed="{{ t.done }}" onClick="{{ t.toggle }}" style="min-height: 44px; padding: 2px 4px; border: 1.5px solid {{ t.hex }}; background: {{ t.bg }}; color: {{ t.fg }}; font: inherit; font-size: 11.5px; font-weight: 700; line-height: 1.15; display: flex; align-items: center; justify-content: center; text-align: center"><span dir="ltr">{{ t.k }}</span></button></sc-for>
</div></div></sc-for>
</div>
<div style="padding: 8px 16px 14px"><p style="margin: 0; font-size: 11.5px; color: #4B5A6F; line-height: 1.35">לוחצים על מסלול כדי לסמן שירדתם בו. הירידה של כל מסלול מחושבת ממודל הגובה. הדרכון נשמר במכשיר.</p></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const GROUPS = [{"c": "green", "name": "ירוק", "hex": "#1B8A4C", "keys": ["Snow Park", "Pirveli", "Zuma", "Baby", "Bombora"]}, {"c": "blue", "name": "כחול", "hex": "#1F5FC4", "keys": ["Soliko 1", "Kikilo 1", "Khada", "Goodaura 2", "Sportuli 1", "Kikilo 2", "Tatra 1", "Goodaura 1", "Kobi", "New Goodaura", "Sportuli 2", "Shino", "Firni 1", "Firni 2", "Tatra 2", "Soliko 2"]}, {"c": "red", "name": "אדום", "hex": "#D1342B", "keys": ["Kudebi 3", "Kudebi 1", "Sadzele 3", "Kudebi 2"]}, {"c": "black", "name": "שחור", "hex": "#13233A", "keys": ["Sadzele 2", "Sadzele 1"]}];
const META = {"Soliko 1": {"d": 541}, "Kudebi 3": {"d": 173}, "Kudebi 1": {"d": 325}, "Kikilo 1": {"d": 420}, "Snow Park": {"d": 128}, "Pirveli": {"d": 165}, "Khada": {"d": 117}, "Goodaura 2": {"d": 451}, "Sportuli 1": {"d": 418}, "Sadzele 2": {"d": 299}, "Sadzele 3": {"d": 413}, "Kikilo 2": {"d": 273}, "Tatra 1": {"d": 536}, "Zuma": {"d": 53}, "Goodaura 1": {"d": 547}, "Kobi": {"d": 437}, "New Goodaura": {"d": 53}, "Kudebi 2": {"d": 284}, "Sportuli 2": {"d": 232}, "Sadzele 1": {"d": 460}, "Baby": {"d": 15}, "Bombora": {"d": 25}, "Shino": {"d": 127}, "Firni 1": {"d": 108}, "Firni 2": {"d": 132}, "Tatra 2": {"d": 494}, "Soliko 2": {"d": 85}};
class Component extends DCLogic {
  state = { done: ['Pirveli', 'Zuma', 'Baby', 'Snow Park', 'Goodaura 1', 'Tatra 1', 'Soliko 1', 'Kudebi 1'] };
  renderVals() {
    const done = new Set(this.state.done);
    const toggle = (k) => () => { const s = new Set(this.state.done); s.has(k) ? s.delete(k) : s.add(k); this.setState({ done: [...s] }); };
    const groups = GROUPS.map((g) => ({ hex: g.hex, name: g.name, total: g.keys.length, done: g.keys.filter((k) => done.has(k)).length,
      tiles: g.keys.map((k) => ({ k, done: done.has(k), hex: g.hex, bg: done.has(k) ? g.hex : '#FFFFFF', fg: done.has(k) ? '#FFFFFF' : '#13233A', toggle: toggle(k) })) }));
    const meters = [...done].reduce((a, k) => a + (META[k] ? META[k].d : 0), 0);
    return { groups, count: done.size, meters: meters.toLocaleString('en-US') };
  }
}
</script>
</body>
</html>
