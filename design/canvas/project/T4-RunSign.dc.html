<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>שלט מסלול ודפדוף</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&amp;family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#EEF2F5}
a{color:#1F5FC4}

@media (prefers-reduced-motion: reduce){ .anim, .anim *{ animation: none !important; transition: none !important } }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: #EEF2F5; color: #13233A; font-family: 'IBM Plex Sans Hebrew', 'Segoe UI', system-ui, sans-serif; direction: rtl; display: flex; flex-direction: column"><div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 8px 8px; background: #FFFFFF; border-bottom: 1px solid #CBD5DF; color: #13233A"><span style="font-family: Karantina, 'Arial Narrow', sans-serif; font-weight: 700; font-size: 30px; line-height: 1">מפת מסלולים</span><a href="#" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px; font-size: 15px; font-weight: 600; text-decoration: none; color: #1F5FC4"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>בית</a></div>
<div style="flex-grow: 1; position: relative; overflow: hidden; background: linear-gradient(#EEF2F5, #DCE6EF)">
<svg width="390" height="160" viewBox="0 0 390 160" aria-hidden="true" style="position: absolute; left: 0; bottom: 250px"><path d="M0,160 L0,110 L70,70 L120,95 L190,30 L250,80 L300,55 L390,100 L390,160 Z" fill="#C9D6E3"></path></svg>
<div style="position: absolute; right: 36px; top: 40px; bottom: 250px; width: 10px; background: #13233A"></div>
<div style="position: absolute; right: 36px; top: 70px; left: 20px; display: flex; flex-direction: column; gap: 14px; align-items: flex-end">
<div style="display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px 12px 44px; background: {{ c }}; color: #FFFFFF; clip-path: polygon(0 50%, 28px 0, 100% 0, 100% 100%, 28px 100%); box-shadow: 0 6px 14px rgba(19,35,58,0.25)"><span style="padding: 3px 7px; background: #FFFFFF; color: {{ c }}; font-family: Karantina, 'Arial Narrow', sans-serif; font-weight: 700; font-size: 22px; line-height: 1" dir="ltr">{{ ref }}</span><span style="font-family: Karantina, 'Arial Narrow', sans-serif; font-weight: 700; font-size: 50px; line-height: 0.9" dir="ltr">{{ k }}</span></div>
<span style="margin-left: 30px; padding: 4px 10px; background: #FFFFFF; border: 1.5px solid #13233A; font-size: 13px; font-weight: 700">{{ heb }} · לפי המפה הרשמית</span></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 250px; background: #FFFFFF; border-top: 1px solid #CBD5DF; padding: 14px 20px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><div style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #4B5A6F">אורך</span><span style="font-family: Karantina, 'Arial Narrow', sans-serif; font-weight: 700; font-size: 30px; line-height: 1">{{ len }}</span></div><div style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #4B5A6F">ירידה</span><span style="font-family: Karantina, 'Arial Narrow', sans-serif; font-weight: 700; font-size: 30px; line-height: 1">{{ drop }}</span></div><div style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #4B5A6F">קטע תלול</span><span style="font-family: Karantina, 'Arial Narrow', sans-serif; font-weight: 700; font-size: 30px; line-height: 1">{{ steep }}</span></div></div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<button type="button" onClick="{{ prev }}" aria-label="המסלול הקודם" style="width: 48px; height: 48px; border: 1.5px solid #13233A; background: #FFFFFF; color: #13233A; font: inherit; font-size: 22px">›</button>
<div style="display: flex; gap: 6px"><sc-for list="{{ dots }}" as="d" hint-placeholder-count="4"><span style="width: {{ d.w }}px; height: 8px; background: {{ d.bg }}"></span></sc-for></div>
<button type="button" onClick="{{ next }}" aria-label="המסלול הבא" style="width: 48px; height: 48px; border: 1.5px solid #13233A; background: #FFFFFF; color: #13233A; font: inherit; font-size: 22px">‹</button></div>
<span style="font-size: 12.5px; color: #4B5A6F; text-align: center">מחליקים ימינה ושמאלה למסלול הבא, והמצלמה עפה אליו</span>
<button type="button" style="height: 48px; border: 0; background: #13233A; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg>שיתוף המסלול</button>
<span style="font-size: 12px; color: #4B5A6F; text-align: center" dir="ltr">gudauri-ski-trip.vercel.app/#map/run/{{ slug }}</span>
</div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const RUNS = [{"k": "Tatra 2", "ref": "7A", "c": "#1F5FC4", "heb": "כחול", "len": "2.28 ק״מ", "drop": "494 מ׳", "steep": "37%", "slug": "tatra-2"}, {"k": "Soliko 1", "ref": "2A", "c": "#1F5FC4", "heb": "כחול", "len": "2.83 ק״מ", "drop": "541 מ׳", "steep": "32%", "slug": "soliko-1"}, {"k": "Kudebi 1", "ref": "3E", "c": "#D1342B", "heb": "אדום", "len": "2.52 ק״מ", "drop": "325 מ׳", "steep": "29%", "slug": "kudebi-1"}, {"k": "Goodaura 1", "ref": "", "c": "#1F5FC4", "heb": "כחול", "len": "2.74 ק״מ", "drop": "547 מ׳", "steep": "36%", "slug": "goodaura-1"}];
class Component extends DCLogic {
  state = { i: 0 };
  renderVals() {
    const i = this.state.i, r = RUNS[i], n = RUNS.length;
    return { ...r, dots: RUNS.map((_, j) => ({ w: j === i ? 22 : 8, bg: j === i ? r.c : '#CBD5DF' })),
      next: () => this.setState({ i: (i + 1) % n }), prev: () => this.setState({ i: (i + n - 1) % n }) };
  }
}
</script>
</body>
</html>
