<div class="anim" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: #EEF2F5; color: #13233A; font-family: 'IBM Plex Sans Hebrew', 'Segoe UI', system-ui, sans-serif; direction: rtl; display: flex; flex-direction: column"><div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 8px 8px; background: #FFFFFF; border-bottom: 1px solid #CBD5DF; color: #13233A"><span style="font-family: Karantina, 'Arial Narrow', sans-serif; font-weight: 700; font-size: 30px; line-height: 1">נקודת מפגש</span><a href="#" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px; font-size: 15px; font-weight: 600; text-decoration: none; color: #1F5FC4"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>בית</a></div><div style="position: relative; height: 350px; flex: none; overflow: hidden; background: #DCE8F1"><img src="/_blob/27f863a8b3c3734d1b91b58cf1ba14d5" alt="הכפר והתחנות התחתונות" style="position: absolute; left: -5.0px; top: -825.0px; width: 624.0px; height: 1255.2px; max-width: none; display: block"><div style="position: absolute; inset: 0; background: linear-gradient(rgba(238,242,245,0) 70%, rgba(238,242,245,0.9))"></div><sc-for list="{{ pins }}" as="p" hint-placeholder-count="5"><button type="button" onClick="{{ p.pick }}" aria-label="{{ p.k }}" aria-pressed="{{ p.on }}" style="position: absolute; left: {{ p.bx }}px; top: {{ p.by }}px; width: 44px; height: 56px; border: 0; background: transparent; padding: 0; transform-origin: 22px 54px; transform: scale({{ p.sc }}); transition: transform 0.35s cubic-bezier(.3,1.6,.5,1); z-index: {{ p.z }}"><span class="pulse" style="position: absolute; left: 6px; top: 44px; width: 32px; height: 14px; border-radius: 50%; border: 2px solid #F4B942; opacity: {{ p.ring }}"></span><svg width="44" height="56" viewBox="0 0 44 56" aria-hidden="true" style="position: relative"><path d="M22 54 C22 54 6 34 6 21 A16 16 0 0 1 38 21 C38 34 22 54 22 54 Z" fill="{{ p.fill }}" stroke="#13233A" stroke-width="2.2"></path><circle cx="22" cy="21" r="6.5" fill="#FFFFFF" stroke="#13233A" stroke-width="1.5"></circle></svg></button></sc-for><div style="position: absolute; left: {{ cx }}px; top: {{ cy }}px; width: 190px; transition: left 0.35s cubic-bezier(.3,0,.2,1), top 0.35s cubic-bezier(.3,0,.2,1); filter: drop-shadow(0 6px 14px rgba(19,35,58,0.3)); z-index: 5"><div style="background: #13233A; color: #FFFFFF; padding: 8px 12px 9px; display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px"><b style="font-family: Karantina, 'Arial Narrow', sans-serif; font-weight: 700; font-size: 30px; line-height: 0.9" dir="ltr">{{ place }}</b><span style="font-size: 12px; color: #F4B942; font-weight: 700; white-space: nowrap" dir="ltr">{{ alt }}</span></span><span style="font-size: 12px; color: #A3B3C8">{{ desc }}</span></div><span style="position: absolute; left: {{ tipX }}px; bottom: -8px; width: 16px; height: 16px; background: #13233A; transform: rotate(45deg)"></span></div><span style="position: absolute; bottom: 10px; left: 12px; padding: 4px 10px; background: rgba(255,255,255,0.94); border: 1px solid #CBD5DF; font-size: 12px; font-weight: 600">לחצו על סיכה, או בכל מקום במפה</span></div><div style="flex-grow: 1; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 10px"><span style="display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700; color: #4B5A6F"><span>מתי</span><span>יום ה׳, 14.1</span></span><div role="group" aria-label="שעה" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px" dir="ltr"><sc-for list="{{ times }}" as="t" hint-placeholder-count="6"><button type="button" aria-pressed="{{ t.on }}" onClick="{{ t.pick }}" style="height: 52px; border: 1.5px solid #13233A; background: {{ t.bg }}; color: #13233A; font-family: Karantina, 'Arial Narrow', sans-serif; font-weight: 700; font-size: 24px; line-height: 1; padding: 0; transform: translateY({{ t.lift }}px); box-shadow: {{ t.sh }}; transition: transform 0.25s, background-color 0.25s, box-shadow 0.25s">{{ t.lbl }}</button></sc-for></div><span style="margin-top: 4px; font-size: 12.5px; font-weight: 700; color: #4B5A6F">או בלחיצה אחת, הנקודות של הקבוצה</span><div style="position: relative; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; padding-right: 14px"><span style="position: absolute; right: 0; top: -8px; bottom: -14px; width: 7px; background: #13233A"></span><button type="button" aria-pressed="{{ qam.on }}" onClick="{{ qam.pick }}" style="position: relative; width: 318px; height: 46px; border: 0; padding: 0 16px 0 30px; background: #F4B942; color: #13233A; clip-path: polygon(0 50%, 18px 0, 100% 0, 100% 100%, 18px 100%); display: flex; align-items: center; justify-content: space-between; gap: 10px; font: inherit; transform: translateX({{ qam.dx }}px); transition: transform 0.3s cubic-bezier(.3,1.5,.5,1)"><span style="display: flex; align-items: center; gap: 8px; white-space: nowrap"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 5v3M4.9 9.9l2 2M19.1 9.9l-2 2"></path></svg><b style="font-size: 14px">רכבל הבוקר</b></span><span style="font-family: Karantina, 'Arial Narrow', sans-serif; font-weight: 700; font-size: 24px; line-height: 1; white-space: nowrap" dir="ltr">Goodaura 09:30</span></button><button type="button" aria-pressed="{{ qnoon.on }}" onClick="{{ qnoon.pick }}" style="position: relative; width: 296px; height: 46px; border: 0; padding: 0 16px 0 30px; background: #1F5FC4; color: #FFFFFF; clip-path: polygon(0 50%, 18px 0, 100% 0, 100% 100%, 18px 100%); display: flex; align-items: center; justify-content: space-between; gap: 10px; font: inherit; transform: translateX({{ qnoon.dx }}px); transition: transform 0.3s cubic-bezier(.3,1.5,.5,1)"><span style="display: flex; align-items: center; gap: 8px; white-space: nowrap"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 11h16a8 8 0 0 1-16 0zM8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"></path></svg><b style="font-size: 14px">צהריים</b></span><span style="font-family: Karantina, 'Arial Narrow', sans-serif; font-weight: 700; font-size: 24px; line-height: 1; white-space: nowrap" dir="ltr">Zuma 13:30</span></button><button type="button" aria-pressed="{{ qpm.on }}" onClick="{{ qpm.pick }}" style="position: relative; width: 274px; height: 46px; border: 0; padding: 0 16px 0 30px; background: #13233A; color: #FFFFFF; clip-path: polygon(0 50%, 18px 0, 100% 0, 100% 100%, 18px 100%); display: flex; align-items: center; justify-content: space-between; gap: 10px; font: inherit; transform: translateX({{ qpm.dx }}px); transition: transform 0.3s cubic-bezier(.3,1.5,.5,1)"><span style="display: flex; align-items: center; gap: 8px; white-space: nowrap"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 19l6-9 4 5 3-4 5 8z"></path><path d="M9 10l1.5 2.2"></path></svg><b style="font-size: 14px">סוף יום</b></span><span style="font-family: Karantina, 'Arial Narrow', sans-serif; font-weight: 700; font-size: 24px; line-height: 1; white-space: nowrap" dir="ltr">Soliko 16:30</span></button></div><a href="M2-MeetCard.dc.html" style="margin: auto 0 16px; height: 56px; background: #13233A; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"></path><path d="M15 7v10" stroke-dasharray="2 2"></path></svg>יצירת כרטיס מפגש<span style="font-family: Karantina, 'Arial Narrow', sans-serif; font-weight: 700; font-size: 24px; line-height: 1; color: #F4B942; margin-right: 4px; white-space: nowrap" dir="ltr">{{ place }} {{ time }}</span></a></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const PINS = [{"k": "Goodaura", "x": 271, "y": 152, "alt": "2,161 מ׳", "desc": "התחנה התחתונה של הגונדולה"}, {"k": "Zuma", "x": 227, "y": 175, "alt": "2,137 מ׳", "desc": "התחנה התחתונה"}, {"k": "Soliko", "x": 197, "y": 153, "alt": "2,150 מ׳", "desc": "התחנה התחתונה"}, {"k": "Shino", "x": 117, "y": 98, "alt": "2,173 מ׳", "desc": "התחנה התחתונה"}, {"k": "Pirveli", "x": 155, "y": 353, "alt": "1,995 מ׳", "desc": "התחנה התחתונה"}];
const TIMES = ["09:30", "11:00", "12:30", "13:30", "15:00", "16:30"];
const PRESETS = { am: ['Goodaura', '09:30'], noon: ['Zuma', '13:30'], pm: ['Soliko', '16:30'] };
class Component extends DCLogic {
  state = { place: 'Goodaura', time: '12:30', preset: '' };
  renderVals() {
    const s = this.state, sel = PINS.find((p) => p.k === s.place);
    const pins = PINS.map((p) => { const on = p.k === s.place; return { ...p, on, bx: p.x - 22, by: p.y - 54, sc: on ? 1.25 : 0.9, z: on ? 3 : 1, ring: on ? 1 : 0, fill: on ? '#F4B942' : '#FFFFFF', pick: () => this.setState({ place: p.k, preset: '' }) }; });
    const cxv = Math.max(8, Math.min(390 - 198, sel.x - 95)), cyv = Math.max(6, sel.y - 140);
    const times = TIMES.map((t) => { const on = t === s.time; return { lbl: t, on, bg: on ? '#F4B942' : '#FFFFFF', lift: on ? -3 : 0, sh: on ? '0 4px 0 #13233A' : 'none', pick: () => this.setState({ time: t, preset: '' }) }; });
    const q = (k) => ({ on: s.preset === k, dx: s.preset === k ? -10 : 0, pick: () => this.setState({ place: PRESETS[k][0], time: PRESETS[k][1], preset: k }) });
    return { pins, times, place: s.place, time: s.time, alt: sel.alt, desc: sel.desc, cx: cxv, cy: cyv, tipX: Math.max(10, Math.min(166, sel.x - cxv - 8)),
      qam: q('am'), qnoon: q('noon'), qpm: q('pm') };
  }
}
</script>
