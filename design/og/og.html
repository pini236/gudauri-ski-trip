<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=IBM+Plex+Sans+Hebrew:wght@400;600&display=swap">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;background:#EEF2F5;color:#13233A;font-family:'IBM Plex Sans Hebrew',sans-serif;position:relative;overflow:hidden}
  .sky{position:absolute;inset:0 0 auto 0;height:400px;background:#DCE6EF}
  svg{position:absolute;inset:auto 0 0 0;width:1200px;height:330px}
  .sign{position:absolute;top:120px;right:90px;background:#1F5FC4;color:#fff;padding:26px 60px 26px 70px;clip-path:polygon(0 50%,54px 0,100% 0,100% 100%,54px 100%)}
  .sign b{font:700 150px/1 'Karantina',sans-serif;display:block}
  .post{position:absolute;top:100px;right:60px;width:12px;height:420px;background:#13233A}
  h2{position:absolute;top:340px;right:90px;font-weight:600;font-size:44px}
  p{position:absolute;top:410px;right:90px;font-size:30px;color:#4B5A6F}
  .tag{position:absolute;top:40px;right:90px;font-size:26px;color:#4B5A6F}
</style>
</head>
<body>
<div class="sky"></div>
<svg viewBox="0 0 1200 330" preserveAspectRatio="none"><polygon points="0,330 0,200 120,150 220,170 360,60 470,120 560,90 700,20 820,110 940,80 1060,150 1200,120 1200,330" fill="#C7D5E2"/><polygon points="0,330 0,260 200,220 400,240 600,190 800,230 1000,200 1200,240 1200,330" fill="#EEF2F5" stroke="#B4C3D2" stroke-width="2"/></svg>
<div class="tag">גאורגיה</div>
<div class="post"></div>
<div class="sign"><b>גודאורי 2027</b></div>
<h2>אתר ההיערכות לחופשת סקי</h2>
<p>מפת מסלולים, תלת-ממד ופרטים על כל מסלול</p>
</body>
</html>
