<title>איחוד כדורי שלג</title>
<meta name="description" content="מחליקים, שני כדורים זהים מתאחדים לגדול יותר, עד איש השלג הענק">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=IBM+Plex+Sans+Hebrew:wght@400;600;700&display=swap">
<style>
/* One look: a cold blue evening on the slope, snow tiles on packed snow. */
:root{ --bg:#16263A; --board:#25405E; --cell:#2E4E70; --ink:#0D1522; --paper:#F4F8FB; --accent:#F4B942; --f-display:"Karantina","Arial Narrow",sans-serif; --f-body:"IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme:dark; }
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%,#2C4A6C,var(--bg));color:var(--paper);font-family:var(--f-body);direction:rtl;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 14px);box-sizing:border-box;gap:12px}
header{width:100%;max-width:440px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
h1{margin:0;font-family:var(--f-display);font-size:clamp(30px,9vw,44px);white-space:nowrap;line-height:.9;text-wrap:balance}
.scores{display:flex;gap:6px}
.sc{background:var(--board);padding:4px 10px;min-width:62px;text-align:center;display:flex;flex-direction:column}
.sc small{font-size:11px;color:#A9C1D8}
.sc b{font-family:var(--f-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.goal{width:100%;max-width:440px;display:flex;align-items:center;gap:10px;font-size:13px;color:#C7D7E6}
.goal .bar{flex:1;height:8px;background:var(--board)}
.goal .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
#board{position:relative;width:min(100%,440px,calc(100vh - 260px));aspect-ratio:1;background:var(--board);touch-action:none}
.cell,.tile{position:absolute;width:calc((100% - 50px)/4);height:calc((100% - 50px)/4)}
.cell{background:var(--cell)}
.tile{display:flex;align-items:center;justify-content:center;transition:transform .12s ease-out;z-index:2}
.tile .ball{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#E3ECF4 55%,#B8CADB);box-shadow:inset -3px -4px 0 rgba(90,120,150,.25),0 3px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative}
.tile .lab{position:absolute;bottom:0;left:0;right:0;background:rgba(46,78,112,.85);color:#E3ECF4!important;padding-block:1px;text-align:center;font-size:clamp(9px,2.6vw,12px);font-weight:700;color:#1F3A57;line-height:1.05;padding:0 2px}
.tile.new .ball{animation:pop .18s ease-out}
.tile.merged .ball{animation:bump .2s ease-out}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes bump{50%{transform:scale(1.18)}}
.tile svg{width:100%;height:84%;display:block;margin-bottom:16%}
.row{display:flex;gap:8px;width:100%;max-width:440px}
.row button{flex:1;font:inherit;min-height:48px;border:0;background:var(--board);color:var(--paper);font-weight:700;cursor:pointer}
.row button:disabled{opacity:.4}
.over{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;background:rgba(13,21,34,.82);padding:16px;text-align:center;z-index:5}
.over h2{margin:0;font-family:var(--f-display);font-size:56px;line-height:.9}
.over p{margin:0;max-width:30em;font-size:14px}
.over .sec{background:transparent;color:var(--paper);border:2px solid var(--paper);font-family:var(--f-body);font-size:16px;font-weight:700}
.over button{font:inherit;min-height:56px;min-width:200px;border:0;background:var(--accent);color:var(--ink);font-family:var(--f-display);font-size:30px;cursor:pointer}
.ladder{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:440px}
.ladder span{font-size:11px;padding:3px 6px;background:var(--board);color:#7F98B2}
.ladder span.got{background:#F4F8FB;color:var(--ink)}
.hint{font-size:12px;color:#A9C1D8;text-align:center}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile .ball{animation:none!important}}
</style>
<header><h1>איחוד כדורי שלג</h1><div class="scores"><div class="sc"><small>ניקוד</small><b id="score">0</b></div><div class="sc"><small>שיא</small><b id="best">0</b></div></div></header>
<div class="goal"><span id="goalTxt">הבא: כדור קטן</span><div class="bar"><i id="goalBar"></i></div></div>
<div id="board" aria-label="לוח 4 על 4"></div>
<div class="row"><button id="undo" type="button">ביטול מהלך (<span id="undoN">3</span>)</button><button id="new" type="button">משחק חדש</button></div>
<div class="ladder" id="ladder"></div>
<div class="hint">מחליקים לכל כיוון (או חצים במקלדת). שני כדורים זהים מתאחדים.</div>
<div class="over" id="over" hidden><h2 id="ovT"></h2><p id="ovP"></p><button id="ovB" type="button"></button><button id="ovU" type="button" class="sec" hidden>ביטול המהלך האחרון</button></div>
<script>
// eleven steps, from a flake to the giant snowman (2 → 2048 in the classic game)
const NAMES=['פתית','כדור קטן','כדור','כדור גדול','ראש','בטן','גוף','איש שלג','עם כובע','עם צעיף','איש שלג ענק','מלך קזבק'];
const store={get(k,d){try{const v=localStorage.getItem('mg-'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('mg-'+k,JSON.stringify(v));}catch(e){}}};
const $=id=>document.getElementById(id), B=$('board');
const GAP=10, pos=(r,c)=>`translate(${-(c*(100))}%,${r*100}%)`;
let grid, score, best=store.get('best',0), maxLv, hist=[], undos, nid=1, tiles=new Map(), wonShown;
for(let r=0;r<4;r++)for(let c=0;c<4;c++){ const d=document.createElement('div'); d.className='cell'; place(d,r,c); B.appendChild(d); }
function place(el,r,c){ el.style.top=`calc(${GAP}px + ${r}*((100% - 50px)/4 + ${GAP}px))`; el.style.right=`calc(${GAP}px + ${c}*((100% - 50px)/4 + ${GAP}px))`; el.style.transform=''; }
function ballSVG(lv){ // more snow and more snowman with every level
  if(lv<7){ const s=28+lv*8; return `<div class="ball" style="width:${s}%;height:${s}%;margin-bottom:14%"></div>`; }
  const hat=lv>=8, scarf=lv>=9, big=lv>=10, gold=lv>=11;
  return `<svg viewBox="0 0 100 100" aria-hidden="true">
   ${big?`<circle cx="50" cy="50" r="48" fill="${gold?'#F4B942':'#F4F8FB'}" opacity=".25"/>`:''}
   <circle cx="50" cy="74" r="22" fill="#EDF3F8" stroke="#B8CADB" stroke-width="2"/>
   <circle cx="50" cy="44" r="16" fill="#F4F8FB" stroke="#B8CADB" stroke-width="2"/>
   <circle cx="50" cy="20" r="12" fill="#fff" stroke="#B8CADB" stroke-width="2"/>
   <circle cx="45" cy="18" r="1.8" fill="#0D1522"/><circle cx="55" cy="18" r="1.8" fill="#0D1522"/>
   <path d="M50 21 L62 23 L50 24Z" fill="#F07A2E"/>
   <circle cx="50" cy="40" r="1.8" fill="#0D1522"/><circle cx="50" cy="48" r="1.8" fill="#0D1522"/>
   ${scarf?`<path d="M37 31 Q50 37 63 31 L63 35 Q50 41 37 35Z" fill="#D1342B"/><rect x="56" y="33" width="5" height="13" fill="#D1342B"/>`:''}
   ${hat&&!gold?`<rect x="40" y="2" width="20" height="9" fill="#0D1522"/><rect x="35" y="10" width="30" height="3" fill="#0D1522"/>`:''}
   ${gold?`<path d="M40 6 L44 0 L50 5 L56 0 L60 6Z" fill="#F4B942"/>`:''}
  </svg>`; }
function mk(t){ const el=document.createElement('div'); el.className='tile new'; el.innerHTML=ballSVG(t.lv)+`<span class="lab">${NAMES[t.lv]}</span>`; place(el,t.r,t.c); B.appendChild(el); tiles.set(t.id,el); }
function emptyCells(){ const e=[]; for(let r=0;r<4;r++)for(let c=0;c<4;c++) if(!grid[r][c]) e.push([r,c]); return e; }
function spawn(){ const e=emptyCells(); if(!e.length) return; const [r,c]=e[Math.floor(Math.random()*e.length)]; const t={id:nid++,lv:Math.random()<.9?0:1,r,c}; grid[r][c]=t; mk(t); }
function snapshot(){ return {g:grid.map(row=>row.map(t=>t&&{...t})), score, maxLv}; }
function render(){ // rebuild from the grid (after undo or a fresh start)
  tiles.forEach(el=>el.remove()); tiles.clear(); for(const row of grid) for(const t of row) if(t) mk(t); tiles.forEach(el=>el.classList.remove('new')); hud(); }
function hud(){ $('score').textContent=score; $('best').textContent=best; $('undoN').textContent=undos; $('undo').disabled=!undos||!hist.length;
  const nx=Math.min(NAMES.length-1,maxLv+1); $('goalTxt').textContent= maxLv>=NAMES.length-1 ? 'הגעת לפסגה' : 'הבא: '+NAMES[nx]; $('goalBar').style.width=(maxLv/(NAMES.length-1)*100)+'%';
  const got=store.get('got',0); $('ladder').innerHTML=NAMES.map((n,i)=>`<span class="${i<=Math.max(got,maxLv)?'got':''}">${n}</span>`).join(''); }
function newGame(){ grid=[...Array(4)].map(()=>Array(4).fill(null)); score=0; maxLv=0; hist=[]; undos=3; wonShown=false; tiles.forEach(el=>el.remove()); tiles.clear(); spawn(); spawn(); hud(); $('over').hidden=true; store.set('save',null); }
function move(dir){ // dir: 0 left 1 right 2 up 3 down (left/right as on screen)
  if(!$('over').hidden) return;
  const before=snapshot(); let moved=false, gained=0; const merges=[];
  for(let i=0;i<4;i++){
    const line=[]; for(let j=0;j<4;j++){ const [r,c]=cellOf(dir,i,j); line.push(grid[r][c]); }
    const items=line.filter(Boolean), out=[]; let k=0;
    while(k<items.length){ const a=items[k], b=items[k+1];
      if(b && a.lv===b.lv && a.lv<NAMES.length-1){ out.push({a,b}); k+=2; } else { out.push({a}); k++; } }
    for(let j=0;j<4;j++){ const [r,c]=cellOf(dir,i,j); grid[r][c]=null; }
    out.forEach((o,j)=>{ const [r,c]=cellOf(dir,i,j);
      if(o.b){ moved=true; const t={id:nid++,lv:o.a.lv+1,r,c}; grid[r][c]=t; gained+=2**(t.lv+1); merges.push({t,from:[o.a,o.b]}); }
      else { if(o.a.r!==r||o.a.c!==c) moved=true; o.a.r=r; o.a.c=c; grid[r][c]=o.a; } });
  }
  if(!moved) return;
  hist.push(before); if(hist.length>3) hist.shift();
  // slide existing tiles, then swap merged pairs for the new bigger one
  for(const row of grid) for(const t of row) if(t && tiles.has(t.id)) { const el=tiles.get(t.id); el.classList.remove('new','merged'); place(el,t.r,t.c); }
  merges.forEach(m=>m.from.forEach(f=>{ const el=tiles.get(f.id); if(el){ place(el,m.t.r,m.t.c); el.style.zIndex=1; } }));
  setTimeout(()=>{ merges.forEach(m=>{ m.from.forEach(f=>{ const el=tiles.get(f.id); el&&el.remove(); tiles.delete(f.id); }); mk(m.t); const el=tiles.get(m.t.id); el.classList.remove('new'); el.classList.add('merged'); });
    score+=gained; if(score>best){ best=score; store.set('best',best); }
    const top=Math.max(maxLv,...merges.map(m=>m.t.lv)); if(top>maxLv){ maxLv=top; if(top>store.get('got',0)) store.set('got',top); try{ navigator.vibrate&&navigator.vibrate(top>=7?[20,40,20]:12);}catch(_){} }
    spawn(); hud(); store.set('save',{g:grid,score,maxLv,undos});
    if(maxLv>=7 && !wonShown){ wonShown=true; show('איש שלג!','בנית איש שלג שלם. אפשר להמשיך לבנות: כובע, צעיף, ענק, ועד מלך קזבק.','להמשיך'); }
    else if(!canMove()) show('אין מקום','הגעת עד: '+NAMES[maxLv]+'. ניקוד '+score+'.','עוד פעם');
  },125); }
function cellOf(dir,i,j){ // j=0 is the side the tiles slide toward. Columns run right to left (RTL board).
  if(dir===0) return [i,3-j]; if(dir===1) return [i,j]; if(dir===2) return [j,i]; return [3-j,i]; }
function canMove(){ if(emptyCells().length) return true; for(let r=0;r<4;r++)for(let c=0;c<4;c++){ const v=grid[r][c].lv; if(c<3&&grid[r][c+1].lv===v) return true; if(r<3&&grid[r+1][c].lv===v) return true; } return false; }
function show(t,p,b){ $('ovT').textContent=t; $('ovP').textContent=p; $('ovB').textContent=b; $('ovU').hidden = !(b==='עוד פעם' && undos && hist.length); $('over').hidden=false; $('ovB').onclick=()=>{ if(b==='להמשיך') $('over').hidden=true; else newGame(); }; }
$('new').onclick=newGame;
$('ovU').onclick=()=>{ $('over').hidden=true; $('undo').onclick(); };
$('undo').onclick=()=>{ if(!undos||!hist.length) return; const s=hist.pop(); grid=s.g; score=s.score; maxLv=s.maxLv; undos--; render(); };
addEventListener('keydown',e=>{ const m={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3}[e.key]; if(m!=null){ e.preventDefault(); move(m); } });
let sx=null, sy=null;
B.addEventListener('pointerdown',e=>{ sx=e.clientX; sy=e.clientY; });
addEventListener('pointerup',e=>{ if(sx==null) return; const dx=e.clientX-sx, dy=e.clientY-sy; sx=null; if(Math.max(Math.abs(dx),Math.abs(dy))<24) return; move(Math.abs(dx)>Math.abs(dy) ? (dx<0?0:1) : (dy<0?2:3)); });
// resume a saved game
const sv=store.get('save',null);
if(sv&&sv.g){ grid=sv.g; score=sv.score; maxLv=sv.maxLv; undos=sv.undos??3; wonShown=maxLv>=7; nid=1+Math.max(0,...grid.flat().filter(Boolean).map(t=>t.id)); render(); } else newGame();
</script>
