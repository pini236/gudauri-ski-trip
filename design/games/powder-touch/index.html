<title data-i18n="game.fresh.title">שלג טרי</title>
<meta name="description" data-i18n-attr="content:game.fresh.meta_description" content="נוגעים בשלג טרי, מיישרים אותו בחתול שלג, ומרסקים אגם קפוא">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=IBM+Plex+Sans+Hebrew:wght@400;600;700&display=swap">
<style>
/* One look: fresh snow in low morning sun. The same in both themes. */
:root{ --ink:#13233A; --paper:#FFFFFF; --accent:#F4B942; --f-display:"Karantina","Arial Narrow",sans-serif; --f-body:"IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme:light; }
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:#E8F0F8;color:var(--ink);font-family:var(--f-body);direction:rtl;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#snow,#lake{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:auto}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:8px;pointer-events:none;background:linear-gradient(rgba(19,35,58,0),rgba(19,35,58,.35))}
.row{display:flex;gap:6px;justify-content:center;pointer-events:auto}
.row button{font:inherit;min-height:48px;min-width:56px;padding:0 10px;border:0;background:rgba(255,255,255,.88);color:var(--ink);font-weight:700;font-size:13.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;box-shadow:0 2px 0 rgba(19,35,58,.2)}
.row button .i{font-size:20px;line-height:1.1}
.row button[aria-pressed="true"]{background:var(--ink);color:#fff}
.row.kind button{min-height:40px;font-size:12.5px}
.top{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;justify-content:space-between;align-items:flex-start;padding:0 12px;pointer-events:none}
.title{font-family:var(--f-display);font-size:38px;line-height:.9;color:var(--ink);text-shadow:0 1px 0 #fff;opacity:.85}
.title small{display:block;font-family:var(--f-body);font-size:12px;font-weight:600;opacity:.8}
.stat{background:rgba(255,255,255,.85);padding:5px 10px;font-size:12.5px;font-weight:700;text-align:center;pointer-events:auto}
.stat b{display:block;font-family:var(--f-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.tip{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);background:rgba(19,35,58,.82);color:#fff;padding:10px 16px;font-weight:700;font-size:15px;text-align:center;pointer-events:none;transition:opacity .6s;max-width:80%}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
html[dir=ltr] body{direction:ltr}
</style>
<canvas id="snow" aria-label="שלג טרי, לגעת בו" data-i18n-attr="aria-label:game.fresh.snow_canvas_label"></canvas>
<canvas id="lake" aria-label="אגם קפוא, לרסק אותו" data-i18n-attr="aria-label:game.fresh.lake_canvas_label" hidden></canvas>
<div class="top"><div class="title"><span data-i18n="game.fresh.title">שלג טרי</span><small id="kindTxt" data-i18n="game.fresh.kind_powder_desc">אבקה של בוקר, מינוס 8</small></div><div class="stat" id="statBox"><b id="area">0%</b><span id="statLbl" data-i18n="game.fresh.stat_tracks">עקבות</span></div></div>
<div class="tip" id="tip" data-i18n="game.fresh.tip">נוגעים בשלג. הצליל עולה 🔊</div>
<div class="bar">
  <div class="row kind" id="scenes" role="group" aria-label="איפה">
    <button type="button" data-s="snow" aria-pressed="true" data-i18n="game.fresh.scene_snow">❄️ שלג</button>
    <button type="button" data-s="lake" aria-pressed="false" data-i18n="game.fresh.scene_lake">🧊 אגם קפוא</button>
    <button type="button" id="snd" aria-pressed="true" aria-label="צליל" data-i18n-attr="aria-label:game.fresh.sound">🔊</button>
  </div>
  <div class="row" id="lakeRow" hidden>
    <button type="button" id="refreeze"><span class="i">🧊</span><span data-i18n="game.fresh.refreeze">קפיאה מחדש</span></button>
  </div>
  <div class="row kind" id="kinds" role="group" aria-label="סוג השלג" data-i18n-attr="aria-label:game.fresh.kinds_label">
    <button type="button" data-k="powder" aria-pressed="true" data-i18n="game.fresh.kind_powder">אבקה</button>
    <button type="button" data-k="crust" aria-pressed="false" data-i18n="game.fresh.kind_crust">קרום קפוא</button>
    <button type="button" data-k="wet" aria-pressed="false" data-i18n="game.fresh.kind_wet">שלג רטוב</button>
  </div>
  <div class="row" id="tools" role="group" aria-label="במה נוגעים" data-i18n-attr="aria-label:game.fresh.tools_label">
    <button type="button" data-t="hand" aria-pressed="true"><span class="i">☝️</span><span data-i18n="game.fresh.tool_hand">אצבע</span></button>
    <button type="button" data-t="boot" aria-pressed="false"><span class="i">🥾</span><span data-i18n="game.fresh.tool_boot">מגף</span></button>
    <button type="button" data-t="ski" aria-pressed="false"><span class="i">🎿</span><span data-i18n="game.fresh.tool_ski">מגלשיים</span></button>
    <button type="button" data-t="ball" aria-pressed="false"><span class="i">⚪</span><span data-i18n="game.fresh.tool_ball">כדור</span></button>
    <button type="button" data-t="cat" aria-pressed="false"><span class="i">🚜</span><span data-i18n="game.fresh.tool_cat">חתול שלג</span></button>
    <button type="button" id="fresh"><span class="i">❄️</span><span data-i18n="game.fresh.new_snow">שלג חדש</span></button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const L=window.L||((k,he,v)=>he.replace(/\{(\w+)\}/g,(m,x)=>v&&x in v?v[x]:m));
// the group of scene buttons keeps its Hebrew label in the markup (tools/build-games.py finds the page by it)
(window.I18N?I18N.ready:Promise.resolve()).then(()=>$('scenes').setAttribute('aria-label',L('game.fresh.scenes_label','איפה')));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const KINDS={
  powder:{txt:()=>L('game.fresh.kind_powder_desc','אבקה של בוקר, מינוס 8'), depth:1.0, berm:.35, rough:.12, soft:1.0},
  crust:{txt:()=>L('game.fresh.kind_crust_desc','קרום קפוא אחרי לילה קר'), depth:.75, berm:.15, rough:.5, soft:.25},
  wet:{txt:()=>L('game.fresh.kind_wet_desc','שלג רטוב של צהריים, אפס מעלות'), depth:.6, berm:.55, rough:.03, soft:.5}};
let kind='powder', tool='hand', soundOn=true;
/* ---------- the snow: a height field, a cell every 3 px, lit by a low sun from the top left ---------- */
const CELL=3, cv=$('snow'), cx=cv.getContext('2d');
let GW, GH, h, base, img, off, offx, dirty=true, touched, crack;
function build(){ const W=innerWidth, H=innerHeight; cv.width=W; cv.height=H;
  GW=Math.ceil(W/CELL); GH=Math.ceil(H/CELL); h=new Float32Array(GW*GH); base=new Float32Array(GW*GH); touched=new Uint8Array(GW*GH); crack=new Uint8Array(GW*GH);
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){ const v=2+.12*Math.sin(x*.03+y*.012)+.09*Math.sin(y*.035-x*.01+1.3)+.015*Math.sin(x*.21+y*.17); base[y*GW+x]=v; h[y*GW+x]=v; }
  off=document.createElement('canvas'); off.width=GW; off.height=GH; offx=off.getContext('2d'); img=offx.createImageData(GW,GH); dirty=true; }
addEventListener('resize',build); build();
// sparkles: tiny ice crystals that catch the sun
const sparkle=new Float32Array(1<<16).map(()=>Math.random());
function render(){ const d=img.data, k=KINDS[kind]; let n=0;
  for(let y=0;y<GH;y++){ for(let x=0;x<GW;x++){ const i=y*GW+x;
    const hx=(h[i+(x<GW-1?1:0)]-h[i-(x>0?1:0)]), hy=(h[i+(y<GH-1?GW:0)]-h[i-(y>0?GW:0)]);
    // light from the top left, low: slopes facing it are bright, the far walls of a hole are in blue shadow
    let l=.82 + (hx*.9+hy*1.2)*1.6; l=Math.max(.35,Math.min(1.12,l));
    const depth=Math.max(0,base[i]-h[i]);
    let r=226*l+20, g=236*l+14, b=248*l+8;
    // shadow is blue on snow, and deep holes go a little bluer
    r-=depth*22; g-=depth*12;
    if(kind==='wet'){ r-=6; g-=3; }
    if(crack[i]){ r-=40; g-=30; b-=18; }
    if(l>.95 && sparkle[i&65535]>.985 && !touched[i]){ r=g=b=255; }
    d[n++]=r; d[n++]=g; d[n++]=b; d[n++]=255; } }
  offx.putImageData(img,0,0); cx.imageSmoothingEnabled=true; cx.drawImage(off,0,0,GW*CELL,GH*CELL); }
/* ---------- tools ---------- */
function press(cx0,cy0,rx,ry,ang,depth,profile){ // an oval stamp: push the snow down inside, and a little of it up around the rim
  const k=KINDS[kind], ca=Math.cos(ang), sa=Math.sin(ang), R=Math.max(rx,ry)*1.7; let moved=0;
  const x0=Math.max(1,Math.floor(cx0-R)), x1=Math.min(GW-2,Math.ceil(cx0+R)), y0=Math.max(1,Math.floor(cy0-R)), y1=Math.min(GH-2,Math.ceil(cy0+R));
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){ const dx=x-cx0, dy=y-cy0, u=(dx*ca+dy*sa)/rx, v=(-dx*sa+dy*ca)/ry, r=Math.hypot(u,v), i=y*GW+x;
    if(r<1){ const pr=profile?profile(u,v):Math.cos(r*Math.PI/2)**(k.soft<.5?.4:.8); const jitter=1+(Math.random()-.5)*k.rough; const target=base[i]-depth*k.depth*pr*jitter;
      if(h[i]>target){ moved+=h[i]-target; h[i]=target; touched[i]=1; }
      if(kind==='crust' && r>.82 && r<1 && Math.random()<.35) crack[i]=1; }
    else if(r<1.6){ const add=k.berm*depth*.25*Math.sin((r-1)/.6*Math.PI); if(add>0 && h[i]<base[i]+.6){ h[i]+=add*(.6+Math.random()*.4)*.25; } } }
  // cracks run out from the stamp in the frozen crust
  if(kind==='crust' && moved>.5){ for(let c=0;c<3;c++){ let a=Math.random()*Math.PI*2, x=cx0+Math.cos(a)*rx, y=cy0+Math.sin(a)*ry; for(let s=0;s<14;s++){ a+=(Math.random()-.5)*.8; x+=Math.cos(a); y+=Math.sin(a); const xi=x|0, yi=y|0; if(xi>0&&yi>0&&xi<GW&&yi<GH) crack[yi*GW+xi]=1; } } }
  dirty=true; return moved; }
// boot sole: a heel and a toe, with a tread
function boot(u,v){ const toe=Math.hypot(u*1.05,(v+.38)/.62), heel=Math.hypot(u*1.25,(v-.55)/.45); const inS=Math.min(toe,heel)<1?1:0; const tread=(Math.sin(v*22)>.2?1:.9); return inS?tread:0; }
let last=null, acc=0, stepSide=1, stepCount=0;
function stroke(px,py){ const gx=px/CELL, gy=py/CELL;
  if(!last){ last={x:gx,y:gy}; stamp(gx,gy,0,true); return; }
  const dx=gx-last.x, dy=gy-last.y, dist=Math.hypot(dx,dy); if(dist<.5) return; const ang=Math.atan2(dy,dx);
  if(tool==='boot'){ acc+=dist; if(acc>30){ acc=0; stepSide*=-1; const ox=-Math.sin(ang)*6*stepSide, oy=Math.cos(ang)*6*stepSide; stamp(gx+ox,gy+oy,ang+Math.PI/2,true); } }
  else { const steps=Math.ceil(dist/1.2); for(let s=1;s<=steps;s++) stamp(last.x+dx*s/steps,last.y+dy*s/steps,ang,s===steps); }
  last={x:gx,y:gy}; }
function stamp(gx,gy,ang,sound){ let m=0;
  if(tool==='hand') m=press(gx,gy,6,6,0,1.3);
  else if(tool==='ball') m=press(gx,gy,13,13,0,1.7);
  else if(tool==='boot'){ m=press(gx,gy,8,15,ang,1.5,boot); stepCount++; grains(10,1); }
  else if(tool==='cat'){ m=groom(gx,gy,ang); if(sound) catSound(m); return; }
  else if(tool==='ski'){ for(const s of [-1,1]){ const ox=-Math.sin(ang)*7*s, oy=Math.cos(ang)*7*s; m+=press(gx+ox,gy+oy,2.2,2.2,0,1.0); } }
  if(sound && tool!=='boot') grains(Math.min(4,1+m*.6),.5); }
/* ---------- the snowcat: a wide blade flattens everything, and the tiller leaves corduroy behind ---------- */
let cat=null;
function groom(cx0,cy0,ang){ const half=24, ca=Math.cos(ang), sa=Math.sin(ang), R=half+2; let m=0;
  const x0=Math.max(1,Math.floor(cx0-R)), x1=Math.min(GW-2,Math.ceil(cx0+R)), y0=Math.max(1,Math.floor(cy0-R)), y1=Math.min(GH-2,Math.ceil(cy0+R));
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){ const dx=x-cx0, dy=y-cy0, along=dx*ca+dy*sa, cross=-dx*sa+dy*ca;
    if(Math.abs(along)<2.2 && Math.abs(cross)<half){ const i=y*GW+x; const edge=Math.min(1,(half-Math.abs(cross))/3);
      const target=base[i]-.1+.035*Math.sin(cross*1.25); const nh=h[i]+(target-h[i])*edge; m+=Math.abs(h[i]-nh); h[i]=nh; touched[i]=0; crack[i]=0; } }
  cat={x:cx0,y:cy0,ang,t:1.2}; dirty=true; return m; }
function catSound(m){ const a=ac(); const now=performance.now(); if(!a || now-lastG<60) return; lastG=now; const t=a.currentTime;
  grain(t,.09,.22,'lowpass',160+Math.random()*60,1.2); grain(t+.02,.06,.08+Math.min(.15,m*.01),'bandpass',700+Math.random()*400,.8); }
function drawCat(){ if(!cat||cat.t<=0) return; const X=cat.x*CELL, Y=cat.y*CELL; cx.save(); cx.translate(X,Y); cx.rotate(cat.ang); cx.globalAlpha=Math.min(1,cat.t*2);
  cx.fillStyle='rgba(19,35,58,.18)'; cx.fillRect(-46,-34,78,72);
  cx.fillStyle='#2A3B55'; cx.fillRect(-44,-36,62,14); cx.fillRect(-44,22,62,14); // tracks
  cx.fillStyle='#D1342B'; cx.fillRect(-40,-24,58,48); // body
  cx.fillStyle='#9FC4E6'; cx.fillRect(2,-18,14,36); // cabin glass
  cx.fillStyle='#F4B942'; cx.fillRect(20,-74,8,148); // the blade in front
  cx.fillStyle='#4B5A6F'; cx.fillRect(-62,-72,14,144); // the tiller behind
  cx.restore(); }
/* ---------- sound: grains of filtered noise, different for every kind of snow ---------- */
let AC=null, lastG=0;
function ac(){ if(!soundOn) return null; if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){ return null; } } if(AC.state==='suspended') AC.resume(); return AC; }
function grain(t0,dur,vol,type,freq,q){ const a=AC, n=Math.max(64,Math.floor(a.sampleRate*dur)), b=a.createBuffer(1,n,a.sampleRate), ch=b.getChannelData(0);
  for(let i=0;i<n;i++){ const e=Math.pow(1-i/n,2)*(i<n*.05?i/(n*.05):1); ch[i]=(Math.random()*2-1)*e; }
  const s=a.createBufferSource(); s.buffer=b; const f=a.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q; const g=a.createGain(); g.gain.value=vol; s.connect(f); f.connect(g); g.connect(a.destination); s.start(t0); }
function squeak(t0,vol){ const a=AC, o=a.createOscillator(), g=a.createGain(); o.type='sawtooth'; const f0=700+Math.random()*500; o.frequency.setValueAtTime(f0,t0); o.frequency.exponentialRampToValueAtTime(f0*1.4,t0+.05); const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=f0*1.6; f.Q.value=6; g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.001,t0+.07); o.connect(f); f.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+.08); }
function grains(n,vol){ const a=ac(); const now=performance.now(); if(!a || now-lastG<28) return; lastG=now; const t=a.currentTime;
  n=Math.round(n);
  for(let i=0;i<n;i++){ const t0=t+i*(.012+Math.random()*.018);
    if(kind==='powder'){ grain(t0,.05+Math.random()*.05,.25*vol,'lowpass',900+Math.random()*900,.7); grain(t0,.03,.08*vol,'bandpass',2600+Math.random()*1500,1.2); }
    else if(kind==='crust'){ grain(t0,.012+Math.random()*.015,.55*vol,'highpass',2500+Math.random()*2500,.8); if(Math.random()<.4) grain(t0,.06,.3*vol,'lowpass',260,1); }
    else { grain(t0,.04,.2*vol,'lowpass',600,1); if(Math.random()<.5) squeak(t0,.05*vol); } }
  try{ if(navigator.vibrate && kind!=='powder') navigator.vibrate(kind==='crust'?8:4); }catch(_){} }
/* ---------- input: several fingers at once ---------- */
const fingers=new Map();
cv.addEventListener('pointerdown',e=>{ if(scene!=='snow') return; e.preventDefault(); gameStart(); try{cv.setPointerCapture(e.pointerId);}catch(_){} $('tip').style.opacity=0; last=null; acc=99; fingers.set(e.pointerId,{last:null}); swap(e.pointerId); stroke(e.clientX,e.clientY); unswap(e.pointerId); });
cv.addEventListener('pointermove',e=>{ if(!fingers.has(e.pointerId)) return; swap(e.pointerId); stroke(e.clientX,e.clientY); unswap(e.pointerId); });
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,e=>fingers.delete(e.pointerId)));
function swap(id){ const f=fingers.get(id); last=f.last; acc=f.acc??99; }
function unswap(id){ const f=fingers.get(id); if(f){ f.last=last; f.acc=acc; } }
/* ---------- buttons ---------- */
$('tools').addEventListener('click',e=>{ const b=e.target.closest('[data-t]'); if(!b) return; tool=b.dataset.t; document.querySelectorAll('[data-t]').forEach(x=>x.setAttribute('aria-pressed',x===b)); });
$('kinds').addEventListener('click',e=>{ const b=e.target.closest('[data-k]'); if(!b) return; kind=b.dataset.k; document.querySelectorAll('[data-k]').forEach(x=>x.setAttribute('aria-pressed',x===b)); $('kindTxt').textContent=KINDS[kind].txt(); freshSnow(true); });
$('snd').onclick=()=>{ soundOn=!soundOn; $('snd').setAttribute('aria-pressed',soundOn); $('snd').textContent=soundOn?'🔊':'🔇'; };
// fresh snow falls and slowly fills every track back in
let falling=0, flakes=[];
function freshSnow(now){ falling=now?0:2.4; if(now){ h.set(base); touched.fill(0); crack.fill(0); dirty=true; } else { for(let i=0;i<90;i++) flakes.push({x:Math.random()*innerWidth,y:-Math.random()*innerHeight,v:40+Math.random()*60,r:1+Math.random()*2.5,s:Math.random()*6}); } }
$('fresh').onclick=()=>freshSnow(false);
let lt=performance.now(), areaT=0;
function frame(now){ const dt=Math.min(.05,(now-lt)/1000); lt=now;
  if(falling>0){ falling-=dt; const k=1-Math.pow(.25,dt); for(let i=0;i<h.length;i++){ if(h[i]!==base[i]){ h[i]+= (base[i]-h[i])*k; if(Math.abs(h[i]-base[i])<.01){ h[i]=base[i]; touched[i]=0; crack[i]=0; } } } if(falling<=0){ h.set(base); touched.fill(0); crack.fill(0); } dirty=true; }
  if(scene==='lake'){ lakeFrame(dt); requestAnimationFrame(frame); return; }
  if(cat&&cat.t>0){ cat.t-=dt; dirty=true; }
  if(dirty){ render(); drawCat(); dirty=false; } else if(flakes.length){ render(); }
  if(flakes.length){ cx.fillStyle='#fff'; for(const f of flakes){ f.y+=f.v*dt; f.s+=dt; f.x+=Math.sin(f.s)*.5; cx.globalAlpha=.9; cx.beginPath(); cx.arc(f.x,f.y,f.r,0,7); cx.fill(); } cx.globalAlpha=1; flakes=flakes.filter(f=>f.y<innerHeight+10); }
  areaT+=dt; if(areaT>.4){ areaT=0; let c=0; for(let i=0;i<touched.length;i+=7) c+=touched[i]?1:0; $('area').textContent=Math.round(c*7/touched.length*100)+'%'; }
  requestAnimationFrame(frame); }
/* ---------- the frozen lake: ice in plates, cracks that spread, and plates that give way into the water ---------- */
let scene='snow';
// usage statistics (site/js/telemetry.js; absent in the design preview). No end here, so a game is the play in one scene
// (level: snow or lake) from the first touch until switching scene or leaving; score = the percentage on screen
let g0=0, gScene='', lakePrev=0; try{ lakePrev=+localStorage.getItem('lake-best')||0; }catch(_){}
function gameStart(){ if(g0) return; g0=performance.now(); gScene=scene; window.track&&track('game_start',{game:'fresh',level:scene}); }
function gameEnd(){ if(!g0) return; window.track&&track('game_end',{game:'fresh',level:gScene,score:parseInt($('area').textContent)||0,seconds:Math.round((performance.now()-g0)/1000),completed:true,best:gScene==='lake'&&bestChain>lakePrev}); g0=0; }
addEventListener('pagehide',gameEnd);
const lk=$('lake'), lx=lk.getContext('2d'), ice=document.createElement('canvas'), ix=ice.getContext('2d');
const G2=2; let LW, LH, cid, cells=[], shards=[], ripples=[], chips=[], broken=0, chain=0, chainT=0, bestChain=0, refreezeT=0;
function initLake(){ const W=innerWidth, H=innerHeight; lk.width=W; lk.height=H; ice.width=W; ice.height=H; LW=Math.ceil(W/G2); LH=Math.ceil(H/G2);
  // plates: a Voronoi pattern over the lake
  const n=Math.max(60,Math.round(W*H/2600)), cols=Math.round(Math.sqrt(n*W/H)), rows=Math.ceil(n/cols), seeds=[];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) seeds.push([(c+.2+Math.random()*.6)/cols*LW,(r+.2+Math.random()*.6)/rows*LH]);
  cid=new Int16Array(LW*LH); cells=seeds.map(([x,y])=>({x:x*G2,y:y*G2,px:[],hp:1.4+Math.random()*1.3,broken:false,nb:new Set(),x0:1e9,y0:1e9,x1:0,y1:0}));
  for(let y=0;y<LH;y++) for(let x=0;x<LW;x++){ let b=0,bd=1e18; const r0=Math.floor(y/LH*rows), c0=Math.floor(x/LW*cols);
    for(let r=Math.max(0,r0-2);r<=Math.min(rows-1,r0+2);r++) for(let c=Math.max(0,c0-2);c<=Math.min(cols-1,c0+2);c++){ const k=r*cols+c; if(k>=seeds.length) continue; const dx=seeds[k][0]-x, dy=seeds[k][1]-y, d=dx*dx+dy*dy; if(d<bd){ bd=d; b=k; } }
    cid[y*LW+x]=b; const C=cells[b]; C.px.push(y*LW+x); if(x<C.x0)C.x0=x; if(y<C.y0)C.y0=y; if(x>C.x1)C.x1=x; if(y>C.y1)C.y1=y; }
  for(let y=0;y<LH-1;y++) for(let x=0;x<LW-1;x++){ const a=cid[y*LW+x], r=cid[y*LW+x+1], d=cid[(y+1)*LW+x]; if(a!==r){ cells[a].nb.add(r); cells[r].nb.add(a); } if(a!==d){ cells[a].nb.add(d); cells[d].nb.add(a); } }
  paintIce(); broken=0; shards=[]; ripples=[]; chips=[]; lakeStat(); }
function paintIce(){ const W=ice.width, H=ice.height; ix.globalCompositeOperation='source-over';
  const g=ix.createLinearGradient(0,0,W,H); g.addColorStop(0,'#B9D9EE'); g.addColorStop(.5,'#8DBBD9'); g.addColorStop(1,'#A9CDE6'); ix.fillStyle=g; ix.fillRect(0,0,W,H);
  // dark streaks where the ice froze clear, frost blooms, and trapped air bubbles
  ix.save(); ix.filter='blur(16px)'; ix.lineCap='round'; ix.lineJoin='round';
  for(let i=0;i<14;i++){ ix.strokeStyle=`rgba(40,90,130,${.08+Math.random()*.1})`; ix.lineWidth=20+Math.random()*60; ix.beginPath(); let x=Math.random()*W, y=Math.random()*H; ix.moveTo(x,y); for(let k=0;k<5;k++){ x+=(Math.random()-.5)*W*.5; y+=(Math.random()-.5)*H*.3; ix.lineTo(x,y); } ix.stroke(); }
  ix.restore();
  for(let i=0;i<70;i++){ const x=Math.random()*W, y=Math.random()*H, r=10+Math.random()*50, gg=ix.createRadialGradient(x,y,0,x,y,r); gg.addColorStop(0,'rgba(255,255,255,.35)'); gg.addColorStop(1,'rgba(255,255,255,0)'); ix.fillStyle=gg; ix.fillRect(x-r,y-r,2*r,2*r); }
  for(let i=0;i<260;i++){ const x=Math.random()*W, y=Math.random()*H, r=.8+Math.random()*3; ix.fillStyle='rgba(255,255,255,.55)'; ix.beginPath(); ix.arc(x,y,r,0,7); ix.fill(); ix.strokeStyle='rgba(30,70,100,.25)'; ix.lineWidth=.6; ix.stroke(); }
  // a dusting of snow at the edges of the lake
  const e=ix.createLinearGradient(0,0,0,H); e.addColorStop(0,'rgba(255,255,255,.75)'); e.addColorStop(.12,'rgba(255,255,255,0)'); e.addColorStop(.85,'rgba(255,255,255,0)'); e.addColorStop(1,'rgba(255,255,255,.7)'); ix.fillStyle=e; ix.fillRect(0,0,W,H); }
function lakeStat(){ $('area').textContent=Math.round(broken/cells.length*100)+'%'; }
/* a hit: cracks run out from the point, every plate nearby weakens, and a plate with nothing left gives way */
function crackLine(x,y,a,len,w){ const pts=[[x,y]]; let L=0; while(L<len){ const st=4+Math.random()*9; a+=(Math.random()-.5)*.7; x+=Math.cos(a)*st; y+=Math.sin(a)*st; L+=st; pts.push([x,y]); if(Math.random()<.08&&len-L>20) crackLine(x,y,a+(Math.random()<.5?-1:1)*(.5+Math.random()*.6),(len-L)*.5,w*.7); }
  ix.lineCap='round'; ix.lineJoin='round';
  ix.strokeStyle='rgba(20,55,85,.45)'; ix.lineWidth=w+1.2; ix.beginPath(); pts.forEach((p,i)=>i?ix.lineTo(p[0]+.8,p[1]+.8):ix.moveTo(p[0]+.8,p[1]+.8)); ix.stroke();
  ix.strokeStyle='rgba(255,255,255,.92)'; ix.lineWidth=w; ix.beginPath(); pts.forEach((p,i)=>i?ix.lineTo(p[0],p[1]):ix.moveTo(p[0],p[1])); ix.stroke(); }
function hit(px,py,force){ ix.globalCompositeOperation='source-atop';
  const n=Math.round(4+force*5); for(let i=0;i<n;i++) crackLine(px,py,i/n*Math.PI*2+Math.random()*.5,(30+Math.random()*90)*force,1.1*force+.3);
  for(let r=12;r<40*force;r+=10+Math.random()*8){ const a0=Math.random()*7, a1=a0+.6+Math.random()*1.2; ix.strokeStyle='rgba(255,255,255,.75)'; ix.lineWidth=1; ix.beginPath(); ix.arc(px,py,r,a0,a1); ix.stroke(); }
  const g=ix.createRadialGradient(px,py,0,px,py,14*force); g.addColorStop(0,'rgba(255,255,255,.8)'); g.addColorStop(1,'rgba(255,255,255,0)'); ix.fillStyle=g; ix.fillRect(px-20,py-20,40,40);
  ix.globalCompositeOperation='source-over';
  const R=70*force; let gave=0;
  const home=cid[Math.min(LH-1,Math.floor(py/G2))*LW+Math.min(LW-1,Math.floor(px/G2))];
  cells.forEach((c,k)=>{ if(c.broken) return; const d=Math.hypot(c.x-px,c.y-py); if(d>R&&k!==home) return; const dmg=force*(k===home?1:Math.max(0,1-d/R))*1.05; c.hp-=dmg; if(c.hp<=0){ gave++; setTimeout(()=>breakCell(c,0),d*2.2); } });
  crackSound(force,gave); for(let i=0;i<8*force;i++) chips.push({x:px,y:py,vx:(Math.random()-.5)*160,vy:-60-Math.random()*120,life:.5,r:1+Math.random()*2});
  try{ navigator.vibrate&&navigator.vibrate(gave?[18,30,28]:10); }catch(_){} }
function breakCell(c,depth){ if(c.broken) return; c.broken=true; broken++;
  const bx=c.x0*G2, by=c.y0*G2, bw=(c.x1-c.x0+1)*G2, bh=(c.y1-c.y0+1)*G2;
  const mask=document.createElement('canvas'); mask.width=bw; mask.height=bh; const mx=mask.getContext('2d'); mx.fillStyle='#000';
  for(const i of c.px){ const x=(i%LW)*G2-bx, y=Math.floor(i/LW)*G2-by; mx.fillRect(x,y,G2+.5,G2+.5); }
  const spr=document.createElement('canvas'); spr.width=bw; spr.height=bh; const sx2=spr.getContext('2d'); sx2.drawImage(ice,bx,by,bw,bh,0,0,bw,bh); sx2.globalCompositeOperation='destination-in'; sx2.drawImage(mask,0,0);
  // the white broken edge of the plate
  sx2.globalCompositeOperation='source-atop'; sx2.strokeStyle='rgba(255,255,255,.9)'; sx2.lineWidth=3; sx2.strokeRect(0,0,bw,bh);
  ix.globalCompositeOperation='destination-out'; ix.drawImage(mask,bx,by); ix.globalCompositeOperation='source-over';
  shards.push({spr,x:bx,y:by,w:bw,h:bh,t:0,rot:(Math.random()-.5)*.35,tilt:Math.random()<.5?1:-1});
  ripples.push({x:c.x,y:c.y,r:4,a:.6}); for(let i=0;i<10;i++) chips.push({x:c.x+(Math.random()-.5)*bw*.5,y:c.y+(Math.random()-.5)*bh*.5,vx:(Math.random()-.5)*120,vy:-40-Math.random()*100,life:.6,r:1.5+Math.random()*2.5,water:Math.random()<.5});
  chain = chainT>0 ? chain+1 : 1; chainT=.5; if(chain>bestChain){ bestChain=chain; try{ localStorage.setItem('lake-best',bestChain); }catch(_){} }
  if(chain>=3) bigText(L('game.fresh.chain','שרשרת ×{n}',{n:chain}));
  breakSound(depth); lakeStat();
  // weakened neighbours follow: the satisfying collapse
  for(const k of c.nb){ const nb=cells[k]; if(!nb.broken && nb.hp<.55) setTimeout(()=>breakCell(nb,depth+1),70+Math.random()*90); } }
let bigT=0, bigS='';
function bigText(s){ bigS=s; bigT=1; }
/* the sound of lake ice: sharp crackles, a singing ping that falls, a deep thump, and water when a plate goes */
function crackSound(force,gave){ const a=ac(); if(!a) return; const t=a.currentTime;
  for(let i=0;i<3+force*4;i++) grain(t+i*.008+Math.random()*.01,.008+Math.random()*.01,.5*force,'highpass',3500+Math.random()*3500,.7);
  grain(t,.08,.35*force,'lowpass',110,1.4);
  const o=a.createOscillator(), g=a.createGain(), f=a.createBiquadFilter(); o.type='sine'; o.frequency.setValueAtTime(2400+Math.random()*800,t); o.frequency.exponentialRampToValueAtTime(380,t+.28); f.type='bandpass'; f.frequency.value=1200; f.Q.value=.8; g.gain.setValueAtTime(.12*force,t); g.gain.exponentialRampToValueAtTime(.001,t+.32); o.connect(f); f.connect(g); g.connect(a.destination); o.start(t); o.stop(t+.34); }
function breakSound(depth){ const a=ac(); if(!a) return; const t=a.currentTime+.01;
  for(let i=0;i<10;i++) grain(t+i*.018+Math.random()*.02,.01+Math.random()*.015,.45,'highpass',2500+Math.random()*4000,.6);
  grain(t+.05,.35,.28,'lowpass',500+Math.random()*200,.8);
  const o=a.createOscillator(), g=a.createGain(); o.type='sine'; o.frequency.setValueAtTime(260,t+.1); o.frequency.exponentialRampToValueAtTime(90,t+.3); g.gain.setValueAtTime(.12,t+.1); g.gain.exponentialRampToValueAtTime(.001,t+.34); o.connect(g); g.connect(a.destination); o.start(t+.1); o.stop(t+.36); }
let lakeLast=null;
lk.addEventListener('pointerdown',e=>{ e.preventDefault(); gameStart(); try{lk.setPointerCapture(e.pointerId);}catch(_){} $('tip').style.opacity=0; if(refreezeT>0) return; lakeLast={x:e.clientX,y:e.clientY,acc:0}; hit(e.clientX,e.clientY,1); });
lk.addEventListener('pointermove',e=>{ if(!lakeLast||refreezeT>0) return; const d=Math.hypot(e.clientX-lakeLast.x,e.clientY-lakeLast.y); lakeLast.acc+=d;
  // dragging scratches a hairline crack, and every so often presses harder
  if(d>3){ ix.globalCompositeOperation='source-atop'; ix.strokeStyle='rgba(255,255,255,.8)'; ix.lineWidth=1; ix.beginPath(); ix.moveTo(lakeLast.x,lakeLast.y); ix.lineTo(e.clientX+(Math.random()-.5)*3,e.clientY+(Math.random()-.5)*3); ix.stroke(); ix.globalCompositeOperation='source-over'; const a=ac(); if(a) grain(a.currentTime,.01,.2,'highpass',4000+Math.random()*2000,.7); }
  if(lakeLast.acc>45){ lakeLast.acc=0; hit(e.clientX,e.clientY,.45); }
  lakeLast.x=e.clientX; lakeLast.y=e.clientY; });
['pointerup','pointercancel'].forEach(ev=>lk.addEventListener(ev,()=>lakeLast=null));
function lakeFrame(dt){ const W=lk.width, H=lk.height; chainT=Math.max(0,chainT-dt);
  // dark water under the ice, with slow light ripples
  const g=lx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#16405C'); g.addColorStop(1,'#0A2236'); lx.fillStyle=g; lx.fillRect(0,0,W,H);
  for(const r of ripples){ r.r+=dt*40; r.a-=dt*.35; if(r.a>0){ lx.strokeStyle=`rgba(160,210,240,${r.a})`; lx.lineWidth=1.5; lx.beginPath(); lx.arc(r.x,r.y,r.r,0,7); lx.stroke(); } } ripples=ripples.filter(r=>r.a>0);
  if(refreezeT>0){ refreezeT-=dt; lx.globalAlpha=Math.min(1,1-refreezeT); }
  lx.drawImage(ice,0,0); lx.globalAlpha=1;
  // plates sinking: they tip, darken and slide under
  for(const s of shards){ s.t+=dt; const k=Math.min(1,s.t/1.1); lx.save(); lx.translate(s.x+s.w/2,s.y+s.h/2+k*10); lx.rotate(s.rot*k); lx.scale(1-.15*k,1-.6*k); lx.globalAlpha=1-k*.85; lx.drawImage(s.spr,-s.w/2,-s.h/2); lx.globalCompositeOperation='source-atop'; lx.fillStyle=`rgba(10,34,54,${k*.8})`; lx.fillRect(-s.w/2,-s.h/2,s.w,s.h); lx.restore(); }
  shards=shards.filter(s=>s.t<1.1);
  for(const c of chips){ c.vy+=400*dt; c.x+=c.vx*dt; c.y+=c.vy*dt; c.life-=dt; lx.fillStyle=c.water?'rgba(160,210,240,.9)':'rgba(255,255,255,.95)'; lx.globalAlpha=Math.max(0,c.life*2); lx.beginPath(); lx.arc(c.x,c.y,c.r,0,7); lx.fill(); } lx.globalAlpha=1; chips=chips.filter(c=>c.life>0);
  if(bigT>0){ bigT-=dt; lx.globalAlpha=Math.min(1,bigT*2); lx.font='700 52px Karantina, "Arial Narrow", sans-serif'; lx.textAlign='center'; lx.fillStyle='#fff'; lx.strokeStyle='rgba(10,34,54,.6)'; lx.lineWidth=4; const y=H*.3-(1-bigT)*30; lx.strokeText(bigS,W/2,y); lx.fillText(bigS,W/2,y); lx.globalAlpha=1; } }
/* switching between the snow and the lake */
$('scenes').addEventListener('click',e=>{ const b=e.target.closest('[data-s]'); if(!b) return; if(b.dataset.s!==scene) gameEnd(); scene=b.dataset.s; document.querySelectorAll('[data-s]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  const lake=scene==='lake'; lk.hidden=!lake; cv.hidden=lake; $('kinds').hidden=lake; $('tools').hidden=lake; $('lakeRow').hidden=!lake;
  $('kindTxt').textContent= lake ? L('game.fresh.lake_desc','אגם קפוא ליד הכפר. נוגעים כדי לרסק') : KINDS[kind].txt(); $('statLbl').textContent= lake ? L('game.fresh.stat_broken','שבור') : L('game.fresh.stat_tracks','עקבות');
  if(lake && !cells.length) initLake(); if(lake) lakeStat(); else dirty=true; });
$('refreeze').onclick=()=>{ initLake(); refreezeT=1; const a=ac(); if(a) grain(a.currentTime,.6,.12,'highpass',6000,.5); };
addEventListener('resize',()=>{ if(scene==='lake') initLake(); else cells=[]; });
requestAnimationFrame(frame);
</script>
