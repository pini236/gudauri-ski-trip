<title>בית הספר לסקי</title>
<meta name="description" content="שבעה שיעורים קצרים: עקרונות הגלישה, ותרגול שמרגיש כמו על השלג">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=IBM+Plex+Sans+Hebrew:wght@400;600;700&display=swap">
<style>
/* One look: a bright training slope. The same in both themes. */
:root{ --ink:#13233A; --muted:#4B5A6F; --rule:#CBD5DF; --accent:#F4B942; --red:#D1342B; --blue:#1F5FC4; --green:#1B8A4C;
  --f-display:"Karantina","Arial Narrow",sans-serif; --f-body:"IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme:light; }
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:#F4F8FB;color:var(--ink);font-family:var(--f-body);direction:rtl;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.sign{display:inline-flex;align-items:center;padding:4px 14px 4px 26px;color:#fff;background:var(--ink);font-family:var(--f-display);font-size:24px;line-height:1;clip-path:polygon(0 50%,16px 0,100% 0,100% 100%,16px 100%)}
.box{background:rgba(19,35,58,.86);color:#fff;padding:6px 10px;display:flex;flex-direction:column;align-items:center;min-width:76px}
.box b{font-family:var(--f-display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.box small{font-size:11px;opacity:.85}
.box.over{background:var(--red)}
.task{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 64px);display:flex;justify-content:center;pointer-events:none}
.task span{background:rgba(255,255,255,.92);padding:5px 12px;font-weight:700;font-size:14px;box-shadow:0 2px 0 rgba(19,35,58,.15)}
.meter{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 100px);height:8px;background:rgba(19,35,58,.15);pointer-events:none}
.meter i{display:block;height:100%;width:0;background:var(--green)}
.pop{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:clamp(34px,10vw,54px);line-height:1;color:var(--ink);text-shadow:0 2px 0 #fff,0 0 14px #fff;white-space:nowrap;pointer-events:none;opacity:0}
.pop.go{animation:pop 1.1s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-75%)}}
.wedge{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(42vw,170px);min-height:84px;border:2px solid var(--ink);background:rgba(255,255,255,.85);color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;touch-action:none}
.wedge b{font-family:var(--f-display);font-size:30px;line-height:1}
.wedge small{font-size:11.5px}
.wedge.on{background:var(--accent);border-color:var(--accent)}
.hint{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);max-width:min(48vw,220px);background:rgba(19,35,58,.86);color:#fff;font-size:12.5px;line-height:1.35;padding:7px 10px;pointer-events:none;transition:opacity .5s}
.menu{position:fixed;inset:0;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);background:#F4F8FB;display:flex;flex-direction:column;gap:14px;touch-action:auto}
.menu h1{margin:0;font-family:var(--f-display);font-size:58px;line-height:.9;text-wrap:balance}
.menu h2{margin:0;font-family:var(--f-display);font-size:30px;line-height:1}
.menu p{margin:0;font-size:14px;line-height:1.5;max-width:36em;color:var(--muted)}
.lessons{display:flex;flex-direction:column;gap:8px}
.les{font:inherit;border:0;cursor:pointer;text-align:right;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;background:#fff;color:var(--ink);padding:10px 12px;border-inline-start:10px solid var(--c);min-height:60px;box-shadow:0 2px 0 var(--rule)}
.les .n{grid-row:span 2;font-family:var(--f-display);font-size:36px;line-height:1;color:var(--muted)}
.les b{font-family:var(--f-display);font-size:25px;line-height:1}
.les small{font-size:12.5px;color:var(--muted);grid-column:2 / 4}
.les .st{color:var(--accent);letter-spacing:1px;white-space:nowrap;font-size:18px}
.les:disabled{opacity:.5;cursor:not-allowed}
.card{background:#fff;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 0 var(--rule);border-top:8px solid var(--c,var(--blue))}
.card .k{font-size:12px;font-weight:700;color:var(--muted)}
.card h3{margin:0;font-family:var(--f-display);font-size:40px;line-height:.95}
.card .rule{font-size:16px;line-height:1.5;margin:0;color:var(--ink)}
.card .ctrl{font-size:13.5px;line-height:1.45;background:#EEF2F5;padding:8px 10px}
.card .goals{display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.card .goals span{display:flex;gap:8px;color:var(--muted)}.card .goals span.ok{color:var(--ink);font-weight:700}
.card .goals span::before{content:"☆";color:var(--rule)}.card .goals span.ok::before{content:"★";color:var(--accent)}
.card svg{max-width:100%;height:auto;align-self:center}
.big{font-family:var(--f-display);font-size:56px;line-height:.9}
.go-btn{font:inherit;min-height:60px;border:0;background:var(--accent);color:var(--ink);font-family:var(--f-display);font-size:34px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.go-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two button{font:inherit;min-height:48px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-weight:700;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.pop.go{animation-duration:.01s}}
</style>

<canvas id="game" aria-label="מדרון האימון"></canvas>
<div class="hud" id="hud" hidden><span class="sign" id="hudName"></span><span class="box" id="spdBox"><b id="spd">0</b><small>קמ״ש</small></span></div>
<div class="task" id="task" hidden><span id="taskTxt"></span></div>
<div class="meter" id="meter" hidden><i id="meterBar"></i></div>
<div class="pop" id="pop"></div>
<button class="wedge" id="wedge" type="button" hidden><b>פיצה</b><small>להחזיק כדי להאט</small></button>
<div class="hint" id="hint" hidden>המגלשיים פונים לכיוון האצבע. גוררים ימינה ושמאלה</div>

<section class="menu" id="menu" aria-label="שיעורים">
  <h1>בית הספר לסקי</h1>
  <p>שבעה שיעורים קצרים, מהעצירה הראשונה ועד קרווינג. כל שיעור מלמד עיקרון אחד, ואז מתרגלים אותו על מדרון. המגלשיים פונים לאן שהאצבע.</p>
  <div class="lessons" id="lessons"></div>
  <p style="font-size:12px">משחק, לא תחליף למדריך. העקרונות כאן הם הבסיס שמדריכים מלמדים ביום הראשון.</p>
</section>

<section class="menu" id="brief" aria-label="השיעור" hidden>
  <div class="card" id="briefCard"></div>
  <button class="go-btn" id="go" type="button">לשלג!</button>
  <div class="two"><button type="button" id="back1">לכל השיעורים</button><span></span></div>
</section>

<section class="menu" id="result" aria-label="תוצאה" hidden>
  <div class="card" id="resCard"></div>
  <button class="go-btn" id="next" type="button">השיעור הבא</button>
  <div class="two"><button type="button" id="retry">עוד פעם</button><button type="button" id="back2">לכל השיעורים</button></div>
</section>

<script>
const G=9.81, KMH=3.6;
const store={get(k,d){try{const v=localStorage.getItem('school-'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('school-'+k,JSON.stringify(v));}catch(e){}}};
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const RUNCOL={green:'#1B8A4C',blue:'#1F5FC4',red:'#D1342B',black:'#13233A'};
// diagrams for the brief cards
const D={
 wedge:`<svg width="220" height="120" viewBox="0 0 220 120"><g stroke="#13233A" stroke-width="10" stroke-linecap="square"><line x1="98" y1="14" x2="60" y2="106"/><line x1="122" y1="14" x2="160" y2="106"/></g><path d="M40 112 L180 112" stroke="#CBD5DF" stroke-width="3"/><text x="110" y="10" font-size="11" text-anchor="middle" fill="#4B5A6F">קצוות קרובים</text><text x="110" y="100" font-size="11" text-anchor="middle" fill="#4B5A6F">זנבות רחוקים</text></svg>`,
 outer:`<svg width="220" height="120" viewBox="0 0 220 120"><path d="M30 20 Q120 30 150 110" fill="none" stroke="#CBD5DF" stroke-width="3" stroke-dasharray="6 5"/><g transform="translate(110 64) rotate(-30)"><rect x="-18" y="-36" width="7" height="70" fill="#13233A"/><rect x="11" y="-36" width="7" height="70" fill="#D1342B"/></g><text x="150" y="40" font-size="12" fill="#D1342B" font-weight="700">לוחצים על החיצוני</text></svg>`,
 shape:`<svg width="220" height="130" viewBox="0 0 220 130"><path d="M110 6 C200 26 200 50 110 64 C20 78 20 102 110 124" fill="none" stroke="#1F5FC4" stroke-width="4"/><path d="M110 6 L110 124" stroke="#D1342B" stroke-width="3" stroke-dasharray="5 5"/><text x="118" y="20" font-size="11" fill="#D1342B">ישר למטה: מהר</text><text x="150" y="80" font-size="11" fill="#1F5FC4">לרוחב: מאט</text></svg>`,
 parallel:`<svg width="220" height="120" viewBox="0 0 220 120"><g stroke="#13233A" stroke-width="9"><line x1="90" y1="12" x2="90" y2="108"/><line x1="130" y1="12" x2="130" y2="108"/></g><path d="M84 116 L136 116" stroke="#F4B942" stroke-width="3"/><text x="110" y="10" font-size="11" text-anchor="middle" fill="#4B5A6F">ברוחב הירכיים</text></svg>`,
 look:`<svg width="220" height="120" viewBox="0 0 220 120"><circle cx="40" cy="96" r="10" fill="#F07A2E"/><path d="M48 90 L180 20" stroke="#4B5A6F" stroke-width="2" stroke-dasharray="4 4"/><g fill="#1F5FC4"><rect x="95" y="58" width="4" height="18"/><rect x="140" y="34" width="4" height="18"/><rect x="178" y="12" width="4" height="18"/></g><text x="120" y="110" font-size="11" fill="#4B5A6F">העיניים: שלושה דגלים קדימה</text></svg>`,
 carve:`<svg width="220" height="120" viewBox="0 0 220 120"><path d="M20 20 Q110 60 200 100" fill="none" stroke="#13233A" stroke-width="2"/><path d="M20 30 Q110 70 200 110" fill="none" stroke="#13233A" stroke-width="2"/><path d="M20 60 Q60 66 90 80" fill="none" stroke="#9FB5CB" stroke-width="16" opacity=".6"/><text x="160" y="60" font-size="11" fill="#13233A">קרווינג: שני קווים דקים</text><text x="20" y="100" font-size="11" fill="#4B5A6F">החלקה: מריחה רחבה</text></svg>`,
 final:`<svg width="220" height="110" viewBox="0 0 220 110"><path d="M10 100 L80 30 L120 60 L160 14 L210 100Z" fill="#E9F1F8" stroke="#9FB5CB" stroke-width="2"/><path d="M150 26 C120 50 170 60 130 90" fill="none" stroke="#1F5FC4" stroke-width="3"/></svg>`};
// seven lessons, each one principle. Slope in degrees; gates as [x, y, width]; goals for the second and third star
const L=[
 {name:'עוצרים בפיצה', col:'green', slope:9, len:70, wedge:true, auto:'straight', d:D.wedge, start:5,
  rule:'בפיצה, קצות המגלשיים קרובים והזנבות רחוקים. דוחפים את הזנבות החוצה עם העקבים: ככל שהפיצה רחבה יותר, עוצרים מהר יותר.',
  ctrl:'המגלשיים כבר ישרים. להחזיק את כפתור "פיצה" ולעצור לפני הגדר הכתומה.',
  task:'לעצור לפני הגדר', stop:true, goals:['לעצור לפני הגדר','לעצור במרחק של עד 4 מ׳ מהגדר','לעצור במרחק של עד 1.5 מ׳']},
 {name:'פונים בפיצה', col:'green', slope:10, len:150, wedge:true, d:D.outer,
  gates:[[-6,30,8],[6,60,8],[-6,90,8],[6,120,8]],
  rule:'כדי לפנות שמאלה, לוחצים על המגלש הימני, החיצוני. הגוף פונה במורד, והמגלשיים מצביעים לאן שהולכים.',
  ctrl:'גוררים אצבע ימינה ושמאלה, והמגלשיים פונים אליה. להחזיק "פיצה" כשמהר מדי.',
  task:'לעבור בין כל הדגלים', goals:['לסיים','לעבור בכל ארבעת השערים','בלי לעבור 18 קמ״ש']},
 {name:'הסיבוב הוא הבלם', col:'blue', slope:15, len:260, wedge:false, d:D.shape, limit:25,
  rule:'את המהירות לא שולטים בבלימה, אלא בצורת הסיבוב. ישר במורד מאיץ. כל סיבוב שמסתיים לרוחב המדרון מאט אותך.',
  ctrl:'בלי פיצה הפעם. להישאר מתחת ל-25 קמ״ש רק בעזרת סיבובים.',
  task:'מתחת ל-25 קמ״ש, בלי פיצה', goals:['לסיים','מתחת למהירות ב-80% מהזמן','מתחת למהירות ב-95% מהזמן']},
 {name:'מקבילי, בקצב', col:'blue', slope:15, len:220, wedge:false, d:D.parallel,
  gates:[[-4,24,5],[4,44,5],[-4,64,5],[4,84,5],[-4,104,5],[4,124,5],[-4,144,5],[4,164,5],[-4,184,5],[4,204,5]],
  rule:'מגלשיים מקבילים, ברוחב הירכיים. מתחילים כל סיבוב מוקדם, לפני הדגל ולא לידו, והסיבוב הבא מתחיל כשהקודם נגמר.',
  ctrl:'עשרה שערים צפופים. מסובבים מוקדם, בקצב.',
  task:'לעבור בכל השערים', goals:['לסיים','לפחות 8 שערים','כל 10 השערים']},
 {name:'מבט קדימה', col:'red', slope:17, len:260, wedge:false, d:D.look, traffic:true,
  gates:[[0,40,7],[-6,90,7],[5,140,7],[-3,190,7],[4,235,7]],
  rule:'מסתכלים שלושה סיבובים קדימה, לא על קצות המגלשיים. מי שגולש לפניך תמיד קודם לך, ועוקפים אותו במרחק.',
  ctrl:'גולשים אחרים במסלול. לעבור בשערים בלי להתנגש.',
  task:'שערים, ובלי להתנגש באף אחד', goals:['לסיים','בלי אף התנגשות','בלי התנגשות, וכל השערים']},
 {name:'קרווינג', col:'red', slope:17, len:260, wedge:false, d:D.carve, carve:true, limit:45,
  gates:[[-7,40,6],[7,85,6],[-7,130,6],[7,175,6],[-7,220,6]],
  rule:'במקום לסובב את המגלשיים בכוח, מטים אותם על הקנט ונותנים לצורה שלהם לסובב אותך. סיבוב רחב ונקי משאיר שני קווים דקים. סיבוב חד מדי מחליק ומורח את השלג.',
  ctrl:'שערים רחוקים זה מזה. סיבובים ארוכים ועגולים, לא חדים, ובלי לטוס ישר: עד 45 קמ״ש. העקבות בשלג מראים אם זה נקי.',
  task:'סיבובים נקיים, עד 45 קמ״ש', goals:['לסיים','70% מהסיבוב נקי','85% נקי, ומתחת ל-45 ב-90% מהזמן']},
 {name:'מבחן סיום: Tatra 2', col:'blue', slope:16, len:340, wedge:true, d:D.final, limit:40, traffic:true, carve:true,
  gates:[[-5,40,7],[5,85,7],[-6,130,7],[4,175,7],[-5,220,7],[5,265,7],[0,310,8]],
  rule:'הכל ביחד: מבט קדימה, צורת סיבוב ששולטת במהירות, ופיצה רק כשבאמת צריך.',
  ctrl:'שערים, גולשים אחרים, ומהירות עד 40 קמ״ש.',
  task:'הכל ביחד', goals:['לסיים','כל השערים, בלי התנגשות','וגם 80% נקי, מתחת ל-40']}];

/* ---------- menus ---------- */
const stars=i=>store.get('stars-'+i,0);
function drawMenu(){ $('lessons').innerHTML=L.map((l,i)=>{ const open=i===0||stars(i-1)>0, st=stars(i);
  return `<button class="les" type="button" style="--c:${RUNCOL[l.col]}" data-i="${i}" ${open?'':'disabled'}><span class="n">${i+1}</span><b>${l.name}</b><span class="st">${open?'★'.repeat(st)+'☆'.repeat(3-st):'🔒'}</span><small>${l.task}</small></button>`; }).join(''); }
let cur=0;
$('lessons').onclick=e=>{ const b=e.target.closest('[data-i]'); if(!b||b.disabled) return; brief(+b.dataset.i); };
function brief(i){ cur=i; const l=L[i]; $('menu').hidden=true; $('result').hidden=true; $('brief').hidden=false;
  $('briefCard').style.setProperty('--c',RUNCOL[l.col]);
  $('briefCard').innerHTML=`<span class="k">שיעור ${i+1} מתוך ${L.length}</span><h3>${l.name}</h3>${l.d}<p class="rule">${l.rule}</p><div class="ctrl">${l.ctrl}</div><div class="goals">${l.goals.map(g=>`<span>${g}</span>`).join('')}</div>`; }
$('go').onclick=()=>start(); $('retry').onclick=()=>brief(cur);
$('next').onclick=()=>{ if(cur<L.length-1) brief(cur+1); else toMenu(); };
$('back1').onclick=toMenu; $('back2').onclick=toMenu;
function toMenu(){ ['brief','result'].forEach(id=>$(id).hidden=true); $('menu').hidden=false; drawMenu(); state='menu'; ['hud','task','meter','wedge','hint'].forEach(id=>$(id).hidden=true); }

/* ---------- sound: the hiss of skis, louder and rougher when skidding ---------- */
let AC=null, hiss=null, hissG=null, hissF=null;
function audio(){ if(AC) return; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); const n=AC.sampleRate*2, b=AC.createBuffer(1,n,AC.sampleRate), a=b.getChannelData(0); for(let i=0;i<n;i++) a[i]=Math.random()*2-1;
  hiss=AC.createBufferSource(); hiss.buffer=b; hiss.loop=true; hissF=AC.createBiquadFilter(); hissF.type='bandpass'; hissF.frequency.value=1800; hissF.Q.value=.7; hissG=AC.createGain(); hissG.gain.value=0; hiss.connect(hissF); hissF.connect(hissG); hissG.connect(AC.destination); hiss.start(); }catch(e){ AC=null; } }
function ding(f=660){ if(!AC) return; const o=AC.createOscillator(), g=AC.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(.18,AC.currentTime); g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.3); o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+.32); }
function buzz(ms){ try{ navigator.vibrate&&navigator.vibrate(ms); }catch(_){} }

/* ---------- the slope, seen from above: y runs down the fall line ---------- */
const cv=$('game'), cx=cv.getContext('2d'); let W=0,H=0,PX=14;
function resize(){ const d=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*d; cv.height=H*d; cx.setTransform(d,0,0,d,0,0); PX=Math.max(16,Math.min(28,W/19)); }
addEventListener('resize',resize); resize();
let state='menu', lv, S, tracks, gates, people, fence, finger=null, wedgeOn=false, t=0, stat, camY=0, endT=0, last=performance.now();
function start(){ lv=L[cur]; audio(); if(AC&&AC.state==='suspended') AC.resume();
  S={x:0,y:-2,h:0,v:lv.start||3.5,wedge:0,skid:0,fall:0,crashT:0};
  gates=(lv.gates||[]).map(g=>({x:g[0],y:g[1],w:g[2],done:null}));
  fence=lv.stop?lv.len:null;
  people=[]; if(lv.traffic){ for(let k=0;k<7;k++) people.push({x:(k%2?1:-1)*(2+((k*37)%6)),y:30+k*(lv.len-40)/7,v:2.5+(k%3),ph:k*1.3,amp:3+(k%3),c:['#1B8A4C','#7B4FC4','#F4B942','#1F5FC4'][k%4],hit:false}); }
  tracks=[]; t=0; camY=S.y; endT=0; wedgeOn=false; finger=null;
  stat={time:0,under:0,maxV:0,gates:0,crashes:0,clean:0,turnT:0};
  ['menu','brief','result'].forEach(id=>$(id).hidden=true); ['hud','task'].forEach(id=>$(id).hidden=false);
  $('meter').hidden=!(lv.limit||lv.carve); $('wedge').hidden=!lv.wedge; $('wedge').classList.remove('on');
  $('hint').hidden=!!lv.auto; $('hint').style.opacity=1; $('hudName').textContent=(cur+1)+'. '+lv.name; $('taskTxt').textContent=lv.task;
  state='run'; }
function popText(s){ const p=$('pop'); p.textContent=s; p.classList.remove('go'); void p.offsetWidth; p.classList.add('go'); }
// the screen position of the skier: a third of the way down, looking downhill
const sx=x=>W/2+(x-S.x*.6)*PX, sy=y=>H*.34+(y-camY)*PX;
cv.addEventListener('pointerdown',e=>{ if(state!=='run') return; e.preventDefault(); finger={x:e.clientX,y:e.clientY}; try{cv.setPointerCapture(e.pointerId);}catch(_){} });
cv.addEventListener('pointermove',e=>{ if(finger){ finger.x=e.clientX; finger.y=e.clientY; } });
cv.addEventListener('pointerup',()=>{ finger=null; }); cv.addEventListener('pointercancel',()=>{ finger=null; });
const wb=$('wedge');
wb.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); wedgeOn=true; wb.classList.add('on'); try{wb.setPointerCapture(e.pointerId);}catch(_){} });
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>wb.addEventListener(ev,()=>{ wedgeOn=false; wb.classList.remove('on'); }));
const keys={}; addEventListener('keydown',e=>{ keys[e.code]=true; if(e.code.startsWith('Arrow')||e.code==='Space') e.preventDefault(); }); addEventListener('keyup',e=>{ keys[e.code]=false; });

function frame(now){ const dt=Math.min(.033,(now-last)/1000); last=now; if(state==='run'||state==='done') update(dt); draw(); requestAnimationFrame(frame); }
function update(dt){
  t+=dt; if(t>5) $('hint').style.opacity=0;
  const a=lv.slope*Math.PI/180;
  // where the skis want to point: toward the finger (only the downhill half), or the arrow keys
  let want=S.h;
  if(finger && state==='run'){ const dx=finger.x-sx(S.x), dy=Math.max(-PX*1.5, finger.y-sy(S.y)); want=Math.atan2(dx,dy); }
  if(keys.ArrowLeft) want=S.h-1.5; if(keys.ArrowRight) want=S.h+1.5;
  if(lv.auto) want=0;
  want=Math.max(-1.9,Math.min(1.9,want)); // a little past across the slope: turning uphill is how a carved turn ends and slows you
  const wedge = lv.wedge && (wedgeOn||keys.ArrowDown||keys.Space) && state==='run';

  let acc = G*Math.sin(a)*Math.cos(S.h) - .05*G*Math.cos(a) - .0035*S.v*S.v - S.wedge*(2.6+S.v*.35) - S.skid*S.v*.9 - Math.abs(rate)*S.v*.06;
  if(S.crashT>0){ S.crashT-=dt; acc=-6; }
  S.v=Math.max(0,S.v+acc*dt);
  if(state==='done'){ S.v=Math.max(0,S.v-6*dt); }
  S.x+=Math.sin(S.h)*S.v*dt; S.y+=Math.cos(S.h)*S.v*dt; S.x=Math.max(-14,Math.min(14,S.x));
  camY+=(S.y-camY)*Math.min(1,dt*6);

  const lt=tracks[tracks.length-1]; if(S.v>.3 && (!lt||Math.hypot(lt.x-S.x,lt.y-S.y)>.25)) tracks.push({x:S.x,y:S.y,h:S.h,sk:S.skid,wd:S.wedge}); if(tracks.length>2500) tracks.splice(0,500);
  if(state!=='run') return;
  stat.time+=dt; stat.maxV=Math.max(stat.maxV,S.v*KMH);
  if(lv.limit){ if(S.v*KMH<=lv.limit) stat.under+=dt; $('spdBox').classList.toggle('over',S.v*KMH>lv.limit); }
  if(Math.abs(rate)>.25 && S.v>3){ stat.turnT+=dt; if(S.skid<.25) stat.clean+=dt; }
  /* the bar under the task: clean turns in the carving lessons, time under the limit otherwise */
  if(lv.carve) $('meterBar').style.width=(stat.turnT?stat.clean/stat.turnT*100:0)+'%'; else if(lv.limit) $('meterBar').style.width=(stat.under/Math.max(.1,stat.time)*100)+'%';
  $('spd').textContent=Math.round(S.v*KMH);
  if(AC&&hissG){ hissG.gain.value=Math.min(.22,S.v*.012+S.skid*.12+S.wedge*.05); hissF.frequency.value=900+S.v*80+S.skid*1500; }
  // gates
  for(const g of gates){ if(g.done==null && S.y>=g.y){ g.done=Math.abs(S.x-g.x)<=g.w/2; if(g.done){ stat.gates++; ding(660+stat.gates*30); popText('שער!'); } else { popText('פספסת שער'); buzz(20); } } }
  // other skiers wander across the slope
  for(const p of people){ p.ph+=dt*.6; p.x+=Math.cos(p.ph)*p.amp*dt*.8; p.y+=p.v*dt;
    if(!p.hit && Math.hypot(p.x-S.x,p.y-S.y)<1.3 && S.crashT<=0){ p.hit=true; stat.crashes++; S.crashT=.8; S.v*=.3; popText('התנגשות!'); buzz([30,40,30]); } }
  // the finish: a fence to stop at, or the end of the run
  if(fence!=null){ if(S.y>=fence-.4){ S.y=fence-.4; S.v=0; finishLesson(false); } else if(S.v<.05 && t>1){ finishLesson(true); } }
  else if(S.y>=lv.len) finishLesson(true);
}
function finishLesson(ok){ if(state!=='run') return; state='done'; if(hissG) hissG.gain.value=0;
  let g=[ok,false,false], line='';
  if(lv.stop){ const d=fence-S.y; g=[ok, ok&&d<=4, ok&&d<=1.5]; line = ok? `עצרת ${d.toFixed(1)} מ׳ מהגדר` : 'נכנסת בגדר'; }
  else if(cur===1){ g=[true, stat.gates===4, stat.maxV<=18]; line=`${stat.gates} מתוך 4 שערים · שיא ${Math.round(stat.maxV)} קמ״ש`; }
  else if(cur===2){ const p=stat.under/stat.time; g=[true,p>=.8,p>=.95]; line=`${Math.round(p*100)}% מהזמן מתחת ל-25 קמ״ש`; }
  else if(cur===3){ g=[true,stat.gates>=8,stat.gates===10]; line=`${stat.gates} מתוך 10 שערים`; }
  else if(cur===4){ g=[true,stat.crashes===0,stat.crashes===0&&stat.gates===gates.length]; line=`${stat.gates} מתוך ${gates.length} שערים · ${stat.crashes} התנגשויות`; }
  else if(cur===5){ const p=stat.turnT?stat.clean/stat.turnT:0, u=stat.under/stat.time; g=[true,p>=.7,p>=.85&&u>=.9]; line=`${Math.round(p*100)}% מהסיבוב נקי · ${Math.round(u*100)}% מתחת ל-45`; }
  else { const p=stat.turnT?stat.clean/stat.turnT:0, u=stat.under/stat.time; const two=stat.gates===gates.length&&stat.crashes===0; g=[true,two,two&&p>=.8&&u>=.9]; line=`${stat.gates}/${gates.length} שערים · ${stat.crashes} התנגשויות · ${Math.round(p*100)}% נקי`; }
  const n=g.filter(Boolean).length; if(n>stars(cur)) store.set('stars-'+cur,n);
  setTimeout(()=>showResult(g,n,line), ok?900:1200); }
const TIPS=['פיצה רחבה = עצירה מהירה. פיצה צרה = האטה עדינה.','הגוף פונה במורד, הלחץ על המגלש החיצוני.','סיבוב שנגמר לרוחב המדרון הוא הבלם הכי טוב שיש.','מתחילים כל סיבוב לפני הדגל, לא לידו.','מסתכלים רחוק. מי שלמטה ממך תמיד קודם.','לתת לקנט לעבוד: סיבובים רחבים ועגולים.','כל העקרונות יחד. בהצלחה בגודאורי!'];
function showResult(g,n,line){ ['hud','task','meter','wedge','hint'].forEach(id=>$(id).hidden=true); $('result').hidden=false;
  $('resCard').style.setProperty('--c',RUNCOL[lv.col]);
  $('resCard').innerHTML=`<span class="k">שיעור ${cur+1} · ${lv.name}</span><div class="big" style="color:var(--accent);letter-spacing:4px">${'★'.repeat(n)}<span style="color:var(--rule)">${'★'.repeat(3-n)}</span></div><p class="rule">${line}</p><div class="goals">${lv.goals.map((t,i)=>`<span class="${g[i]?'ok':''}">${t}</span>`).join('')}</div><div class="ctrl">לזכור: ${TIPS[cur]}</div>`;
  $('next').textContent = cur<L.length-1 ? 'השיעור הבא' : 'לכל השיעורים'; $('next').disabled=false; }

/* ---------- drawing ---------- */
function draw(){
  cx.fillStyle='#FBFDFF'; cx.fillRect(0,0,W,H);
  if(state==='menu'||!lv) return;
  // the edges of the piste and a few bumps in the snow
  const edge=15; cx.fillStyle='#EAF1F7'; cx.fillRect(0,0,sx(-edge),H); cx.fillRect(sx(edge),0,W,H);
  cx.fillStyle='rgba(159,181,203,.16)'; const y0=Math.floor((camY-30)/6)*6; for(let y=y0;y<camY+60;y+=6){ for(let k=0;k<4;k++){ const x=((y*7.3+k*11)%28)-14; cx.beginPath(); cx.ellipse(sx(x),sy(y+((k*2.1)%6)),PX*1.2,PX*.25,0,0,7); cx.fill(); } }
  // trees outside the piste
  for(let y=Math.floor((camY-30)/9)*9; y<camY+60; y+=9){ for(const side of [-1,1]){ const x=side*(edge+2+((y*3.7)%5)); tree(sx(x),sy(y)); } }
  // the fall line: a faint arrow now and then, so "downhill" is always clear
  cx.strokeStyle='rgba(31,95,196,.12)'; cx.lineWidth=2; for(let y=Math.floor(camY/20)*20; y<camY+60; y+=20){ const X=sx(-11), Y=sy(y); cx.beginPath(); cx.moveTo(X,Y); cx.lineTo(X,Y+PX*3); cx.moveTo(X-5,Y+PX*3-6); cx.lineTo(X,Y+PX*3); cx.lineTo(X+5,Y+PX*3-6); cx.stroke(); }
  // tracks
  for(const side of [-1,1]){ for(let i=1;i<tracks.length;i++){ const p=tracks[i-1], q=tracks[i]; if(sy(q.y)<-20||sy(p.y)>H+20) continue;
    const spread=.17+q.wd*.25, ox=Math.cos(q.h)*spread*side, oy=-Math.sin(q.h)*spread*side;
    cx.strokeStyle=q.sk>.25?'rgba(159,181,203,.45)':'rgba(70,95,125,.55)'; cx.lineWidth=q.sk>.25?PX*(.15+q.sk*.5):1.6;
    cx.beginPath(); cx.moveTo(sx(p.x+Math.cos(p.h)*(.17+p.wd*.25)*side),sy(p.y-Math.sin(p.h)*(.17+p.wd*.25)*side)); cx.lineTo(sx(q.x+ox),sy(q.y+oy)); cx.stroke(); } }
  // gates and the finish
  for(const g of gates){ const col=g.x<0?'#D1342B':'#1F5FC4'; for(const k of [-1,1]){ const X=sx(g.x+k*g.w/2), Y=sy(g.y); cx.fillStyle='rgba(19,35,58,.15)'; cx.beginPath(); cx.ellipse(X+3,Y+2,5,2.5,0,0,7); cx.fill(); cx.fillStyle=g.done===false?'#9FB5CB':col; cx.fillRect(X-3,Y-PX*1.4,6,PX*1.4); cx.fillRect(X-(k<0?0:PX*.8),Y-PX*1.4,PX*.8,PX*.5); } if(g.done) { cx.fillStyle='#1B8A4C'; cx.font='700 14px "IBM Plex Sans Hebrew",sans-serif'; cx.textAlign='center'; cx.fillText('✓',sx(g.x),sy(g.y)-PX*1.5); } }
  if(fence!=null){ const Y=sy(fence); cx.fillStyle='#F08A3C'; cx.fillRect(sx(-edge),Y,sx(edge)-sx(-edge),6); cx.strokeStyle='#F08A3C'; cx.lineWidth=1; for(let x=-edge;x<edge;x+=1){ cx.beginPath(); cx.moveTo(sx(x),Y); cx.lineTo(sx(x+.5),Y-PX*.8); cx.stroke(); } cx.fillStyle='rgba(240,138,60,.12)'; cx.fillRect(sx(-edge),sy(fence-4),sx(edge)-sx(-edge),PX*4); cx.fillStyle='rgba(27,138,76,.12)'; cx.fillRect(sx(-edge),sy(fence-1.5),sx(edge)-sx(-edge),PX*1.5); }
  else { const Y=sy(lv.len); cx.fillStyle='#13233A'; for(let x=-edge;x<edge;x+=1) { cx.fillStyle=((x+edge)%2)?'#13233A':'#fff'; cx.fillRect(sx(x),Y,PX,PX*.6); } }
  for(const p of people) person(sx(p.x),sy(p.y),p.c,Math.cos(p.ph)*.6,p.hit);
  // where the finger points the skis
  if(finger&&state==='run'){ cx.strokeStyle='rgba(19,35,58,.18)'; cx.setLineDash([4,6]); cx.lineWidth=2; cx.beginPath(); cx.moveTo(sx(S.x),sy(S.y)); cx.lineTo(finger.x,finger.y); cx.stroke(); cx.setLineDash([]); cx.fillStyle='rgba(244,185,66,.5)'; cx.beginPath(); cx.arc(finger.x,finger.y,14,0,7); cx.fill(); }
  skier();
}
function tree(X,Y){ if(Y<-40||Y>H+40) return; cx.fillStyle='rgba(19,35,58,.12)'; cx.beginPath(); cx.ellipse(X+6,Y+4,PX*1.1,PX*.5,0,0,7); cx.fill(); cx.fillStyle='#2F6B4F'; cx.beginPath(); cx.arc(X,Y,PX*1.1,0,7); cx.fill(); cx.fillStyle='#fff'; cx.beginPath(); cx.arc(X-PX*.3,Y-PX*.3,PX*.45,0,7); cx.fill(); }
function person(X,Y,c,h,hit){ cx.save(); cx.translate(X,Y); cx.rotate(-h); cx.fillStyle='#13233A'; cx.fillRect(-PX*.28,-PX*.8,PX*.12,PX*1.6); cx.fillRect(PX*.16,-PX*.8,PX*.12,PX*1.6); cx.fillStyle=hit?'#9FB5CB':c; cx.beginPath(); cx.arc(0,0,PX*.38,0,7); cx.fill(); cx.fillStyle='#F2D2BE'; cx.beginPath(); cx.arc(0,PX*.1,PX*.18,0,7); cx.fill(); cx.restore(); }
function skier(){ const X=sx(S.x), Y=sy(S.y); cx.save(); cx.translate(X,Y); cx.rotate(-S.h);
  const w=S.wedge, len=PX*1.7, sp=PX*(.2+w*.08), ang=w*.32;
  cx.fillStyle='rgba(19,35,58,.15)'; cx.beginPath(); cx.ellipse(4,4,PX*.6,PX*1,0,0,7); cx.fill();
  // in a wedge the tips come together and the tails go out
  for(const k of [-1,1]){ cx.save(); cx.translate(k*sp,0); cx.rotate(k*ang); cx.fillStyle='#13233A'; cx.fillRect(-PX*.09,-len*.5,PX*.18,len); cx.fillStyle='#F4B942'; cx.fillRect(-PX*.09,len*.5-PX*.3,PX*.18,PX*.12); cx.restore(); }
  // skidding throws a little snow out to the side
  if(S.skid>.3&&!reduce){ cx.fillStyle='rgba(255,255,255,.95)'; for(let i=0;i<4;i++){ cx.beginPath(); cx.arc((Math.random()-.5)*PX*2,(Math.random()-.2)*PX,PX*.12,0,7); cx.fill(); } }
  cx.fillStyle='#F07A2E'; cx.beginPath(); cx.ellipse(0,PX*.05,PX*.5,PX*.36,0,0,7); cx.fill();
  cx.fillStyle='#13233A'; cx.beginPath(); cx.arc(0,PX*.12,PX*.22,0,7); cx.fill();
  cx.restore(); }
drawMenu(); requestAnimationFrame(frame);
</script>
