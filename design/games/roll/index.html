<title>כדור השלג</title>
<meta name="description" content="כדור שלג קטן מתגלגל במורד ההר, גדל ובולע כל מה שקטן ממנו">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=IBM+Plex+Sans+Hebrew:wght@400;600;700&display=swap">
<style>
/* One look: a sunny slope from above. The same in both themes. */
:root{ --ink:#13233A; --accent:#F4B942; --f-display:"Karantina","Arial Narrow",sans-serif; --f-body:"IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme:light; }
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:#F3F7FB;color:var(--ink);font-family:var(--f-body);direction:rtl;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.hud b{font-family:var(--f-display);font-size:64px;line-height:.85;color:var(--ink);font-variant-numeric:tabular-nums}
.hud small{font-size:13px;font-weight:700;background:rgba(255,255,255,.85);padding:2px 10px}
.ate{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 98px);transform:translateX(-50%);font-weight:700;font-size:14px;background:var(--accent);padding:3px 10px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.ate.on{opacity:1}
.time{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);background:rgba(19,35,58,.8);color:#fff;padding:4px 10px;font-family:var(--f-display);font-size:26px;pointer-events:none;font-variant-numeric:tabular-nums}
.menu{position:fixed;inset:0;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);background:linear-gradient(rgba(243,247,251,.2),rgba(13,21,34,.8) 50%);display:flex;flex-direction:column;justify-content:flex-end;gap:14px;touch-action:auto}
.menu h1{margin:0;font-family:var(--f-display);font-size:64px;line-height:.9;color:#fff;text-shadow:0 3px 0 var(--ink)}
.menu p{margin:0;color:#fff;font-size:14px;line-height:1.45;max-width:36em}
.res{background:#fff;padding:14px;display:flex;flex-direction:column;gap:6px;transform:rotate(-2deg)}
.res .big{font-family:var(--f-display);font-size:60px;line-height:.85;font-variant-numeric:tabular-nums}
.res small{color:#4B5A6F;font-size:13px}
.res .list{display:flex;flex-wrap:wrap;gap:4px;font-size:20px}
.go-btn{font:inherit;min-height:60px;border:0;background:var(--accent);color:var(--ink);font-family:var(--f-display);font-size:34px;cursor:pointer;box-shadow:0 5px 0 var(--ink)}
.snd{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font:inherit;min-width:44px;min-height:44px;border:0;background:rgba(19,35,58,.7);color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
<canvas id="game" aria-label="כדור שלג מתגלגל במורד ההר"></canvas>
<div class="hud" id="hud" hidden><b id="size">0.2</b><small>מטר קוטר</small></div>
<div class="ate" id="ate"></div>
<div class="time" id="time" hidden>2:00</div>
<button class="snd" id="snd" type="button" aria-pressed="false" aria-label="צליל">🔇</button>
<section class="menu" id="menu">
  <h1>כדור השלג</h1>
  <p>כדור שלג קטן בראש המדרון. שתי דקות עד הכפר. מזיזים אותו באצבע לצדדים, והוא בולע כל מה שקטן ממנו: כפפות, מגלשיים, אנשי שלג, חתול שלג, ובסוף אולי גם בקתה.</p>
  <div class="res" id="res" hidden><small id="resSmall"></small><div class="big" id="resBig"></div><div class="list" id="resList"></div><small id="resBest"></small></div>
  <button class="go-btn" id="go" type="button">לגלגל</button>
</section>
<script>
// things on the mountain, by size (metres)
const KINDS=[{e:'❄️',s:.06,n:'פתית'},{e:'🌰',s:.1,n:'אצטרובל'},{e:'🧤',s:.18,n:'כפפה'},{e:'🥽',s:.22,n:'משקפת'},{e:'🧢',s:.28,n:'כובע'},{e:'🥟',s:.32,n:'חצ׳אפורי'},{e:'🎒',s:.5,n:'תיק'},{e:'🐕',s:.9,n:'כלב'},{e:'🛷',s:1.2,n:'מזחלת'},{e:'🏂',s:1.5,n:'סנובורד'},{e:'🎿',s:1.8,n:'מגלשיים'},{e:'⛄',s:2,n:'איש שלג'},{e:'🚩',s:2.4,n:'שלט'},{e:'🌲',s:4,n:'עץ'},{e:'🚐',s:5.5,n:'מיניבוס'},{e:'🚜',s:7,n:'חתול שלג'},{e:'🛖',s:10,n:'בקתה'},{e:'🚡',s:14,n:'תחנת רכבל'},{e:'🏨',s:24,n:'מלון'}];
const store={get(k,d){try{const v=localStorage.getItem('rl-'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('rl-'+k,JSON.stringify(v));}catch(e){}}};
const $=id=>document.getElementById(id); const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=$('game'), cx=cv.getContext('2d'); let W=0,H=0; function resize(){ const d=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*d; cv.height=H*d; cx.setTransform(d,0,0,d,0,0); } addEventListener('resize',resize); resize();
let B, items, stuck, eaten, state='menu', t=0, T=120, target=null, spawnY=0, sc=40, roll=0, shake=0;
function start(){ B={x:0,y:0,r:.1,vx:0,v:4}; items=[]; stuck=[]; eaten={}; t=0; spawnY=0; roll=0; target=null; $('menu').hidden=true; ['hud','time'].forEach(id=>$(id).hidden=false); state='play'; spawnAhead(); }
// keep the slope ahead full: mostly things a bit smaller than the ball, some bigger to dodge
function spawnAhead(){ const view=Math.max(20, B.r*40); while(spawnY < B.y+view*1.4){ spawnY += Math.max(.4, B.r*1.1)*(.5+Math.random());
  const wide=Math.max(8,B.r*16); for(let k=0;k<2;k++){ const want=B.r*2*(Math.random()<.78 ? .15+Math.random()*.5 : 1.1+Math.random()*1.4); let best=KINDS[0]; for(const K of KINDS) if(Math.abs(Math.log(K.s/want))<Math.abs(Math.log(best.s/want))) best=K;
    items.push({k:best, x:(Math.random()*2-1)*wide, y:spawnY+Math.random()*2, s:best.s*(.8+Math.random()*.4), rot:(Math.random()-.5)*.6}); } } }
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); target=e.clientX; try{ cv.setPointerCapture(e.pointerId);}catch(_){} }); cv.addEventListener('pointermove',e=>{ if(target!=null) target=e.clientX; }); ['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{ target=null; }));
const keys={}; addEventListener('keydown',e=>{ keys[e.code]=true; }); addEventListener('keyup',e=>{ keys[e.code]=false; });
$('go').onclick=()=>start();
let AC=null, soundOn=false; $('snd').onclick=e=>{ e.stopPropagation(); soundOn=!soundOn; $('snd').textContent=soundOn?'🔊':'🔇'; if(soundOn&&!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){ AC=null; } } };
function pop(size){ if(!soundOn||!AC) return; const o=AC.createOscillator(), g=AC.createGain(); const f=Math.max(120, 900-Math.log(size+1)*260); o.type='sine'; o.frequency.setValueAtTime(f,AC.currentTime); o.frequency.exponentialRampToValueAtTime(f*1.6,AC.currentTime+.08); g.gain.setValueAtTime(.18,AC.currentTime); g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.12); o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+.13); }
let ateT=0; function told(K){ const el=$('ate'); el.textContent=K.e+' '+K.n; el.classList.add('on'); ateT=.8; }
let last=performance.now();
function frame(now){ const dt=Math.min(.05,(now-last)/1000); last=now; if(state==='play') update(dt); draw(); requestAnimationFrame(frame); }
function update(dt){ t+=dt; const left=Math.max(0,T-t); $('time').textContent=Math.floor(left/60)+':'+String(Math.floor(left%60)).padStart(2,'0');
  // the ball rolls down by itself; the finger steers it sideways
  B.v = 3.5 + B.r*2.2; let want=0; if(target!=null) want=((target-W/2)/sc + camX - B.x)*2.5; if(keys.ArrowLeft) want=-B.v; if(keys.ArrowRight) want=B.v;
  B.vx += (Math.max(-B.v*1.2,Math.min(B.v*1.2,want))-B.vx)*Math.min(1,dt*4); B.x+=B.vx*dt; B.y+=B.v*dt; roll+=B.v*dt/Math.max(.05,B.r);
  for(const it of items){ if(it.gone) continue; const d=Math.hypot(it.x-B.x,it.y-B.y); if(d>B.r+it.s*.5) continue;
    if(it.s < B.r*1.3){ // small enough: it sticks, and the ball grows by its volume
      it.gone=true; B.r=Math.sqrt(B.r**2 + 1.0*(it.s/2)**2) + .001; /* grows by the area it rolls up */ eaten[it.k.n]=(eaten[it.k.n]||0)+1; told(it.k); pop(it.s);
      stuck.push({e:it.k.e, a:Math.random()*Math.PI*2, s:Math.min(it.s, B.r*.7)}); if(stuck.length>60) stuck.shift(); try{ navigator.vibrate&&navigator.vibrate(6); }catch(_){} }
    else { // too big: bounce off and lose a little snow
      const nx=(B.x-it.x)/Math.max(.01,d)||1; B.vx=Math.sign(nx||1)*B.v*1.2; B.x=it.x+Math.sign(nx||1)*(B.r+it.s*.5+.05); if(!it.bumped){ B.r*=.94; shake=reduce?0:8; it.bumped=1; } } }
  items=items.filter(it=>!it.gone && it.y>B.y-B.r*12-10); spawnAhead();
  if(ateT>0){ ateT-=dt; if(ateT<=0) $('ate').classList.remove('on'); } shake=Math.max(0,shake-dt*30);
  $('size').textContent=(B.r*2)<10?(B.r*2).toFixed(1):Math.round(B.r*2);
  if(t>=T) finish(); }
function finish(){ state='menu'; ['hud','time'].forEach(id=>$(id).hidden=true); const d=B.r*2, best=store.get('best',0); if(d>best) store.set('best',d);
  $('res').hidden=false; $('resSmall').textContent='כדור השלג שלך הגיע לכפר בקוטר של'; $('resBig').textContent=(d<10?d.toFixed(1):Math.round(d))+' מ׳';
  $('resList').innerHTML=KINDS.filter(K=>eaten[K.n]).map(K=>`<span title="${K.n}">${K.e}×${eaten[K.n]}</span>`).join(' ');
  const biggest=[...KINDS].reverse().find(K=>eaten[K.n]); $('resBest').textContent=(biggest?'הדבר הכי גדול שבלעת: '+biggest.n+'. ':'')+(d>best?'שיא חדש!':'השיא: '+(best<10?best.toFixed(1):Math.round(best))+' מ׳');
  $('go').textContent='עוד כדור'; $('menu').hidden=false; }
let camX=0, camY=0;
function draw(){ const r=B?B.r:.1; const want=Math.min(W,H*.8)/(4+r*14); sc = sc? sc+(want-sc)*.05 : want;
  if(B){ camX+= (B.x-camX)*.08; camY=B.y+ (H*.18)/sc; }
  cx.fillStyle='#F3F7FB'; cx.fillRect(0,0,W,H); cx.save(); if(shake) cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const X=x=>W/2+(x-camX)*sc, Y=y=>H*.5+(y-camY)*sc;
  // corduroy lines, spaced to the zoom so the slope always feels like it moves
  const gap=Math.max(.5,r*1.2); cx.strokeStyle='rgba(150,175,200,.25)'; cx.lineWidth=1; for(let y=Math.floor((camY-H*.5/sc)/gap)*gap; y<camY+H*.5/sc; y+=gap){ cx.beginPath(); cx.moveTo(0,Y(y)); cx.lineTo(W,Y(y)+gap*sc*.2); cx.stroke(); }
  // the track the ball pressed into the snow
  if(B){ cx.fillStyle='rgba(170,195,220,.35)'; cx.fillRect(X(B.x)-B.r*sc*.8, Y(B.y-30), B.r*sc*1.6, Y(B.y)-Y(B.y-30)); }
  if(items) for(const it of items){ const px=X(it.x), py=Y(it.y), sz=it.s*sc; if(py<-sz||py>H+sz||px<-sz||px>W+sz) continue; cx.globalAlpha = it.s<B.r*1.3?1:.95;
    cx.fillStyle='rgba(19,35,58,.12)'; cx.beginPath(); cx.ellipse(px+sz*.1,py+sz*.35,sz*.45,sz*.15,0,0,7); cx.fill();
    cx.save(); cx.translate(px,py); cx.rotate(it.rot); cx.font=`${Math.max(6,sz)}px serif`; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(it.k.e,0,0); cx.restore();
    if(it.s>=B.r*1.3 && sz>14){ cx.strokeStyle='rgba(209,52,43,.3)'; cx.lineWidth=1.5; cx.beginPath(); cx.arc(px,py,sz*.55,0,7); cx.stroke(); } cx.globalAlpha=1; }
  // the ball, with what it has picked up rolling round on it
  if(B&&state==='play'){ const px=X(B.x), py=Y(B.y), R=B.r*sc; cx.fillStyle='rgba(19,35,58,.15)'; cx.beginPath(); cx.ellipse(px+R*.15,py+R*.25,R*1.05,R*.9,0,0,7); cx.fill();
    const g=cx.createRadialGradient(px-R*.35,py-R*.4,R*.1,px,py,R); g.addColorStop(0,'#FFFFFF'); g.addColorStop(1,'#C9D8E7'); cx.fillStyle=g; cx.beginPath(); cx.arc(px,py,R,0,7); cx.fill();
    cx.save(); cx.beginPath(); cx.arc(px,py,R,0,7); cx.clip(); for(const s of stuck){ const a=s.a+roll, yy=Math.sin(a), vis=Math.cos(a); if(vis<0) continue; const sz=Math.max(5,s.s*sc*.9); cx.globalAlpha=.5+vis*.5; cx.font=`${sz}px serif`; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(s.e, px+Math.sin(s.a*3.1)*R*.55, py - yy*R*.75); } cx.globalAlpha=1; cx.restore(); }
  cx.restore(); }
requestAnimationFrame(frame);
</script>
